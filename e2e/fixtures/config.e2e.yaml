provider: claude
language: en
assistant:
  # The TUI runs in a PTY; an unset formal_spec would ask the Y/n question
  # before Ink mounts and every spec would time out waiting for the input box.
  formal_spec: false
logging:
  level: info
provider_options:
  codex:
    network_access: true
  opencode:
    network_access: true
notification_sound: false
notification_sound_events:
  iteration_limit: false
  workflow_complete: false
  workflow_abort: false
  run_complete: true
  run_abort: false
provider_profiles:
  cursor:
    default_permission_mode: full
