name: e2e-simple
description: Minimal E2E test workflow
personas:
  test-coder: |
    You are the E2E test coder.
max_steps: 5
steps:
  - name: execute
    edit: true
    persona: test-coder
    capabilities: edit
    required_permission_mode: edit
    instruction: |
      {task}
    rules:
      - condition: Task completed
        next: COMPLETE
