name: e2e-finding-contract-manager-provider
description: Verify the synthesized finding manager provider/model resolution during mock workflow execution
workflow_config:
  provider: mock
  model: manager-mock-model
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
instructions:
  findings-manager: |
    Reconcile reviewer raw findings into the finding ledger.
report_formats:
  review-finding-contract: |
    Return a concise review report.
  findings-manager: |
    Return the finding manager JSON contract.
finding_contract:
  manager:
    persona: findings-manager.md
    instruction: findings-manager
    output_contract: findings-manager
max_steps: 3
initial_step: review
steps:
  - name: review
    parallel:
      - name: architecture-review
        persona: ./agents/architecture-review.md
        instruction: |
          Review the task and return no findings.
        output_contracts:
          report:
            - name: architecture-review.md
              format: review-finding-contract
        rules:
          - condition: approved
          - condition: needs_fix
      - name: security-review
        persona: ./agents/security-review.md
        instruction: |
          Review the task and return no findings.
        output_contracts:
          report:
            - name: security-review.md
              format: review-finding-contract
        rules:
          - condition: approved
          - condition: needs_fix
    rules:
      - condition: all("approved") && when(findings.open.count == 0)
        next: COMPLETE
      - condition: any("needs_fix")
        next: fix
  - name: fix
    persona: review-agent.md
    instruction: |
      This step should not run in the manager provider E2E scenario.
    rules:
      - condition: fixed
        next: review
