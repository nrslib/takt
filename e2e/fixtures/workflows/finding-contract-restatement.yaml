name: e2e-finding-contract-restatement
description: Verify one-round reviewer anomaly restatement promotion
# resume は bootstrap の CLI --provider mock を引き継がない。レビュアーと manager に
# 加えて、正規化係（既定解決＝ワークフロー階層）も mock へ落とすために workflow
# 既定を明示する。ここが抜けると正規化係だけ実プロバイダへ出ていく。
workflow_config:
  provider: mock
  model: mock-model
instructions:
  findings-manager: Reconcile Finding Contract claims without inventing changes.
report_formats:
  restatement-review-finding-contract: Return the review report body.
finding_contract:
  manager:
    persona: findings-manager.md
    instruction: findings-manager
    output_contract: findings-manager
max_steps: 3
initial_step: review
steps:
  - name: review
    provider: mock
    model: mock-model
    persona: ./agents/architecture-review-restatement.md
    instruction: Restate the assigned reviewer claim and return the review report.
    output_contracts:
      report:
        - name: review.md
          format: restatement-review-finding-contract
    rules:
      - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0)
        next: review
      - condition: when(findings.open.count == 1)
        next: COMPLETE
