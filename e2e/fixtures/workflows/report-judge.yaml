name: e2e-report-judge
description: E2E workflow that exercises report + judge phases
personas:
  test-reporter: |
    You are the E2E test reporter.
max_steps: 3
steps:
  - name: execute
    edit: true
    persona: ./agents/test-reporter.md
    capabilities: edit
    required_permission_mode: edit
    output_contracts:
      report:
        - name: report.md
          format: report
    instruction: |
      {task}
    rules:
      - condition: Done
        next: COMPLETE
      - condition: Needs fix
        next: ABORT
