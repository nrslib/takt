# Everything `readonly` grants, plus creating and editing files.
claude:
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Edit
    - Write
    - Bash
    - WebSearch
    - WebFetch
opencode:
  allowed_tools:
    - read
    - glob
    - grep
    - edit
    - write
    - bash
    - todowrite
    - websearch
    - webfetch
  network_access: true
codex:
  network_access: true
