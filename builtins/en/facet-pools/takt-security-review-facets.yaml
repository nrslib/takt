  security-local: ../facets/knowledge/security-local.md
  security-data: ../facets/knowledge/security-data.md
  security-dependencies: ../facets/knowledge/security-dependencies.md
candidates:
  - id: orchestration
    description: Review TAKT workflow resolution, providers, sessions, resume, permissions, and selector trust boundaries.
    knowledge: takt-security
  - id: cli
    description: Review TAKT CLI, subprocess, worktree, path, local configuration, and sensitive-data boundaries.
