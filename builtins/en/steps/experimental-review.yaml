params:
  review_policy_additions:
    type: facet_ref[]
    facet_kind: policy
  review_knowledge_additions:
    type: facet_ref[]
    facet_kind: knowledge
  security_review_pool:
    type: facet_pool_ref
  architecture_review_instruction: { type: facet_ref, facet_kind: instruction }
  security_review_instruction: { type: facet_ref, facet_kind: instruction }
  testing_review_instruction: { type: facet_ref, facet_kind: instruction }
  coding_review_instruction: { type: facet_ref, facet_kind: instruction }
  ai_antipattern_review_instruction: { type: facet_ref, facet_kind: instruction }
  frontend_review_instruction: { type: facet_ref, facet_kind: instruction }

name: review
tags: [review]
parallel:
  fixed:
    - name: coding-review
      capabilities: readonly
      tags: [review]
      edit: false
      persona: coding-reviewer
      policy:
        - contract-change
        - review
        - coding
        - testing
        - $param: review_policy_additions
      knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - $param: review_knowledge_additions
      instruction:
        $param: coding_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: coding-review.md
            format: coding-review
    - name: ai-antipattern-review
      capabilities: readonly
      tags: [review]
      edit: false
      persona: ai-antipattern-reviewer
      policy:
        - contract-change
        - review
        - ai-antipattern
        - $param: review_policy_additions
      knowledge:
        - architecture
        - $param: review_knowledge_additions
      instruction:
        $param: ai_antipattern_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: ai-antipattern-review.md
            format: ai-antipattern-review
  pool:
    - name: architecture-review
      description: Review module structure, responsibility boundaries, dependency direction, and call paths.
      capabilities: readonly
      tags: [review]
      edit: false
      persona: architecture-reviewer
      policy: [contract-change, review]
      knowledge: architecture
      instruction:
        $param: architecture_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: architecture-review.md
            format: architecture-review
    - name: frontend-review
      description: Review UI, components, state management, accessibility, and presentation.
      capabilities: readonly
      tags: [review]
      edit: false
      persona: frontend-reviewer
      policy: [contract-change, review]
      knowledge: [frontend, react]
      instruction:
        $param: frontend_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: frontend-review.md
            format: frontend-review
    - name: backend-review
      description: Review APIs, domain logic, server-side processing, and persistence.
      capabilities: readonly
      tags: [review]
      edit: false
      persona: coding-reviewer
      policy: [contract-change, review, coding]
      knowledge: [backend, architecture]
      instruction:
        $param: coding_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: backend-review.md
            format: coding-review
    - name: security-review
      description: Do not select by default. Select only when (a) the change may affect secrets, credentials, external-input handling, process execution, filesystem, network, or terminal boundaries, permissions, or sandboxing, or (b) the change is large enough that security impact cannot be confidently ruled out. Do not select for documentation-only, comment-only, or test-only changes, or small localized fixes.
      capabilities: readonly
      tags: [review]
      edit: false
      persona: security-reviewer
      policy: [contract-change, security-review]
      knowledge: [security, security-data, security-dependencies]
      dynamic_facets:
        pool:
          $param: security_review_pool
        selector:
          instruction: >-
            Inspect the changed content and the target agent prompt, not only changed filenames. Identify who controls each input, which trust or authority boundary it crosses, and which processing or asset it reaches, then select every candidate whose description applies. If no candidate applies, return an empty array; the security reviewer will still perform the minimal review with only its fixed generic Knowledge. If input is missing or truncated and non-applicability cannot be determined, select every candidate that may apply.
      instruction:
        $param: security_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: security-review.md
            format: security-review
    - name: testing-review
      description: Review test coverage, test design, integration boundaries, and E2E boundaries.
      capabilities: readonly
      tags: [review]
      edit: false
      persona: testing-reviewer
      policy: [contract-change, review, testing]
      knowledge: [unit-testing, e2e-testing]
      instruction:
        $param: testing_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: testing-review.md
            format: testing-review
  selection:
    mode: replace
    selector:
      instruction: >-
        Select only pool candidates whose description conditions apply to the changed content. Do not select security-review unless the conditions in its description apply.
