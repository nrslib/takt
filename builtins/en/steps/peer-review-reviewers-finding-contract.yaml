params:
  review_policy_additions:
    type: facet_ref[]
    facet_kind: policy
  review_knowledge_additions:
    type: facet_ref[]
    facet_kind: knowledge
  security_reviewer_persona:
    type: facet_ref
    facet_kind: persona
    default: security-reviewer
  security_review_knowledge:
    type: facet_ref[]
    facet_kind: knowledge
    default: [security, security-web, security-api, security-local, security-data, security-dependencies]
name: reviewers
tags:
  - review
parallel:
  - name: arch-review
    capabilities: readonly
    tags:
      - review
    edit: false
    persona: architecture-reviewer
    policy:
      - contract-change
      - review
      - $param: review_policy_additions
    knowledge:
      - architecture
      - $param: review_knowledge_additions
    instruction: review-arch
    output_contracts:
      report:
        - name: architect-review.md
          format: architecture-review-finding-contract
  - name: security-review
    capabilities: readonly
    tags:
      - review
    edit: false
    persona:
      $param: security_reviewer_persona
    policy:
      - contract-change
      - $param: review_policy_additions
      - security-review
    knowledge:
      - $param: security_review_knowledge
      - $param: review_knowledge_additions
    instruction: review-security
    output_contracts:
      report:
        - name: security-review.md
          format: security-review-finding-contract
  - name: testing-review
    capabilities: readonly
    tags:
      - review
    edit: false
    persona: testing-reviewer
    policy:
      - contract-change
      - review
      - testing
      - $param: review_policy_additions
    knowledge:
      - unit-testing
      - e2e-testing
      - takt
      - $param: review_knowledge_additions
    instruction: review-test
    output_contracts:
      report:
        - name: testing-review.md
          format: testing-review-finding-contract
  - name: coding-review
    capabilities: readonly
    tags:
      - review
    edit: false
    persona: coding-reviewer
    policy:
      - contract-change
      - review
      - coding
      - $param: review_policy_additions
    knowledge:
      - takt
      - $param: review_knowledge_additions
    pass_previous_response: false
    instruction: review-coding
    output_contracts:
      report:
        - name: coding-review.md
          format: coding-review-finding-contract
  - name: ai-antipattern-review-2nd
    capabilities: readonly
    tags:
      - review
    edit: false
    persona: ai-antipattern-reviewer
    policy:
      - contract-change
      - review
      - ai-antipattern
      - $param: review_policy_additions
    knowledge:
      - takt
      - $param: review_knowledge_additions
    instruction: ai-antipattern-review
    output_contracts:
      report:
        - name: ai-antipattern-review.md
          format: ai-antipattern-review-finding-contract
