params:
  fix_policy:
    type: facet_ref[]
    facet_kind: policy
  fix_knowledge:
    type: facet_ref[]
    facet_kind: knowledge
tags:
  - coding
capabilities: readonly
parallel:
  - name: ai-antipattern-fix-parallel
    capabilities: edit
    tags:
      - coding
    edit: true
    persona: coder
    policy:
      - contract-change
      - $param: fix_policy
    knowledge:
      $param: fix_knowledge
    required_permission_mode: edit
    instruction: ai-antipattern-fix
    output_contracts:
      report:
        - name: ai-antipattern-fix-report.md
          format: fix-report
          use_judge: false
  - name: supervise_fix_parallel
    capabilities: edit
    tags:
      - coding
    edit: true
    persona: coder
    policy:
      - contract-change
      - $param: fix_policy
    knowledge:
      $param: fix_knowledge
    required_permission_mode: edit
    instruction: fix-supervisor
