params:
  fix_policy:
    type: facet_ref[]
    facet_kind: policy
  fix_knowledge:
    type: facet_ref[]
    facet_kind: knowledge
description: Fix the findings from the AI antipattern review and the supervisor in parallel.
tags:
  - coding
capabilities: readonly
parallel:
  - name: ai-antipattern-fix-parallel
    description: Check the AI review findings against the actual code, fix the issues, and report the results.
    capabilities: edit
    tags:
      - coding
    edit: true
    persona: coder
    policy:
      - contract-change
      - $param: fix_policy
    knowledge:
      $param: fix_knowledge
    required_permission_mode: edit
    instruction: ai-antipattern-fix
    output_contracts:
      report:
        - name: ai-antipattern-fix-report.md
          format: fix-report
  - name: supervise_fix_parallel
    description: Fix the supervisor findings in priority order and report the changes and verification results.
    capabilities: edit
    tags:
      - coding
    edit: true
    persona: coder
    policy:
      - contract-change
      - $param: fix_policy
    knowledge:
      $param: fix_knowledge
    required_permission_mode: edit
    instruction: fix-supervisor
