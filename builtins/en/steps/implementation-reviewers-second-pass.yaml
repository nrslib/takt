name: reviewers_2
description: Review security and code in parallel and decide whether fixes are needed.
tags:
  - review
parallel:
  - name: security-review
    description: Examine input and permission boundaries and report security problems along actual execution paths.
    tags:
      - review
    edit: false
    persona: security-reviewer
    policy:
      - contract-change
      - security-review
    knowledge: [security, security-web, security-api, security-local, security-data, security-dependencies]
    capabilities: readonly
    instruction: review-security
    output_contracts:
      report:
        - name: security-review.md
          format: security-review
  - name: coding-review
    description: Compare the changes with the requirements and report implementation defects and regressions.
    tags:
      - review
    edit: false
    persona: coding-reviewer
    policy:
      - contract-change
      - review
      - coding
    capabilities: readonly
    instruction: review-coding
    output_contracts:
      report:
        - name: coding-review.md
          format: coding-review
