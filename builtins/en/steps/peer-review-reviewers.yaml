params:
  review_policy_additions:
    type: facet_ref[]
    facet_kind: policy
  review_knowledge_additions:
    type: facet_ref[]
    facet_kind: knowledge
  architecture_review_instruction:
    type: facet_ref
    facet_kind: instruction
  security_review_instruction:
    type: facet_ref
    facet_kind: instruction
  testing_review_instruction:
    type: facet_ref
    facet_kind: instruction
  coding_review_instruction:
    type: facet_ref
    facet_kind: instruction
  ai_antipattern_review_instruction:
    type: facet_ref
    facet_kind: instruction
name: reviewers
tags:
  - review
parallel:
  - name: arch-review
    capabilities: readonly
    tags:
      - review
      - review-completion
    review_completion: {}
    edit: false
    persona: architecture-reviewer
    policy:
      - contract-change
      - review
      - $param: review_policy_additions
    knowledge:
      - architecture
      - $param: review_knowledge_additions
    instruction:
      $param: architecture_review_instruction
    output_contracts:
      report:
        - name: architect-review.md
          format: architecture-review
  - name: security-review
    capabilities: readonly
    tags:
      - review
      - review-completion
    review_completion: {}
    edit: false
    persona: security-reviewer
    policy:
      - contract-change
      - $param: review_policy_additions
      - security-review
    knowledge:
      - security
      - security-web
      - security-api
      - security-local
      - security-data
      - security-dependencies
      - takt
      - $param: review_knowledge_additions
    instruction:
      $param: security_review_instruction
    output_contracts:
      report:
        - name: security-review.md
          format: security-review
  - name: testing-review
    capabilities: readonly
    tags:
      - review
      - review-completion
    review_completion: {}
    edit: false
    persona: testing-reviewer
    policy:
      - contract-change
      - review
      - testing
      - $param: review_policy_additions
    knowledge:
      - unit-testing
      - e2e-testing
      - takt
      - $param: review_knowledge_additions
    instruction:
      $param: testing_review_instruction
    output_contracts:
      report:
        - name: testing-review.md
          format: testing-review
  - name: coding-review
    capabilities: readonly
    tags:
      - review
      - review-completion
    review_completion: {}
    edit: false
    persona: coding-reviewer
    policy:
      - contract-change
      - review
      - coding
      - $param: review_policy_additions
    knowledge:
      - takt
      - $param: review_knowledge_additions
    pass_previous_response: false
    instruction:
      $param: coding_review_instruction
    output_contracts:
      report:
        - name: coding-review.md
          format: coding-review
  - name: ai-antipattern-review-2nd
    capabilities: readonly
    tags:
      - review
      - review-completion
    review_completion: {}
    edit: false
    persona: ai-antipattern-reviewer
    policy:
      - contract-change
      - review
      - ai-antipattern
      - $param: review_policy_additions
    knowledge:
      - takt
      - $param: review_knowledge_additions
    instruction:
      $param: ai_antipattern_review_instruction
    output_contracts:
      report:
        - name: ai-antipattern-review.md
          format: ai-antipattern-review
