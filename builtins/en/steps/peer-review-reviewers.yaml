params:
  review_policy_additions:
    type: facet_ref[]
    facet_kind: policy
  review_knowledge_additions:
    type: facet_ref[]
    facet_kind: knowledge
  security_review_knowledge_additions:
    type: facet_ref[]
    facet_kind: knowledge
  security_review_pool:
    type: facet_pool_ref
  architecture_review_instruction:
    type: facet_ref
    facet_kind: instruction
  security_review_instruction:
    type: facet_ref
    facet_kind: instruction
  testing_review_instruction:
    type: facet_ref
    facet_kind: instruction
  coding_review_instruction:
    type: facet_ref
    facet_kind: instruction
  ai_antipattern_review_instruction:
    type: facet_ref
    facet_kind: instruction
name: reviewers
description: Review design, tests, and code in parallel by specialty and decide whether fixes are needed.
tags:
  - review
parallel:
  fixed:
    - name: arch-review
      description: Check structure, responsibilities, dependencies, and call paths and report design problems.
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: architecture-reviewer
      policy:
        - architecture
        - contract-change
        - review
        - $param: review_policy_additions
      knowledge:
        - architecture
        - $param: review_knowledge_additions
      instruction:
        $param: architecture_review_instruction
      output_contracts:
        report:
          - name: architect-review.md
            format: architecture-review
    - name: testing-review
      description: Compare implemented tests with the requirements and report verification gaps and test design problems.
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: testing-reviewer
      policy:
        - testing
        - takt
        - contract-change
        - review
        - $param: review_policy_additions
      knowledge:
        - unit-testing
        - e2e-testing
        - takt
        - $param: review_knowledge_additions
      instruction:
        $param: testing_review_instruction
      output_contracts:
        report:
          - name: testing-review.md
            format: testing-review
    - name: coding-review
      description: Compare the changes with the requirements and report implementation defects and regressions.
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: coding-reviewer
      policy:
        - takt
        - contract-change
        - review
        - coding
        - $param: review_policy_additions
      knowledge:
        - takt
        - $param: review_knowledge_additions
      pass_previous_response: false
      instruction:
        $param: coding_review_instruction
      output_contracts:
        report:
          - name: coding-review.md
            format: coding-review
    - name: ai-antipattern-review-2nd
      description: Check for implementation problems typical of AI-generated code and report findings that require fixes.
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: ai-antipattern-reviewer
      policy:
        - ai-antipattern
        - takt
        - contract-change
        - review
        - $param: review_policy_additions
      knowledge:
        - takt
        - $param: review_knowledge_additions
      instruction:
        $param: ai_antipattern_review_instruction
      output_contracts:
        report:
          - name: ai-antipattern-review.md
            format: ai-antipattern-review
  pool:
    - name: security-review
      description: Review changes involving secrets, external input, permissions, and external boundaries for security issues.
      selection_hint: Do not select by default. Select only when (a) the change may affect secret or credential handling, external-input handling, process execution, filesystem operations, network or terminal boundaries, sandboxing, or permissions, or (b) the change is large enough that security impact cannot be confidently ruled out. Even when the change is documentation-only, comment-only, test-only, or a small localized fix, select it if (a) or (b) applies. Do not select it if neither applies.
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: security-reviewer
      policy:
        - contract-change
        - security-review
        - $param: review_policy_additions
      knowledge:
        - security
        - security-data
        - security-dependencies
        - $param: security_review_knowledge_additions
      dynamic_facets:
        pool:
          $param: security_review_pool
        selector:
          instruction: select-applicable-candidates
      instruction:
        $param: security_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: security-review.md
            format: security-review
  selection:
    selector:
      instruction: select-applicable-candidates
