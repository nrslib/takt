name: peer-review-suite-base
description: Shared specialist reviewer suite with injectable domain review context.
subworkflow:
  callable: true
  visibility: internal
  returns:
    - needs_fix
  params:
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default: []
    architecture_review_instruction:
      type: facet_ref
      facet_kind: instruction
      default: architecture-review
    security_review_instruction:
      type: facet_ref
      facet_kind: instruction
      default: security-review
    testing_review_instruction:
      type: facet_ref
      facet_kind: instruction
      default: testing-review
    coding_review_instruction:
      type: facet_ref
      facet_kind: instruction
      default: coding-review
    ai_antipattern_review_instruction:
      type: facet_ref
      facet_kind: instruction
      default: ai-antipattern-review
    frontend_review_instruction:
      type: facet_ref
      facet_kind: instruction
      default: frontend-review
    cqrs_es_review_instruction:
      type: facet_ref
      facet_kind: instruction
      default: cqrs-es-review
initial_step: reviewers
steps:
  - name: reviewers
    uses: peer-review-reviewers
    with:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
      architecture_review_instruction:
        $param: architecture_review_instruction
      security_review_instruction:
        $param: security_review_instruction
      testing_review_instruction:
        $param: testing_review_instruction
      coding_review_instruction:
        $param: coding_review_instruction
      ai_antipattern_review_instruction:
        $param: ai_antipattern_review_instruction
    rules:
      self:
        - condition: any("error")
          next: reviewers
        - condition: all("approved")
          next: COMPLETE
        - condition: any("needs_fix")
          return: needs_fix
      parallel:
        arch-review: [{ condition: approved }, { condition: needs_fix }]
        security-review: [{ condition: approved }, { condition: needs_fix }]
        testing-review: [{ condition: approved }, { condition: needs_fix }]
        coding-review: [{ condition: approved }, { condition: needs_fix }]
        ai-antipattern-review-2nd: [{ condition: approved }, { condition: needs_fix }]
