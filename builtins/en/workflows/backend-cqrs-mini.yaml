name: backend-cqrs-mini
description: CQRS+ES-focused mini development workflow (plan -> implement -> parallel review -> fix if needed -> complete)
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
        - cqrs-es
        - architecture
        - backend
      plan_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
      plan_report_format: plan
      development_policy:
        - coding
        - testing
        - cqrs-es
        - architecture
        - backend
      development_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
      supervisor_persona: supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
