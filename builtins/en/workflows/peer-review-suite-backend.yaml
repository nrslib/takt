name: peer-review-suite-backend
description: Common review suite configured with the Backend Security Reviewer.
subworkflow:
  callable: true
  visibility: internal
  returns:
    - needs_fix
  params:
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default: []
initial_step: reviewers
steps:
  - name: reviewers
    kind: workflow_call
    call: peer-review-suite-base
    args:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
      security_reviewer_persona: backend-security-reviewer
      security_review_knowledge: [security, security-api, security-data, security-dependencies]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_fix
        return: needs_fix
