name: peer-review-suite-finding-contract-takt
description: Finding Contract review suite configured with the TAKT Security Reviewer.
subworkflow:
  callable: true
  visibility: internal
  requires_finding_contract: true
  returns: [needs_fix, needs_review, needs_terminal_adjudication, need_replan]
  params:
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default: []
initial_step: reviewers
steps:
  - name: reviewers
    kind: workflow_call
    call: peer-review-suite-finding-contract-base
    args:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
      security_reviewer_persona: takt-security-reviewer
      security_review_knowledge: [takt, security, security-local, security-data, security-dependencies]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_fix
        return: needs_fix
      - condition: needs_review
        return: needs_review
      - condition: needs_terminal_adjudication
        return: needs_terminal_adjudication
      - condition: need_replan
        return: need_replan
