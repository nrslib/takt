name: caccia
description: Review CodeRabbit threads, fix valid findings, and write a decision report for one iteration.
max_steps: 1
initial_step: address

steps:
  - name: address
    description: Validate all CodeRabbit threads, fix valid findings, and record the decision and rationale for each thread.
    tags:
      - implementation
    capabilities: edit
    edit: true
    persona: coder
    policy: caccia-review
    instruction: caccia
    output_contracts:
      report:
        - name: caccia-decisions.json
          format: caccia-decisions
    rules:
      - condition: The report outcome is complete, all valid findings are fixed, and every thread has a decision
        next: COMPLETE
      - condition: The report outcome is abort or the required decision report is incomplete
        next: ABORT
