name: merge-review-fix
description: Review, fix and merge a PR after CI passes
max_steps: 75
initial_step: identify
steps:
  - name: identify
    mode: system
    system_inputs:
      - type: pr_status
        source: current_pr
        as: pr
    rules:
      - condition: when(true)
        next: sync
  - name: sync
    mode: system
    effects:
      - type: sync_with_root
        pr: "{context:identify.pr.number}"
    rules:
      - condition: when(effect.sync.sync_with_root.success == true)
        next: review
      - condition: when(effect.sync.sync_with_root.conflicted == true)
        next: resolve_conflicts
      - condition: when(true)
        next: sync_failed
  - name: resolve_conflicts
    mode: system
    effects:
      - type: resolve_conflicts_with_ai
        pr: "{context:identify.pr.number}"
    rules:
      - condition: when(effect.resolve_conflicts.resolve_conflicts_with_ai.success == true)
        next: review
      - condition: when(true)
        next: conflict_failed
  - name: review
    kind: workflow_call
    call: review-fix
    rules:
      - condition: COMPLETE
        next: push
      - condition: ABORT
        next: review_failed
  - name: push
    mode: system
    effects:
      - type: commit_and_push
        pr: "{context:identify.pr.number}"
    rules:
      - condition: when(effect.push.commit_and_push.success == true)
        next: caccia
      - condition: when(true)
        next: push_failed
  - name: caccia
    mode: system
    effects:
      - type: caccia
        pr: "{context:identify.pr.number}"
    rules:
      - condition: when(effect.caccia.caccia.success == false)
        next: caccia_failed
      - condition: when(effect.caccia.caccia.outcome == "success")
        next: wait_ci
      - condition: when(effect.caccia.caccia.outcome == "skipped")
        next: wait_ci
      - condition: when(effect.caccia.caccia.outcome == "limit")
        next: caccia_limit
      - condition: when(true)
        next: ABORT
  - name: wait_ci
    mode: system
    system_inputs:
      - type: pr_status
        source: current_pr
        as: status
        rerun_from: "{effect:rerun_ci.rerun_ci.rerun}"
    wait:
      until: 'when(context.wait_ci.status.rerunHeadChanged == true || context.wait_ci.status.ci.finished == true && context.wait_ci.status.headSha == effect.caccia.caccia.headSha)'
      on_timeout: timeout
    rules:
      - condition: when(context.wait_ci.status.rerunHeadChanged == true)
        next: collect_ci_failure
      - condition: when(context.wait_ci.status.ci.passed == false)
        next: collect_ci_failure
      - condition: when(context.wait_ci.status.mergeable != "MERGEABLE")
        next: unmergeable
      - condition: when(context.wait_ci.status.reviewDecision == "CHANGES_REQUESTED")
        next: changes_requested
      - condition: when(true)
        next: merge
  - name: merge
    mode: system
    effects:
      - type: merge_pr
        pr: "{context:identify.pr.number}"
    rules:
      - condition: when(effect.merge.merge_pr.success == true)
        next: merged
      - condition: when(true)
        next: merge_failed
  - name: changes_requested
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "TAKT evaluation: approved=false. GitHub review decision is CHANGES_REQUESTED; reviewer-requested changes must be addressed before merge."
    rules:
      - condition: when(effect.changes_requested.comment_pr.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
  - name: collect_ci_failure
    mode: system
    system_inputs:
      - type: pr_ci_failure
        source: current_pr
        as: failure
        head_sha: "{effect:caccia.caccia.headSha}"
    rules:
      - condition: when(true)
        next: investigate_ci
  - name: investigate_ci
    capabilities: readonly
    edit: false
    persona: planner
    policy: merge-ci-recovery
    instruction: merge-ci-investigate
    structured_output:
      schema_ref: merge-ci-investigation
    output_contracts:
      report:
        - name: ci-investigation.md
          format: merge-ci-investigation
    rules:
      - condition: when(true)
        next: refresh_ci
  - name: refresh_ci
    mode: system
    system_inputs:
      - type: pr_status
        source: current_pr
        as: status
        rerun_from: "{effect:rerun_ci.rerun_ci.rerun}"
    rules:
      - condition: when(context.refresh_ci.status.headSha == effect.caccia.caccia.headSha && context.refresh_ci.status.ci.passed == true)
        next: wait_ci
      - condition: when(context.refresh_ci.status.headSha == effect.caccia.caccia.headSha && context.refresh_ci.status.ci.finished == false)
        next: wait_ci
      - condition: when(context.collect_ci_failure.failure.complete == false)
        next: ci_stopped
      - condition: when(context.collect_ci_failure.failure.rerunCount > 0)
        next: ci_stopped
      - condition: when(structured.investigate_ci.verdict == "defect" && context.collect_ci_failure.failure.fixRounds < 2)
        next: fix_ci
      - condition: when(structured.investigate_ci.verdict == "external")
        next: rerun_ci
      - condition: when(true)
        next: ci_stopped
  - name: fix_ci
    capabilities: edit
    edit: true
    persona: coder
    policy: merge-ci-recovery
    instruction: merge-ci-fix
    output_contracts:
      report:
        - name: ci-fix.md
          format: merge-ci-fix
    rules:
      - condition: CI root cause fixed and verified
        next: review_ci_fix
      - condition: Cannot safely fix or verify the demonstrated cause
        next: ci_stopped
  - name: review_ci_fix
    capabilities: readonly
    edit: false
    persona: coding-reviewer
    policy: merge-ci-recovery
    instruction: merge-ci-review
    structured_output:
      schema_ref: simple-review-result
    output_contracts:
      report:
        - name: ci-fix-review.md
          format: merge-ci-review
    rules:
      - condition: when(structured.review_ci_fix.result == "APPROVE")
        next: push_ci_fix
      - condition: when(true)
        next: ci_stopped
  - name: push_ci_fix
    mode: system
    effects:
      - type: commit_and_push
        pr: "{context:identify.pr.number}"
    rules:
      - condition: when(effect.push_ci_fix.commit_and_push.success == true)
        next: caccia
      - condition: when(true)
        next: ci_push_failed
  - name: rerun_ci
    mode: system
    effects:
      - type: rerun_ci
        pr: "{context:identify.pr.number}"
        failure: "{context:collect_ci_failure.failure}"
    rules:
      - condition: when(effect.rerun_ci.rerun_ci.success == true)
        next: wait_ci
      - condition: when(true)
        next: collect_ci_failure
  - name: ci_stopped
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body_format: plain_text
        body: "TAKT CI recovery stopped. Fix rounds: {context:collect_ci_failure.failure.fixRounds}; rerun count: {context:collect_ci_failure.failure.rerunCount}. Investigation: {structured:investigate_ci.summary}. Last failed checks, runs, jobs and unavailable evidence: {context:collect_ci_failure.failure.details}"
    rules:
      - condition: when(true)
        next: ABORT
  - name: ci_push_failed
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body_format: plain_text
        body: "TAKT CI recovery stopped. Fix rounds: {context:collect_ci_failure.failure.fixRounds}; rerun count: {context:collect_ci_failure.failure.rerunCount}. Investigation: {structured:investigate_ci.summary}. Last failed checks, runs, jobs and unavailable evidence: {context:collect_ci_failure.failure.details}. Push error: {effect:push_ci_fix.commit_and_push.error}"
    rules:
      - condition: when(true)
        next: ABORT
  - name: timeout
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "TAKT evaluation failed: waiting for CI exceeded 120 retries (30 minutes)."
    rules:
      - condition: when(effect.timeout.comment_pr.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
  - name: unmergeable
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "TAKT evaluation failed: mergeability is {context:wait_ci.status.mergeable}."
    rules:
      - condition: when(effect.unmergeable.comment_pr.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
  - name: review_failed
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "TAKT evaluation failed: child review workflow aborted."
    rules:
      - condition: when(effect.review_failed.comment_pr.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
  - name: merged
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "TAKT merged this PR after its review workflow completed and CI passed for head {context:wait_ci.status.headSha}."
    rules:
      - condition: when(effect.merged.comment_pr.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
  - name: sync_failed
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "TAKT evaluation failed: sync_with_root: {effect:sync.sync_with_root.error}"
    rules:
      - condition: when(effect.sync_failed.comment_pr.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
  - name: conflict_failed
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "TAKT evaluation failed: resolve_conflicts_with_ai: {effect:resolve_conflicts.resolve_conflicts_with_ai.error}"
    rules:
      - condition: when(effect.conflict_failed.comment_pr.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
  - name: push_failed
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "TAKT evaluation failed: commit_and_push: {effect:push.commit_and_push.error}"
    rules:
      - condition: when(effect.push_failed.comment_pr.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
  - name: merge_failed
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "TAKT evaluation passed but merge_pr failed: {effect:merge.merge_pr.error}"
    rules:
      - condition: when(effect.merge_failed.comment_pr.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
  - name: caccia_limit
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "Caccia reached its iteration limit. Unresolved threads: {effect:caccia.caccia.unresolvedCount}"
    rules:
      - condition: when(effect.caccia_limit.comment_pr.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
  - name: caccia_failed
    mode: system
    effects:
      - type: comment_pr
        pr: "{context:identify.pr.number}"
        body: "Caccia failed: {effect:caccia.caccia.error}"
    rules:
      - condition: when(true)
        next: ABORT
