name: simple-frontend
description: A simple development workflow that trusts a capable model's judgment and injects frontend knowledge and policies into simple-core.
max_steps: 30
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: simple-core
    args:
      plan_policy:
        - design-planning
      testing_policy:
        - coding
        - testing
        - architecture
        - frontend
        - react
      development_policy:
        - coding
        - testing
        - design-fidelity
        - architecture
        - frontend
        - react
      review_policy:
        - review
        - coding
        - testing
        - design-fidelity
        - architecture
        - frontend
        - react
      development_knowledge:
        - frontend
        - react
        - security
        - architecture
      testing_knowledge:
        - frontend
        - react
        - architecture
        - unit-testing
        - e2e-testing
      review_knowledge:
        - frontend
        - react
        - security
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
