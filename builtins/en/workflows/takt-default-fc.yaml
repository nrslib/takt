name: takt-default-fc
description: Development workflow that injects TAKT-specific facets and Finding Contract peer review into the shared development flow.
finding_contract:
  manager:
    persona: findings-manager
    instruction: findings-manager
    output_contract: findings-manager
  stop_budget:
    max_rounds: 40
  review_budget:
    max_review_rounds: 6
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy: [design-planning]
      plan_knowledge: [takt, architecture]
      testing_policy: [coding, testing]
      testing_knowledge: [takt, architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing]
      development_knowledge: [takt, architecture, task-decomposition]
      implementation_instruction: implement
      reviewer_suite: peer-review-suite-finding-contract-base
      peer_review_workflow: peer-review-finding-contract
      review_policy: [coding, testing, review]
      review_knowledge: [takt, architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
