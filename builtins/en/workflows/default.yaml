name: default
description: Test-first workflow that runs the shared development flow with standard facets.
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy: [design-planning]
      plan_knowledge: [architecture]
      testing_policy: [coding, testing]
      testing_knowledge: [architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing]
      development_knowledge: [architecture]
      implementation_instruction: implement-after-tests
      review_policy: [coding, testing, review]
      review_knowledge: [architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
