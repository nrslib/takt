name: development-implement-team
description: Team Leader implementation execution for experimental development workflows.
subworkflow:
  callable: true
  visibility: internal
  returns: [need_replan]
  params:
    implementation_pool:
      type: facet_pool_ref
      default: coding-facets
    implementation_companions:
      type: companion_ref[]
      default: []
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing, ai-antipattern]
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, implementation-semantics]
    implementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: implement
facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets
initial_step: implement
steps:
  - name: implement
    capabilities: [edit, enable-skills]
    uses: development-core-implement
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction: team-leader-implement
    team_leader:
      max_concurrency: 2
      initial_max_parts: 2
      fail_on_part_error: false
      part_tags: [coding]
      part_persona: coder
      part_edit: true
      part_permission_mode: edit
    rules:
      - condition: Implementation is complete
        next: COMPLETE
      - condition: No implementation was started (report only)
        next: COMPLETE
      - condition: Implementation cannot proceed
        return: need_replan
      - condition: User input is required
        next: implement
        requires_user_input: true
        interactive_only: true
