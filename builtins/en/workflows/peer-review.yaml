name: peer-review
description: Specialist parallel peer reviewers (+ ai-antipattern-review-2nd) -> finding adjudication -> shared remediation loop, followed by one supervisor that integrates merge-readiness checks into the final decision.
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    reviewer_suite:
      type: workflow_ref
      default: peer-review-suite-base
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - takt
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - takt
        - architecture
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    fix_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
    verification_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
initial_step: initial-reviewers
loop_monitors:
  - cycle:
      - reviewers
      - review-adjudication
      - fix-plan
      - fix
    ignore_steps:
      - fix-verifier
      - fix-retry
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: Healthy (fixes progressing and report content converging)
          next: reviewers
        - condition: Implementation incomplete or report not converged, but the next review or fix is actionable
          next: reviewers
        - condition: The remediation assumptions must change and replanning is actionable
          next: fix-plan
        - condition: No feasible action can satisfy the requirements
          next: ABORT
  - cycle:
      - reviewers
      - review-adjudication
      - final-gate
      - fix-plan
      - fix
    ignore_steps:
      - fix-verifier
      - fix-retry
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: Healthy (fixes progressing and report content converging)
          next: reviewers
        - condition: Implementation incomplete or report not converged, but the next review or fix is actionable
          next: reviewers
        - condition: The remediation assumptions must change and replanning is actionable
          next: fix-plan
        - condition: No feasible action can satisfy the requirements
          next: ABORT
  - cycle:
      - fix-plan
      - fix
    ignore_steps:
      - fix-verifier
      - fix-retry
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: Healthy (fixes progressing and report content converging)
          next: fix-plan
        - condition: Implementation incomplete or report not converged, but the next review or fix is actionable
          next: fix-plan
        - condition: The remediation assumptions must change and replanning is actionable
          next: fix-plan
        - condition: No feasible action can satisfy the requirements
          next: ABORT
  - cycle:
      - fix-retry
      - fix-verifier
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: Healthy (fixes progressing and report content converging)
          next: fix-retry
        - condition: Implementation incomplete or report not converged, but the next fix is actionable
          next: fix-retry
        - condition: The remediation assumptions must change and replanning is actionable
          next: fix-plan
        - condition: No feasible action can satisfy the requirements
          next: ABORT
steps:
  - name: initial-reviewers
    uses: peer-review-suite-call
    vars:
      review_mode: initial
    with:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: COMPLETE
        next: review-adjudication
      - condition: needs_fix
        next: review-adjudication
  - name: reviewers
    uses: peer-review-suite-call
    vars:
      review_mode: follow_up
    with:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: COMPLETE
        next: review-adjudication
      - condition: needs_fix
        next: review-adjudication
  - name: review-adjudication
    uses: peer-review-adjudication
    with:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: ACTIONABLE FINDINGS
        next: fix-plan
      - condition: NO ACTIONABLE FINDINGS
        next: final-gate
      - condition: REPLAN REQUIRED
        return: need_replan
  - name: final-gate
    uses: peer-review-final-gate
    with:
      merge_readiness_policy:
        $param: verification_policy
      review_knowledge:
        $param: review_knowledge_additions
    rules:
      - condition: MERGEABLE
        next: COMPLETE
      - condition: FIX REQUIRED
        next: fix-plan
      - condition: TASK REPLAN REQUIRED
        return: need_replan
      - condition: BLOCKED BY ENVIRONMENT
        next: ABORT
  - name: fix-plan
    uses: peer-review-fix-plan
    with:
      plan_policy:
        $param: plan_policy
      fix_knowledge:
        $param: fix_knowledge
      plan_instruction: fix-plan-from-review-resolution
    rules:
      - condition: Fix plan finalized
        next: fix
      - condition: Whole-task replanning required
        return: need_replan

  - name: fix
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: apply-fix-plan
    rules:
      - condition: Fix complete
        next: fix-verifier
      - condition: Fix plan must be revised
        next: fix-plan
      - condition: Whole-task replanning required
        return: need_replan

  - name: fix-verifier
    uses: peer-review-fix-verifier
    with:
      verification_policy:
        $param: verification_policy
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: verified
        next: reviewers
      - condition: incomplete
        next: fix-retry
      - condition: plan_invalid
        next: fix-plan

  - name: fix-retry
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: apply-fix-verification
    rules:
      - condition: Fix complete
        next: fix-verifier
      - condition: Fix plan requires revision
        next: fix-plan
      - condition: Task-level replanning required
        return: need_replan
