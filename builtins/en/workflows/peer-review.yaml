name: peer-review
description: Specialist parallel peer reviewers (+ ai-antipattern-review-2nd) -> fix planning -> fix -> fix verification loop, followed by merge-readiness review and then supervision.
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    reviewer_suite:
      type: workflow_ref
      default: peer-review-suite-base
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - takt
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - takt
        - architecture
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    fix_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
    verification_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    supervisor_persona:
      type: facet_ref
      facet_kind: persona
      default: supervisor
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 30
initial_step: reviewers
loop_monitors:
  - cycle:
      - reviewers
      - remediation
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: Healthy (fixes progressing and report content converging)
          next: reviewers
        - condition: Implementation incomplete or report not converged, but the next review or fix is actionable
          next: reviewers
        - condition: The remediation assumptions must change and replanning is actionable
          next: remediation
        - condition: No feasible action can satisfy the requirements
          next: ABORT
  - cycle:
      - reviewers
      - final-gate
      - remediation
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: Healthy (fixes progressing and report content converging)
          next: reviewers
        - condition: Implementation incomplete or report not converged, but the next review or fix is actionable
          next: reviewers
        - condition: The remediation assumptions must change and replanning is actionable
          next: remediation
        - condition: No feasible action can satisfy the requirements
          next: ABORT
steps:
  - name: reviewers
    kind: workflow_call
    call:
      $param: reviewer_suite
    args:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: COMPLETE
        next: final-gate
      - condition: needs_fix
        next: remediation
  - name: final-gate
    uses: peer-review-final-gate
    with:
      merge_readiness_policy:
        $param: verification_policy
      merge_readiness_knowledge:
        $param: review_knowledge_additions
      supervise_knowledge:
        $param: review_knowledge_additions
      supervisor_persona:
        $param: supervisor_persona
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_fix
        next: remediation
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
  - name: remediation
    uses: review-remediation
    with:
      plan_policy:
        $param: plan_policy
      fix_policy:
        $param: fix_policy
      verification_policy:
        $param: verification_policy
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: COMPLETE
        next: reviewers
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
