name: peer-review
description: Specialist parallel peer reviewers (+ ai-antipattern-review-2nd) -> fix planning -> fix loop, followed by merge-readiness review and then supervision.
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    arch_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - takt
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - takt
        - architecture
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 30
initial_step: reviewers
loop_monitors:
  - cycle:
      - reviewers
      - fix-plan
      - fix
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: Healthy (findings decreasing, fixes applied)
          next: reviewers
        - condition: Unproductive (same findings repeating)
          next: ABORT
  - cycle:
      - reviewers
      - final-gate
      - fix-plan
      - fix
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: Healthy (findings decreasing, fixes applied)
          next: reviewers
        - condition: Unproductive (same findings repeating)
          next: ABORT
steps:
  - name: reviewers
    uses: peer-review-reviewers
    with:
      arch_knowledge:
        $param: arch_knowledge
    rules:
      self:
        - condition: all("approved")
          next: final-gate
        - condition: any("needs_fix")
          next: fix-plan
      parallel:
        arch-review: [{ condition: approved }, { condition: needs_fix }]
        security-review: [{ condition: approved }, { condition: needs_fix }]
        qa-review: [{ condition: approved }, { condition: needs_fix }]
        testing-review: [{ condition: approved }, { condition: needs_fix }]
        coding-review: [{ condition: approved }, { condition: needs_fix }]
        ai-antipattern-review-2nd: [{ condition: approved }, { condition: needs_fix }]
  - name: final-gate
    uses: peer-review-final-gate
    with:
      arch_knowledge:
        $param: arch_knowledge
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_fix
        next: fix-plan
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
  - name: fix-plan
    uses: peer-review-fix-plan
    with:
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: Fix plan finalized
        next: fix
      - condition: Task-level replanning required
        return: need_replan
  - name: fix
    uses: peer-review-fix
    with:
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: Fix complete
        next: reviewers
      - condition: Fix plan requires revision
        next: fix-plan
      - condition: Cannot proceed, insufficient info
        return: need_replan
