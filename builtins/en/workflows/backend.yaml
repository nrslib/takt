name: backend
description: Backend workflow that injects domain facets into the shared development flow.
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy: [design-planning]
      plan_knowledge: [backend, architecture]
      testing_policy: [coding, testing]
      testing_knowledge: [backend, architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing]
      development_knowledge: [backend, security, architecture]
      review_policy: [coding, testing, review]
      review_knowledge: [backend, security, architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
