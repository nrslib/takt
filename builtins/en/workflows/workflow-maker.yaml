name: workflow-maker
description: Workflow Maker creates or revises an isolated TAKT workflow bundle and reviews it before completion.
max_steps: 12
initial_step: create

personas:
  maker: ../facets/personas/coder.md
  reviewer: ../facets/personas/architecture-reviewer.md
policies:
  takt: ../facets/policies/takt.md
knowledge:
  takt: ../facets/knowledge/takt.md
instructions:
  create: ../facets/instructions/workflow-maker-create.md
  review: ../facets/instructions/workflow-maker-review.md
  fix: ../facets/instructions/workflow-maker-fix.md
report_formats:
  doctor: ../facets/output-contracts/workflow-maker-doctor.md
  review: ../facets/output-contracts/workflow-maker-review.md

steps:
  - name: create
    description: Create or revise the workflow bundle to meet the request and report doctor-equivalent validation results.
    capabilities: edit
    edit: true
    persona: maker
    policy: takt
    knowledge: takt
    instruction: create
    output_contracts:
      report:
        - name: workflow-maker-doctor.md
          format: doctor
    rules:
      - condition: completed
        next: review

  - name: review
    description: Compare the artifact and doctor-equivalent validation report against the request to decide approval or repair.
    capabilities: readonly
    edit: false
    persona: reviewer
    policy: takt
    knowledge: takt
    instruction: review
    pass_previous_response: false
    output_contracts:
      report:
        - name: workflow-maker-review.md
          format: review
    rules:
      - condition: approved
        next: COMPLETE
      - condition: needs_fix
        next: fix

  - name: fix
    input_reports:
      - from_step: review
        reports: [workflow-maker-review.md]
        history: {previous: 2}
    description: Fix the defects identified in review and report repeated doctor-equivalent validation results.
    capabilities: edit
    edit: true
    persona: maker
    policy: takt
    knowledge: takt
    instruction: fix
    pass_previous_response: false
    output_contracts:
      report:
        - name: workflow-maker-doctor.md
          format: doctor
    rules:
      - condition: completed
        next: review
