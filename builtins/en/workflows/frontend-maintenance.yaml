name: frontend-maintenance
description: Frontend maintenance workflow that injects existing-system facets into the shared development flow.
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy: [design-planning, existing-system-respect]
      plan_knowledge: [frontend, react, architecture, existing-system]
      plan_instruction: plan-maintenance
      testing_policy: [coding, testing, existing-system-respect]
      testing_knowledge: [frontend, react, architecture, unit-testing, e2e-testing, existing-system]
      testing_instruction: write-tests-maintenance
      development_policy: [coding, testing, design-fidelity, existing-system-respect]
      development_knowledge: [frontend, react, security, architecture, existing-system]
      implementation_instruction: implement-maintenance
      reviewer_suite: peer-review-suite-frontend
      review_policy_additions: [existing-system-respect]
      review_policy: [coding, testing, design-fidelity, existing-system-respect, review]
      review_knowledge: [frontend, react, security, architecture, unit-testing, e2e-testing, existing-system]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
