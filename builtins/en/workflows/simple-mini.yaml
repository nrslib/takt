name: simple-mini
description: A lightweight development workflow that trusts a capable model's judgment (plan → implement → review ⇄ fix → COMPLETE). It omits dedicated test writing and final supervision while letting the model select relevant available skills.
workflow_config:
  provider_options:
    codex:
      network_access: true
      skills:
        repo: true
        user: true
    opencode:
      network_access: true
max_steps: 20
initial_step: plan
steps:
  - name: plan
    uses: development-core-plan
    with:
      plan_policy: [design-planning]
      plan_knowledge: [architecture]
      plan_instruction: simple-plan
      plan_report_format: plan
    rules:
      - condition: Requirements are clear and implementation is feasible
        next: implement
      - condition: The user is asking a question rather than requesting implementation
        next: COMPLETE
      - condition: Requirements are unclear or information is insufficient
        next: ABORT
        appendix: |
          Questions:
          - {Question 1}
          - {Question 2}

  - name: implement
    uses: development-core-implement
    with:
      development_policy: [coding, testing]
      development_knowledge: [architecture]
      implementation_instruction: simple-implement
    rules:
      - condition: Implementation completed
        next: review
      - condition: The plan needs revision
        next: plan
      - condition: Unable to proceed with implementation
        next: ABORT
      - condition: User input is required to resolve a question
        next: implement
        requires_user_input: true
        interactive_only: true

  - name: review
    tags:
      - review
    edit: false
    persona: coding-reviewer
    policy:
      - review
      - coding
      - testing
    knowledge:
      - architecture
      - unit-testing
      - e2e-testing
    provider_options:
      extends: review-readonly
    pass_previous_response: false
    instruction: simple-review-coding
    output_contracts:
      report:
        - name: coding-review.md
          format: coding-review
    rules:
      - condition: approved
        next: COMPLETE
      - condition: needs_fix
        next: remediation

  - name: remediation
    uses: review-remediation
    with:
      plan_policy:
        - coding
        - testing
        - review
      fix_policy:
        - coding
        - testing
      verification_policy:
        - coding
        - testing
        - review
      fix_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: review
      - condition: need_replan
        next: plan
      - condition: ABORT
        next: ABORT
