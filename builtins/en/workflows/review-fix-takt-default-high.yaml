name: review-fix-takt-default-high
description: "Enhanced variant of review-fix-takt-default with a Finding Contract: gathers the review target, then plans, writes tests, implements directly, runs six compact specialist reviews, applies direct fixes, and closes through a fail-closed final gate."
finding_contract:
  ledger_path: .takt/findings/review-fix-takt-default-high.json
  raw_findings_path: .takt/findings/review-fix-takt-default-high/raw
  manager:
    persona: findings-manager
    instruction: findings-manager
    output_contract: findings-manager
max_steps: 50
initial_step: gather

loop_monitors:
  - cycle: [replan, implement]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers, final-gate]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers, fix]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: Replanning is making progress on blockers
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, reviewers]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, reviewers, final-gate]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, reviewers, fix]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: Replanning is making progress on blockers
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [fix, reviewers]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: The post-fix review confirms progress and the next fix is actionable
          next: fix
        - condition: The same finding repeats but replanning may resolve it
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [fix, reviewers, final-gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: The post-fix review confirms progress and the next fix is actionable
          next: fix
        - condition: The same finding repeats but replanning may resolve it
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
steps:
  - uses: gather
    name: gather
  - name: plan
    tags: [plan]
    edit: false
    persona: planner
    knowledge: architecture
    instruction: plan
    rules:
      - condition: Requirements are clear and implementable
        next: write_tests
      - condition: User is asking a question rather than requesting implementation
        next: COMPLETE
      - condition: Requirements are unclear or insufficient
        next: ABORT
    output_contracts:
      report:
        - name: plan.md
          format: plan

  - uses: replan
    name: replan

  - name: write_tests
    tags: [coding, test-planning]
    edit: true
    persona: coder
    policy: [coding, testing]
    knowledge: [takt, architecture, unit-testing, e2e-testing, implementation-semantics]
    required_permission_mode: edit
    instruction: write-tests-first
    rules:
      - condition: Tests written
        next: implement
      - condition: Skip test writing because target is not yet implemented
        next: implement
      - condition: Cannot proceed with writing tests
        next: plan
      - condition: User input required for confirmation
        next: write_tests
        requires_user_input: true
        interactive_only: true
    output_contracts:
      report:
        - name: test-report.md
          format: test-report

  - name: implement
    tags: [coding]
    edit: true
    session: compact
    persona: coder
    policy: coding
    knowledge: [takt, architecture, implementation-semantics]
    required_permission_mode: edit
    instruction: implement
    rules:
      - condition: Implementation complete
        next: reviewers
      - condition: Cannot proceed with implementation
        next: replan

  - uses: reviewers
    name: reviewers
  - uses: finding-contract-final-gate
    name: final-gate

  - uses: fix
    name: fix
