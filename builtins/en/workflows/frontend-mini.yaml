name: frontend-mini
description: Frontend-focused mini development workflow (plan -> implement -> parallel review -> fix if needed -> complete)
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
      plan_knowledge:
        - frontend
        - security
        - architecture
      plan_report_format: plan-frontend
      development_policy:
        - coding
        - testing
        - design-fidelity
      development_knowledge:
        - frontend
        - security
        - architecture
      supervisor_persona: supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
