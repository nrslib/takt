name: experimental
description: Experimental coding workflow using dynamic implementation companions with the shared core's adjudicated, verified peer-review remediation loop and merge-readiness gate.
max_steps: 51
initial_step: develop

steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      implementation_workflow: development-implement-dynamic
      remediation_workflow: development-remediation-dynamic
      implementation_companions:
        fixed: [ai-antipattern-review-companion, testing-review-companion]
        pool: []
        moderator: ai-antipattern-review-moderator
      reviewer_suite: experimental-review-adapter
      review_policy_additions: []
      review_policy: [coding, testing, review]
      review_knowledge: [architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
