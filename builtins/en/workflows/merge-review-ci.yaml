name: merge-review-ci
description: Review and evaluate a PR only when its CI has already succeeded
max_steps: 51
initial_step: check_ci
steps:
  - name: check_ci
    description: Check CI once before starting the existing PR review.
    mode: system
    system_inputs:
      - type: pr_status
        source: current_pr
        as: status
    rules:
      - condition: when(context.check_ci.status.ci.finished == true && context.check_ci.status.ci.passed == true)
        next: merge_review
      - condition: when(true)
        next: COMPLETE
  - name: merge_review
    description: Delegate review, evaluation and comments to merge-review.
    kind: workflow_call
    call: merge-review
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
