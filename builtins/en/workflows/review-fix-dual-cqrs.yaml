name: review-fix-dual-cqrs
description: Frontend + CQRS+ES focused review + fix loop (structure, modularization, domain model, component design, security, coding)
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction

max_steps: 30
facet_pools:
  security-review-facets:
    uses: security-review-facets
initial_step: gather
loop_monitors:
  - cycle:
      - reviewers
      - final-gate
      - remediation
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: Healthy (fixes progressing and report content converging)
          next: reviewers
        - condition: Implementation incomplete or report not converged, but the next review or fix can be performed
          next: reviewers
        - condition: The current loop cannot converge and requires a final-gate decision
          next: final-gate

steps:
  - name: gather
    uses: review-gather-to-reviewers
    rules:
      - condition: Review target information gathered
        next: initial-reviewers
      - condition: Unable to identify review target, insufficient information
        next: ABORT

  - name: initial-reviewers
    uses: review-fix-dual-cqrs-reviewers
    with:
      architecture_review_instruction: review-arch
      coding_review_instruction: review-coding
      frontend_review_instruction: review-frontend
      security_review_instruction: review-security
      cqrs_es_review_instruction: review-cqrs-es
    rules:
      self:
        - condition: any("error")
          next: initial-reviewers
        - condition: all("approved")
          next: final-gate
        - condition: any("needs_fix")
          next: remediation
      parallel:
        arch-review:
          - condition: approved
          - condition: needs_fix
        cqrs-es-review:
          - condition: approved
          - condition: needs_fix
        frontend-review:
          - condition: approved
          - condition: needs_fix
        coding-review:
          - condition: approved
          - condition: needs_fix
        security-review:
          - condition: approved
          - condition: needs_fix

  - name: reviewers
    uses: review-fix-dual-cqrs-reviewers
    with:
      architecture_review_instruction: follow-up-architecture-review
      coding_review_instruction: follow-up-coding-review
      frontend_review_instruction: follow-up-frontend-review
      security_review_instruction: follow-up-security-review
      cqrs_es_review_instruction: follow-up-cqrs-es-review
    rules:
      self:
        - condition: any("error")
          next: reviewers
        - condition: all("approved")
          next: final-gate
        - condition: any("needs_fix")
          next: remediation
      parallel:
        arch-review:
          - condition: approved
          - condition: needs_fix
        cqrs-es-review:
          - condition: approved
          - condition: needs_fix
        frontend-review:
          - condition: approved
          - condition: needs_fix
        coding-review:
          - condition: approved
          - condition: needs_fix
        security-review:
          - condition: approved
          - condition: needs_fix

  - name: final-gate
    kind: workflow_call
    call: final-gate
    args:
      supervise_knowledge:
        - frontend
        - backend
        - cqrs-es
        - security
        - architecture
      supervise_policy:
        - contract-change
        - frontend
        - backend
        - cqrs-es
        - architecture
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_fix
        next: remediation
      - condition: need_replan
        next: ABORT
      - condition: ABORT
        next: ABORT
  - name: remediation
    uses: review-remediation
    with:
      plan_policy:
        - coding
        - testing
        - design-fidelity
        - screen-api
        - review
        - cqrs-es
      fix_policy:
        - coding
        - testing
        - design-fidelity
        - screen-api
        - cqrs-es
        - architecture
        - backend
        - frontend
      fix_knowledge:
        - frontend
        - backend
        - cqrs-es
        - security
        - architecture
    rules:
      - condition: COMPLETE
        next: reviewers
      - condition: need_replan
        next: final-gate
      - condition: ABORT
        next: ABORT
