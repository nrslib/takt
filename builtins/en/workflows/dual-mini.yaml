name: dual-mini
description: Frontend + backend mini development workflow (plan -> implement -> parallel review -> fix if needed -> complete) with frontend + backend knowledge injection
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
        - architecture
        - backend
        - frontend
      plan_knowledge:
        - frontend
        - backend
        - security
        - architecture
      plan_report_format: plan-frontend
      development_policy:
        - coding
        - testing
        - design-fidelity
        - screen-api
        - architecture
        - backend
        - frontend
      development_knowledge:
        - frontend
        - backend
        - security
        - architecture
      supervisor_persona: dual-supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
