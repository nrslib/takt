name: simple-backend
description: A simple development workflow that trusts a capable model's judgment and injects backend knowledge and policies into simple-core.
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 30
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: simple-core
    args:
      plan_policy:
        - design-planning
      testing_policy:
        - coding
        - testing
      development_policy:
        - coding
        - testing
      review_policy:
        - review
        - coding
        - testing
      development_knowledge:
        - backend
        - security
        - architecture
      testing_knowledge:
        - backend
        - architecture
        - unit-testing
        - e2e-testing
      review_knowledge:
        - backend
        - security
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
