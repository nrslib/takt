name: merge-readiness-finding-contract-final-gate
description: Finding Contract final gate that records merge-readiness evidence before supervision verifies the shared ledger.
subworkflow:
  callable: true
  visibility: internal
  requires_finding_contract: true
  returns:
    - needs_review
    - need_replan
    - needs_fix
    - needs_conflict_adjudication
  params:
    supervise_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - takt
capabilities: readonly
initial_step: merge-readiness-review
steps:
  - name: merge-readiness-review
    tags: [review, final-gate, merge-readiness]
    edit: false
    session: compact
    persona: merge-readiness-reviewer
    policy:
      - contract-change
      - review
    instruction: review-merge-readiness
    rules:
      - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
        return: needs_conflict_adjudication
      - condition: when(findings.conflicts.count > 0)
        next: ABORT
      - condition: when(findings.provisional.fixpoint == true)
        return: need_replan
      - condition: when(findings.rounds.budgetExhausted == true && findings.provisional.count > 0)
        return: need_replan
      - condition: when(findings.provisional.count > 0)
        return: need_replan
      # A claim-bearing reviewer anomaly that exhausted its restatement budget. This step
      # holds terminal_adjudication authority, so the findings-manager round that runs before
      # rule evaluation issues a reviewer_anomaly control task; anomalies the adjudicator can
      # machine-verify as outside the task scope are already settled by the time this rule is
      # evaluated. What remains is what the adjudicator did not dismiss — another review will
      # not resolve it, so route it to COMPLETE and let the engine review-integrity gate report
      # review_integrity_unresolved as a visible failure. Returning needs_review here loops
      # between review and the final gate forever. There is no automatic rescue: only an
      # adjudication settles this, and the run fails when the adjudicator declines.
      # It precedes the open.count needs_fix rule because the engine review-integrity
      # invariant forbids completion while this anomaly stands, so a fix loop cannot pay off.
      - condition: when(findings.reviewerAnomalies.claimBearingTerminalCount > 0)
        next: COMPLETE
      - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0 && findings.reviewerAnomalies.budgetExhausted == true)
        return: need_replan
      - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0)
        return: needs_review
      - condition: needs_fix
        return: needs_fix
      - condition: when(findings.open.count > 0)
        return: needs_fix
      - condition: approved && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
        next: supervise
    output_contracts:
      report:
        - name: merge-readiness-review.md
          format: merge-readiness-review-finding-contract

  - name: supervise
    uses: finding-contract-supervise
    with:
      supervise_knowledge:
        $param: supervise_knowledge
    rules:
      - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
        return: needs_conflict_adjudication
      - condition: when(findings.conflicts.count > 0)
        next: ABORT
      - condition: when(findings.provisional.fixpoint == true)
        return: need_replan
      - condition: when(findings.rounds.budgetExhausted == true && findings.provisional.count > 0)
        return: need_replan
      - condition: when(findings.provisional.count > 0)
        return: need_replan
      # A claim-bearing reviewer anomaly that exhausted its restatement budget. This step
      # holds terminal_adjudication authority, so the findings-manager round that runs before
      # rule evaluation issues a reviewer_anomaly control task; anomalies the adjudicator can
      # machine-verify as outside the task scope are already settled by the time this rule is
      # evaluated. What remains is what the adjudicator did not dismiss — another review will
      # not resolve it, so route it to COMPLETE and let the engine review-integrity gate report
      # review_integrity_unresolved as a visible failure. Returning needs_review here loops
      # between review and the final gate forever. There is no automatic rescue: only an
      # adjudication settles this, and the run fails when the adjudicator declines.
      # It precedes the open.count needs_fix rule because the engine review-integrity
      # invariant forbids completion while this anomaly stands, so a fix loop cannot pay off.
      - condition: when(findings.reviewerAnomalies.claimBearingTerminalCount > 0)
        next: COMPLETE
      - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0 && findings.reviewerAnomalies.budgetExhausted == true)
        return: need_replan
      - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0)
        return: needs_review
      - condition: needs_fix
        return: needs_fix
      - condition: need_replan
        return: need_replan
      - condition: when(findings.open.count > 0)
        return: needs_fix
      - condition: approved && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
        next: COMPLETE
