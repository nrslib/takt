name: development-core
description: Shared development flow with injectable planning, testing, implementation, initial review, fix, follow-up review, and supervision context.
subworkflow:
  callable: true
  visibility: internal
  params:
    implementation_pool:
      type: facet_pool_ref
      default: coding-facets
    implementation_companions:
      type: companion_ref[]
      default: []
    review_workflow:
      type: workflow_ref
      default: peer-review-suite-base
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [design-planning]
    plan_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, task-decomposition]
    plan_instruction:
      type: facet_ref
      facet_kind: instruction
      default: plan
    replan_instruction:
      type: facet_ref
      facet_kind: instruction
      default: replan-implementation
    testing_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing]
    testing_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, unit-testing, e2e-testing]
    testing_instruction:
      type: facet_ref
      facet_kind: instruction
      default: write-tests-first
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing, ai-antipattern]
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, implementation-semantics]
    implementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: implement
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing, review]
    review_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, unit-testing, e2e-testing]
    fix_instruction:
      type: facet_ref
      facet_kind: instruction
      default: fix
    supervise_instruction:
      type: facet_ref
      facet_kind: instruction
      default: supervise
initial_step: plan

facet_pools:
  coding-facets:
    candidates:
      - id: frontend
        description: Handle UI, components, state management, accessibility, and presentation.
        policy: design-fidelity
        knowledge: [frontend, react]
      - id: backend
        description: Handle APIs, domain logic, server-side processing, and persistence.
        knowledge: backend
      - id: testing
        description: Handle test design, coverage, integration boundaries, and E2E boundaries.
        knowledge: [unit-testing, e2e-testing]
      - id: security
        description: Handle authentication, authorization, input validation, secrets, dependencies, and security boundaries.
        knowledge: [security, security-web, security-api, security-local, security-data, security-dependencies]
  takt-coding-facets:
    candidates:
      - id: testing
        description: Handle TAKT test design, coverage, integration boundaries, and E2E boundaries.
        knowledge: [unit-testing, e2e-testing]
      - id: security
        description: Handle TAKT authentication, authorization, input validation, secrets, local execution, dependencies, and security boundaries.
        knowledge: [security, security-api, security-local, security-data, security-dependencies]

steps:
  - name: plan
    capabilities: [readonly, enable-skills]
    uses: development-core-plan
    with:
      plan_policy:
        $param: plan_policy
      plan_knowledge:
        $param: plan_knowledge
      plan_instruction:
        $param: plan_instruction
      plan_report_format: plan
    rules:
      - condition: Requirements are clear and implementation is feasible
        next: write_tests
      - condition: The user is asking a question rather than requesting implementation
        next: COMPLETE
      - condition: Requirements are unclear or information is insufficient
        next: ABORT

  - name: replan
    tags: [plan]
    edit: false
    capabilities: readonly
    persona: planner
    policy:
      - contract-change
      - $param: plan_policy
    knowledge:
      $param: plan_knowledge
    instruction:
      $param: replan_instruction
    output_contracts:
      report:
        - name: plan.md
          format: plan
    rules:
      - condition: An actionable, untried project-scoped change or investigation and its verification steps were defined
        next: implement
      - condition: The current implementation satisfies the requirements and acceptance criteria, required project-scoped verification is complete, and no untried change or investigation remains
        next: review
      - condition: Confirmed evidence shows that project-scoped changes or investigation cannot resolve the blocker, leaving only an external action or mutually incompatible requirements
        next: ABORT

  - name: write_tests
    capabilities: [edit, enable-skills]
    uses: development-core-write-tests
    with:
      testing_policy:
        $param: testing_policy
      testing_knowledge:
        $param: testing_knowledge
      testing_instruction:
        $param: testing_instruction
    rules:
      - condition: Test creation is complete
        next: implement
      - condition: Test creation is skipped because the target is not implemented
        next: implement
      - condition: Test creation cannot proceed
        next: plan
      - condition: User input is required for a clarification
        next: write_tests
        requires_user_input: true
        interactive_only: true

  - name: implement
    capabilities: [edit, enable-skills]
    uses: development-core-implement
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: implementation_instruction
    dynamic_facets:
      pool:
        $param: implementation_pool
    companion:
      $param: implementation_companions
    rules:
      - condition: Implementation is complete
        next: review
      - condition: No implementation was started (report only)
        next: review
      - condition: Implementation cannot proceed
        next: replan
      - condition: User input is required
        next: implement
        requires_user_input: true
        interactive_only: true

  - name: review
    kind: workflow_call
    call:
      $param: review_workflow
    vars:
      review_mode: initial
    args:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge
    rules:
      - condition: COMPLETE
        next: supervise
      - condition: needs_fix
        next: fix
      - condition: ABORT
        next: ABORT

  - name: follow-up-review
    kind: workflow_call
    call:
      $param: review_workflow
    vars:
      review_mode: follow_up
    args:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge
    rules:
      - condition: COMPLETE
        next: supervise
      - condition: needs_fix
        next: fix
      - condition: ABORT
        next: ABORT

  - name: fix
    capabilities: [edit, enable-skills]
    uses: experimental-fix
    with:
      fix_policy:
        $param: review_policy
      fix_knowledge:
        $param: development_knowledge
      fix_instruction:
        $param: fix_instruction
    dynamic_facets:
      pool:
        $param: implementation_pool
    companion:
      $param: implementation_companions
    rules:
      - condition: Fix is complete
        next: follow-up-review
      - condition: The fix approach needs to be reconsidered
        next: replan
      - condition: The task needs to be replanned
        next: replan
      - condition: Fix cannot proceed
        next: ABORT

  - name: supervise
    capabilities: [readonly, enable-skills]
    uses: experimental-supervise
    with:
      supervise_policy:
        $param: review_policy
      supervise_knowledge:
        $param: review_knowledge
      supervise_instruction:
        $param: supervise_instruction
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: approved
        next: COMPLETE
      - condition: need_replan
        next: replan
      - condition: needs_fix
        next: fix
