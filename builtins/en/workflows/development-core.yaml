name: development-core
description: Shared development flow with injectable planning, testing, implementation, peer review, adjudication, verified remediation, and merge-readiness context.
subworkflow:
  callable: true
  visibility: internal
  params:
    implementation_pool:
      type: facet_pool_ref
      default: coding-facets
    implementation_workflow:
      type: workflow_ref
      default: development-implement
    remediation_workflow:
      type: workflow_ref
      default: development-remediation
    implementation_companions:
      type: companion_ref[]
      default: []
    reviewer_suite:
      type: workflow_ref
      default: peer-review-suite-base
    peer_review_workflow:
      type: workflow_ref
      default: peer-review
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [design-planning]
    plan_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, task-decomposition]
    plan_instruction:
      type: facet_ref
      facet_kind: instruction
      default: plan
    replan_instruction:
      type: facet_ref
      facet_kind: instruction
      default: replan-implementation
    testing_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing]
    testing_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, unit-testing, e2e-testing]
    testing_instruction:
      type: facet_ref
      facet_kind: instruction
      default: write-tests-first
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing, ai-antipattern]
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, implementation-semantics]
    implementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: implement
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing, review]
    review_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, unit-testing, e2e-testing]
initial_step: plan

facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets

steps:
  - name: plan
    capabilities: [readonly, enable-skills]
    uses: development-core-plan
    with:
      plan_policy:
        $param: plan_policy
      plan_knowledge:
        $param: plan_knowledge
      plan_instruction:
        $param: plan_instruction
      plan_report_format: plan
    rules:
      - condition: Requirements are clear and implementation is feasible
        next: write_tests
      - condition: The user is asking a question rather than requesting implementation
        next: COMPLETE
      - condition: Requirements are unclear or information is insufficient
        next: ABORT

  - name: replan
    tags: [plan]
    edit: false
    capabilities: readonly
    persona: planner
    policy:
      - contract-change
      - $param: plan_policy
    knowledge:
      $param: plan_knowledge
    instruction:
      $param: replan_instruction
    output_contracts:
      report:
        - name: plan.md
          format: plan
    rules:
      - condition: An actionable, untried project-scoped change or investigation and its verification steps were defined
        next: implement
      - condition: The current implementation satisfies the requirements and acceptance criteria, required project-scoped verification is complete, and no untried change or investigation remains
        next: peer-review
      - condition: Confirmed evidence shows that project-scoped changes or investigation cannot resolve the blocker, leaving only an external action or mutually incompatible requirements
        next: ABORT

  - name: write_tests
    capabilities: [edit, enable-skills]
    uses: development-core-write-tests
    with:
      testing_policy:
        $param: testing_policy
      testing_knowledge:
        $param: testing_knowledge
      testing_instruction:
        $param: testing_instruction
    rules:
      - condition: Test creation is complete
        next: implement
      - condition: Test creation is skipped because the target is not implemented
        next: implement
      - condition: Test creation cannot proceed
        next: plan
      - condition: User input is required for a clarification
        next: write_tests
        requires_user_input: true
        interactive_only: true

  - name: implement
    kind: workflow_call
    call:
      $param: implementation_workflow
    args:
      implementation_pool:
        $param: implementation_pool
      implementation_companions:
        $param: implementation_companions
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: implementation_instruction
    rules:
      - condition: COMPLETE
        next: peer-review
      - condition: need_replan
        next: replan

  - name: peer-review
    kind: workflow_call
    call:
      $param: peer_review_workflow
    args:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge
      fix_companions:
        $param: implementation_companions
      remediation_workflow:
        $param: remediation_workflow
      fix_pool:
        $param: implementation_pool
      plan_policy:
        $param: review_policy
      fix_policy:
        $param: development_policy
      fix_knowledge:
        $param: development_knowledge
      verification_knowledge:
        $param: review_knowledge
      verification_policy:
        $param: review_policy
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: need_replan
        next: replan
      - condition: ABORT
        next: ABORT
