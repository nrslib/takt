name: peer-review-finding-contract
description: Runs the five standard specialist reviews through a Finding Contract ledger, ledger-driven remediation, and a terminal final gate.
subworkflow:
  callable: true
  visibility: internal
  requires_finding_contract: true
  returns: [need_replan]
  params:
    reviewer_suite:
      type: workflow_ref
      default: peer-review-suite-finding-contract-base
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, takt]
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [takt, architecture]
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing, review]
    fix_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing]
    verification_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing, review]
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
initial_step: initial-reviewers
loop_monitors:
  - cycle: [fix-plan, fix, reviewers]
    ignore_steps: [fix-verifier, fix-retry]
    threshold: 5
    judge: &fc_convergence_judge
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: Fixes are progressing, findings in the triggering response are converging, and the next review is actionable
          next: reviewers
        - condition: Implementation is incomplete or findings in the triggering response have not converged, and revising the fix plan may resolve it
          next: fix-plan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted fix plans
          next: ABORT
  - cycle: [fix-plan, fix, reviewers, final-gate]
    ignore_steps: [fix-verifier, fix-retry]
    threshold: 5
    judge: *fc_convergence_judge
  - cycle: [fix-plan, fix]
    ignore_steps: [fix-verifier, fix-retry]
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan-finding-contract
      rules:
        - condition: The fix plan can be redefined without changing requirements or acceptance criteria
          next: fix-plan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted fix plans
          next: ABORT
  - cycle: [fix-retry, fix-verifier]
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-verifier-finding-contract
      rules:
        - condition: The remaining completion obligations are local and can be fixed without changing the current fix plan
          next: fix-retry
        - condition: Completion verification shows that an assumption of the current fix plan is invalid, and revising the plan can satisfy the requirements
          next: fix-plan
        - condition: No feasible approach can satisfy the requirements after the attempted retries and fix-plan revisions
          next: ABORT
steps:
  - name: initial-reviewers
    uses: peer-review-suite-call
    vars:
      review_mode: initial
    with:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: COMPLETE
        next: final-gate
      - condition: needs_terminal_adjudication
        next: final-gate
      - condition: needs_review
        next: reviewers
      - condition: needs_fix
        next: fix-plan
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
  - name: reviewers
    uses: peer-review-suite-call
    vars:
      review_mode: follow_up
    with:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: COMPLETE
        next: final-gate
      - condition: needs_terminal_adjudication
        next: final-gate
      - condition: needs_review
        next: reviewers
      - condition: needs_fix
        next: fix-plan
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
  - name: final-gate
    uses: finding-contract-final-gate
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_review
        next: reviewers
      - condition: needs_fix
        next: fix-plan
      - condition: need_replan
        return: need_replan
      - condition: needs_conflict_adjudication
        next: finding-conflict-adjudication
      - condition: ABORT
        next: ABORT
  - name: fix-plan
    uses: peer-review-fix-plan
    with:
      plan_policy:
        $param: plan_policy
      fix_knowledge:
        $param: fix_knowledge
      plan_instruction: fix-plan-finding-contract
    rules:
      - condition: Fix plan finalized
        next: fix
      - condition: Whole-task replanning required
        return: need_replan
  - name: fix
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: fix-finding-contract
    rules:
      - condition: Fix complete
        next: fix-verifier
      - condition: Fix plan revision required
        next: fix-plan
      - condition: Whole-task replanning required
        return: need_replan
  - name: fix-verifier
    uses: peer-review-fix-verifier-finding-contract
    with:
      verification_policy:
        $param: verification_policy
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: verified
        next: reviewers
      - condition: incomplete
        next: fix-retry
      - condition: plan_invalid
        next: fix-plan
  - name: fix-retry
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: apply-fix-verification
    rules:
      - condition: Fix complete
        next: fix-verifier
      - condition: Fix plan revision required
        next: fix-plan
      - condition: Whole-task replanning required
        return: need_replan
