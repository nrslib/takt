name: deep-research
description: Deep research workflow - discovery-driven investigation that follows emerging questions with multi-perspective analysis
max_steps: 15
initial_step: plan
steps:
  - name: plan
    capabilities: readonly
    tags:
      - plan
    persona: research-planner
    policy: research
    knowledge: research
    instruction: research-plan
    rules:
      - condition: Planning is complete
        next: dig
      - condition: Insufficient information to create a plan
        next: ABORT
  - name: dig
    capabilities: edit
    tags:
      - plan
    persona: research-digger
    policy: research
    knowledge: research
    instruction: research-dig
    edit: true
    team_leader:
      max_parts: 3
      part_persona: research-digger
      part_edit: true
      part_allowed_tools:
        - Read
        - Write
        - Bash
        - Glob
        - Grep
        - WebSearch
        - WebFetch
    rules:
      - condition: Research is complete
        next: analyze
      - condition: Unable to conduct research
        next: ABORT
  - name: analyze
    capabilities: edit
    tags:
      - plan
    persona: research-analyzer
    policy: research
    knowledge: research
    instruction: research-analyze
    edit: true
    rules:
      - condition: New questions exist and additional research is needed
        next: dig
      - condition: Sufficiently investigated
        next: supervise
  - name: supervise
    capabilities: readonly
    tags:
      - review
      - supervise
    persona: research-supervisor
    policy: research
    knowledge: research
    instruction: research-supervise
    output_contracts:
      report:
        - name: research-report.md
          format: research-report
    rules:
      - condition: Research results adequately answer the original request
        next: COMPLETE
      - condition: Research results are insufficient and replanning is needed
        next: plan
