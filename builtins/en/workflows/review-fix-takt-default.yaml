name: review-fix-takt-default
description: Workflow that gathers the review target, then injects TAKT-specific facets into the shared development flow.
max_steps: 52
initial_step: gather
steps:
  - name: gather
    uses: gather
    rules:
      - condition: Review target information gathered
        next: develop
      - condition: Cannot identify review target, insufficient info
        next: ABORT
        appendix: |
          Questions:
          - {question1}
          - {question2}
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy: [design-planning]
      plan_knowledge: [takt, architecture]
      testing_policy: [coding, testing, takt-testing]
      testing_knowledge: [takt, architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing, takt-testing]
      development_knowledge: [takt, architecture, task-decomposition]
      implementation_instruction: implement
      review_policy: [coding, testing, review]
      review_knowledge: [takt, architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
