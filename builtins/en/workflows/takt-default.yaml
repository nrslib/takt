name: takt-default
description: TAKT development workflow (plan -> write_tests -> draft (implement + AI self-review) -> peer-review (specialist reviewers + fix planning + fix + sequential final gate) -> COMPLETE).
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 50
initial_step: plan
steps:
  - name: plan
    uses: implementation-plan-to-write-tests
    rules:
      - condition: Requirements are clear and implementable
        next: write_tests
      - condition: User is asking a question (not an implementation task)
        next: COMPLETE
      - condition: Requirements unclear, insufficient info
        next: ABORT
        appendix: |
          Items to confirm:
          - {question 1}
          - {question 2}
  - name: write_tests
    uses: implementation-write-tests
    with:
      test_knowledge:
        - takt
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: Tests written
        next: draft
      - condition: Skip test writing because target is not yet implemented
        next: draft
      - condition: Cannot proceed with writing tests
        next: plan
      - condition: User input required for confirmation
        next: write_tests
        requires_user_input: true
        interactive_only: true
  - name: draft
    uses: takt-default-draft
    rules:
      - condition: COMPLETE
        next: peer-review
      - condition: need_replan
        next: plan
      - condition: ABORT
        next: ABORT
  - name: peer-review
    uses: takt-default-peer-review
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: need_replan
        next: plan
      - condition: ABORT
        next: ABORT
