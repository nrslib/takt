name: development-implement
description: Fixed-facet implementation execution for the shared development core.
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    implementation_pool:
      type: facet_pool_ref
      default: coding-facets
    implementation_companions:
      type: companion_ref[]
      default: []
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - ai-antipattern
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - implementation-semantics
    implementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-implement-with-reports
    scope_report_format:
      type: facet_ref
      facet_kind: report_format
      default: coder-scope
facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets
initial_step: implement
steps:
  - name: implement
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    instruction:
      - $param: implementation_instruction
      - development-implementation-continuation
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: implementation_instruction
      scope_report_format:
        $param: scope_report_format
    companion:
      $param: implementation_companions
    rules:
      - condition: The required implementation was performed and its mandatory verification is complete (pre-existing failures and out-of-scope work that are neither causally related to this change nor mandatory for this task do not block completion; an incomplete label in the report alone does not justify returning it)
        next: COMPLETE
      - condition: No implementation change is needed for this task and mandatory verification is complete (report-only work; excludes any required work that has not been performed)
        next: COMPLETE
      - condition: No evidence requires changing the plan premises, scope, or method, and required implementation, verification, or investigation has concrete executable work remaining (including mandatory checks not yet run)
        next: implement
      - condition: The plan premises, scope, method, or verification capability are defective and require a plan change (unfinished work or missing evidence alone does not qualify)
        return: need_replan
      - condition: No project-local action can advance required work, with evidence identifying the necessary external action or incompatible requirements
        next: ABORT
      - condition: User input is required
        next: implement
        requires_user_input: true
        interactive_only: true
