name: backend-cqrs
description: Backend CQRS+ES workflow that injects domain facets into the shared development flow.
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy:
        - design-planning
        - cqrs-es
        - architecture
        - backend
      plan_knowledge:
        - backend
        - cqrs-es
        - architecture
      testing_policy:
        - coding
        - testing
        - cqrs-es
        - architecture
        - backend
      testing_knowledge:
        - backend
        - cqrs-es
        - architecture
        - unit-testing
        - e2e-testing
      development_policy:
        - coding
        - testing
        - cqrs-es
        - architecture
        - backend
      development_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
      reviewer_suite: peer-review-suite-cqrs
      review_policy:
        - coding
        - testing
        - review
        - architecture
        - backend
      review_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
