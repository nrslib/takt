name: research
description: Research workflow - autonomously executes research without asking questions
capabilities: readonly
max_steps: 10
initial_step: plan
steps:
  - name: plan
    description: Break down the research request and create a plan defining research items, candidate sources, and priorities.
    tags:
      - plan
    persona: research-planner
    policy: research
    knowledge: research
    instruction: research-plan
    rules:
      - condition: Planning is complete
        next: dig
      - condition: Insufficient information to create a plan
        next: ABORT
  - name: dig
    description: Split the plan into independent subtasks, investigate in parallel, and report sourced data, analysis, and conclusions.
    tags:
      - plan
    persona: research-digger
    policy: research
    knowledge: research
    instruction: research-dig
    rules:
      - condition: Research is complete
        next: supervise
      - condition: Unable to conduct research
        next: ABORT
  - name: supervise
    description: Check research coverage, evidence, and analytical depth to determine whether the request is adequately answered or replanning is needed.
    tags:
      - review
      - supervise
    persona: research-supervisor
    policy: research
    knowledge: research
    instruction: research-supervise
    rules:
      - condition: Research results adequately answer the original request
        next: COMPLETE
      - condition: Research results are insufficient and replanning is needed
        next: plan
