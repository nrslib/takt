name: dual-cqrs-mini
description: CQRS+ES frontend + backend mini development workflow (plan -> implement -> parallel review -> fix if needed -> complete) with CQRS+ES knowledge injection
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
      plan_knowledge:
        - frontend
        - backend
        - cqrs-es
        - security
        - architecture
      plan_report_format: plan-frontend
      development_policy:
        - coding
        - testing
        - design-fidelity
        - screen-api
      development_knowledge:
        - frontend
        - backend
        - cqrs-es
        - security
        - architecture
      supervisor_persona: dual-supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
