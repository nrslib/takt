name: takt-default-localllm
description: "Team Leader workflow for routing regular reviews to local LLMs and narrowly rechecking wiring, resource ownership, and failure boundaries with a high-assurance model. Providers and models remain tag-configurable."
finding_contract:
  ledger_path: .takt/findings/takt-default-localllm.json
  raw_findings_path: .takt/findings/takt-default-localllm/raw
  manager:
    persona: findings-manager
    instruction: findings-manager
    output_contract: findings-manager
max_steps: 50
initial_step: plan

loop_monitors:
  - cycle: [replan, implement]
    threshold: 2
    judge: &replan_standard_judge
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers, fix]
    threshold: 2
    judge: &replan_progress_judge
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: Replanning is making progress on blockers
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers, local-review-integrity-gate]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers, local-review-integrity-gate, boundary-reviewers]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers, local-review-integrity-gate, boundary-reviewers, final-gate]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers, local-review-integrity-gate, fix]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: Replanning is making progress on blockers
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers, local-review-integrity-gate, boundary-reviewers, fix]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: Replanning is making progress on blockers
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers, local-review-integrity-gate, boundary-reviewers, final-gate, fix]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: Replanning is making progress on blockers
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, reviewers]
    threshold: 2
    judge: *replan_standard_judge
  - cycle: [replan, reviewers, fix]
    threshold: 2
    judge: *replan_progress_judge
  - cycle: [replan, reviewers, local-review-integrity-gate]
    threshold: 2
    judge: *replan_standard_judge
  - cycle: [replan, reviewers, local-review-integrity-gate, boundary-reviewers]
    threshold: 2
    judge: *replan_standard_judge
  - cycle: [replan, reviewers, local-review-integrity-gate, boundary-reviewers, final-gate]
    threshold: 2
    judge: *replan_standard_judge
  - cycle: [replan, reviewers, local-review-integrity-gate, fix]
    threshold: 2
    judge: *replan_progress_judge
  - cycle: [replan, reviewers, local-review-integrity-gate, boundary-reviewers, fix]
    threshold: 2
    judge: *replan_progress_judge
  - cycle: [replan, reviewers, local-review-integrity-gate, boundary-reviewers, final-gate, fix]
    threshold: 2
    judge: *replan_progress_judge
  - cycle: [replan, reviewers, local-review-integrity-gate, boundary-reviewers, final-gate, boundary-reviewers, final-gate]
    threshold: 1
    judge: *replan_standard_judge
  - cycle: [replan, reviewers, local-review-integrity-gate, reviewers, local-review-integrity-gate]
    threshold: 1
    judge: *replan_standard_judge
  - cycle: [reviewers, local-review-integrity-gate]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-gate-needs-review
      rules:
        - condition: The missing evidence can be obtained concretely and another run of the same regular review is worthwhile
          next: reviewers
        - condition: A concrete implementation fix can resolve the problem reported by the completion gate
          next: fix
        - condition: The implementation or test strategy can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements after the attempted reviews and replans
          next: ABORT
  - cycle: [boundary-reviewers, final-gate]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-gate-needs-review
      rules:
        - condition: The missing evidence can be obtained concretely and another run of the same boundary review is worthwhile
          next: boundary-reviewers
        - condition: A concrete implementation fix can resolve the problem reported by the completion gate
          next: fix
        - condition: The implementation or test strategy can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements after the attempted reviews and replans
          next: ABORT
  - cycle: [replan, implement, reviewers, local-review-integrity-gate, boundary-reviewers, final-gate, boundary-reviewers, final-gate]
    threshold: 1
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [replan, implement, reviewers, local-review-integrity-gate, reviewers, local-review-integrity-gate]
    threshold: 1
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: The implementation approach can be redefined without changing requirements or acceptance criteria
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [fix, reviewers]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: The post-fix review confirms progress and the next fix is actionable
          next: fix
        - condition: The same finding repeats but replanning may resolve it
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [fix, reviewers, local-review-integrity-gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: The post-fix review confirms progress and the next fix is actionable
          next: fix
        - condition: The same finding repeats but replanning may resolve it
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [fix, reviewers, local-review-integrity-gate, boundary-reviewers]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: The post-fix review confirms progress and the next fix is actionable
          next: fix
        - condition: The same finding repeats but replanning may resolve it
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [fix, reviewers, local-review-integrity-gate, boundary-reviewers, final-gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: The post-fix review confirms progress and the next fix is actionable
          next: fix
        - condition: The same finding repeats but replanning may resolve it
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [fix, reviewers, local-review-integrity-gate, boundary-reviewers, final-gate, boundary-reviewers, final-gate]
    threshold: 1
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: The post-fix review confirms progress and the next fix is actionable
          next: fix
        - condition: The same finding repeats but replanning may resolve it
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
  - cycle: [fix, reviewers, local-review-integrity-gate, reviewers, local-review-integrity-gate]
    threshold: 1
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: The post-fix review confirms progress and the next fix is actionable
          next: fix
        - condition: The same finding repeats but replanning may resolve it
          next: replan
        - condition: No feasible approach can satisfy the requirements even after considering the attempted replans
          next: ABORT
steps:
  - name: plan
    uses: implementation-high-plan-to-write-tests
    rules:
      - condition: Requirements are clear and implementable
        next: write_tests
      - condition: User is asking a question rather than requesting implementation
        next: COMPLETE
      - condition: Requirements are unclear or insufficient
        next: ABORT
  - name: replan
    uses: implementation-high-replan-to-implement
    rules:
      - condition: An actionable, untried project-scoped change or investigation and its verification steps were defined
        next: implement
      - condition: Concrete evidence shows the current implementation meets the requirements and acceptance criteria, all required project-scoped verification is complete, no untried change or investigation remains, and only independent review is needed
        next: reviewers
      - condition: Confirmed evidence shows that project-scoped changes or investigation cannot resolve the issue, leaving only external action or mutually unsatisfiable requirements
        next: ABORT

  - name: write_tests
    uses: implementation-high-write-tests-to-implement
    rules:
      - condition: Tests written
        next: implement
      - condition: Skip test writing because target is not yet implemented
        next: implement
      - condition: Cannot proceed with writing tests
        next: plan
      - condition: User input required for confirmation
        next: write_tests
        requires_user_input: true
        interactive_only: true
  - name: implement
    tags: [leader]
    edit: true
    persona: coder
    policy: coding
    knowledge: [takt, architecture, implementation-semantics]
    required_permission_mode: edit
    pass_previous_response: true
    team_leader:
      max_concurrency: 2
      initial_max_parts: 2
      fail_on_part_error: false
      part_tags: [coding]
      part_persona: coder
      part_edit: true
      part_permission_mode: edit
    instruction: team-leader-implement
    rules:
      - condition: Implementation complete
        next: reviewers
      - condition: Cannot proceed with implementation
        next: replan

  - name: reviewers
    uses: reviewers
    rules:
      self:
        - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
          next: finding-conflict-adjudication
        - condition: when(findings.conflicts.count > 0)
          next: ABORT
        - condition: when(findings.provisional.dismissEligible.count > 0 && findings.conflicts.count == 0)
          next: local-review-integrity-gate
        - condition: when(findings.provisional.fixpoint == true && findings.conflicts.count == 0)
          next: replan
        - condition: when(findings.rounds.budgetExhausted == true && findings.provisional.count > 0 && findings.conflicts.count == 0)
          next: replan
        - condition: when(findings.provisional.count > 0 && findings.conflicts.count == 0)
          next: replan
        - condition: when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
          next: local-review-integrity-gate
        - condition: when(findings.open.count > 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
          next: fix
      parallel:
        arch-review: [{ condition: approved }, { condition: needs_fix }]
        ai-antipattern-review: [{ condition: No AI-specific issues }, { condition: AI-specific issues found }]
        coding-review: [{ condition: approved }, { condition: needs_fix }]
        implementation-semantics-review: [{ condition: approved }, { condition: needs_fix }]
        contract-lifecycle-review: [{ condition: approved }, { condition: needs_fix }]
        robustness-review: [{ condition: approved }, { condition: needs_fix }]

  - name: local-review-integrity-gate
    uses: finding-contract-final-gate
    rules:
      - condition: COMPLETE
        next: boundary-reviewers
      - condition: needs_review
        next: reviewers
      - condition: need_replan
        next: replan
      - condition: needs_fix
        next: fix
      - condition: needs_conflict_adjudication
        next: finding-conflict-adjudication
      - condition: ABORT
        next: ABORT

  - name: boundary-reviewers
    uses: boundary-reviewers
    rules:
      self:
        - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
          next: finding-conflict-adjudication
        - condition: when(findings.conflicts.count > 0)
          next: ABORT
        - condition: when(findings.provisional.dismissEligible.count > 0 && findings.conflicts.count == 0)
          next: final-gate
        - condition: when(findings.provisional.fixpoint == true && findings.conflicts.count == 0)
          next: replan
        - condition: when(findings.rounds.budgetExhausted == true && findings.provisional.count > 0 && findings.conflicts.count == 0)
          next: replan
        - condition: when(findings.provisional.count > 0 && findings.conflicts.count == 0)
          next: replan
        - condition: when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
          next: final-gate
        - condition: when(findings.open.count > 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
          next: fix
      parallel:
        contract-wiring-review: [{ condition: approved }, { condition: needs_fix }]
        resource-ownership-review: [{ condition: approved }, { condition: needs_fix }]
        failure-boundary-review: [{ condition: approved }, { condition: needs_fix }]

  - name: final-gate
    uses: finding-contract-final-gate
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_review
        next: boundary-reviewers
      - condition: need_replan
        next: replan
      - condition: needs_fix
        next: fix
      - condition: needs_conflict_adjudication
        next: finding-conflict-adjudication
      - condition: ABORT
        next: ABORT

  - name: fix
    tags: [leader]
    edit: true
    persona: coder
    policy: [coding, testing]
    knowledge: [takt, architecture, implementation-semantics]
    required_permission_mode: edit
    team_leader:
      mode: finding_contract_fix
      max_concurrency: 3
      initial_max_parts: 3
      fail_on_part_error: false
      part_tags: [coding]
      part_persona: coder
      part_edit: true
      part_permission_mode: edit
    instruction: team-leader-finding-contract-fix
    rules:
      - condition: when(structured.fix.decision == "complete")
        next: reviewers
      - condition: when(structured.fix.decision == "replan")
        next: replan
