name: merge-readiness-final-gate
description: Final gate that records merge-readiness evidence before supervision verifies it and returns the required next action.
subworkflow:
  callable: true
  visibility: internal
  returns:
    - needs_fix
    - need_replan
  params:
    supervise_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
initial_step: merge-readiness-review
steps:
  - name: merge-readiness-review
    uses: merge-readiness-final-review
    rules:
      - condition: approved
        next: supervise
      - condition: needs_fix
        return: needs_fix

  - name: supervise
    uses: merge-readiness-final-supervise
    with:
      supervise_knowledge:
        $param: supervise_knowledge
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: approved
        next: COMPLETE
      - condition: need_replan
        return: need_replan
      - condition: needs_fix
        return: needs_fix
