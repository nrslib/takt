name: review-fix-simple
description: One agent gathers context, reviews code quality with dynamic facets, and performs necessary fixes and verification.
subworkflow:
  callable: true
  visibility: internal
initial_step: gather
facet_pools:
  coding-facets:
    uses: coding-facets
steps:
  - name: gather
    uses: review-gather-with-clarification-to-reviewers
    persona: quality-maintainer
    rules:
      - condition: Review context gathered
        next: review-fix
      - condition: Review target cannot be identified or required context is missing
        next: ABORT
  - name: review-fix
    persona: quality-maintainer
    capabilities: edit
    edit: true
    required_permission_mode: edit
    policy:
      - coding
      - testing
      - review
      - ai-antipattern
    knowledge:
      - architecture
      - implementation-semantics
    dynamic_facets:
      pool: coding-facets
    instruction: simple-review-fix
    structured_output:
      schema_ref: simple-review-result
    output_contracts:
      report:
        - name: review-summary.md
          format: simple-review-fix
    rules:
      - condition: when(structured.review-fix.result == "APPROVE")
        next: COMPLETE
      - condition: when(structured.review-fix.result == "REJECT")
        next: ABORT
