name: review-fix-simple
subworkflow:
  callable: true
  visibility: internal
  params:
    gather_instructions:
      type: facet_ref[]
      facet_kind: instruction
      default: [gather-review]
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    adjudication_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    final_gate_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing, review, architecture]
description: One read-only reviewer followed by adjudicated repair, follow-up review, and final requirement check.
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction

initial_step: gather

steps:
  - name: gather
    uses: review-gather-with-clarification-to-reviewers
    instruction:
      $param: gather_instructions
    rules:
      - condition: Review target information gathered
        next: reviewers
      - condition: Cannot identify review target, insufficient info
        next: ABORT
        appendix: |
          Clarifications needed:
          - {Question 1}
          - {Question 2}

  - name: reviewers
    input_reports:
      from_step: gather
      reports: [review-target.md]
    description: Proceed from a single reviewer through finding adjudication, fixes, and follow-up review, then confirm requirement fulfillment.
    kind: workflow_call
    call: peer-review
    args:
      reviewer_suite: single-review-suite
      review_policy_additions:
        $param: review_policy_additions
      adjudication_policy_additions:
        $param: adjudication_policy_additions
      review_knowledge_additions:
        - architecture
        - unit-testing
        - e2e-testing
      security_review_knowledge_additions: []
      security_review_pool: security-review-facets
      fix_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      remediation_workflow: development-remediation-dynamic
      fix_pool: coding-facets
      plan_policy:
        - coding
        - testing
        - review
        - architecture
      fix_policy:
        - coding
        - testing
        - ai-antipattern
      fix_knowledge:
        - architecture
        - implementation-semantics
      verification_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
      verification_policy:
        - coding
        - testing
        - review
        - architecture
      final_gate_policy:
        $param: final_gate_policy
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_replan_instruction: scenario-based-fix-replan
      fix_verification_replan_instruction: scenario-based-verification-replan
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: need_replan
        next: ABORT
      - condition: ABORT
        next: ABORT
