params:
  review_policy_additions:
    type: facet_ref[]
    facet_kind: policy
  review_knowledge_additions:
    type: facet_ref[]
    facet_kind: knowledge
  security_review_knowledge_additions:
    type: facet_ref[]
    facet_kind: knowledge
  security_review_pool:
    type: facet_pool_ref
  architecture_review_instruction:
    type: facet_ref
    facet_kind: instruction
  security_review_instruction:
    type: facet_ref
    facet_kind: instruction
  testing_review_instruction:
    type: facet_ref
    facet_kind: instruction
  coding_review_instruction:
    type: facet_ref
    facet_kind: instruction
  ai_antipattern_review_instruction:
    type: facet_ref
    facet_kind: instruction
name: reviewers
description: 設計やテスト、コードを専門ごとに並列にレビューし、修正の要否を判定する
tags:
  - review
parallel:
  fixed:
    - name: arch-review
      description: 構造や責務、依存関係、呼び出し経路を調べ、設計上の問題を報告する
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: architecture-reviewer
      policy:
        - architecture
        - contract-change
        - review
        - $param: review_policy_additions
      knowledge:
        - architecture
        - $param: review_knowledge_additions
      instruction:
        $param: architecture_review_instruction
      output_contracts:
        report:
          - name: architect-review.md
            format: architecture-review
    - name: testing-review
      description: 要求と実装されたテストを照合し、検証の不足やテスト設計の問題を報告する
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: testing-reviewer
      policy:
        - testing
        - takt
        - contract-change
        - review
        - $param: review_policy_additions
      knowledge:
        - unit-testing
        - e2e-testing
        - takt
        - $param: review_knowledge_additions
      instruction:
        $param: testing_review_instruction
      output_contracts:
        report:
          - name: testing-review.md
            format: testing-review
    - name: coding-review
      description: 要求と差分を照合し、実装の不具合や既存動作への影響を報告する
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: coding-reviewer
      policy:
        - takt
        - contract-change
        - review
        - coding
        - $param: review_policy_additions
      knowledge:
        - takt
        - $param: review_knowledge_additions
      pass_previous_response: false
      instruction:
        $param: coding_review_instruction
      output_contracts:
        report:
          - name: coding-review.md
            format: coding-review
    - name: ai-antipattern-review-2nd
      description: AI特有の実装上の問題を調べ、修正が必要な指摘を報告する
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: ai-antipattern-reviewer
      policy:
        - ai-antipattern
        - takt
        - contract-change
        - review
        - $param: review_policy_additions
      knowledge:
        - takt
        - $param: review_knowledge_additions
      instruction:
        $param: ai_antipattern_review_instruction
      output_contracts:
        report:
          - name: ai-antipattern-review.md
            format: ai-antipattern-review
  pool:
    - name: security-review
      description: 秘密情報、外部入力、権限、外部との境界にかかわる変更を、セキュリティの観点でレビューする
      selection_hint: 既定では選ばない。(a) 変更が secret または credential の取扱い、外部入力の処理、process 実行、filesystem 操作、network または terminal の境界、sandbox、権限に影響し得る場合、または (b) 修正の規模が大きく、セキュリティへの影響がないと判断しきれない場合に選ぶ。ドキュメントのみ・コメントのみ・テストのみの変更や小さな局所修正でも、(a) または (b) に該当すれば選ぶ。どちらにも該当しなければ選ばない。
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: security-reviewer
      policy:
        - contract-change
        - security-review
        - $param: review_policy_additions
      knowledge:
        - security
        - security-data
        - security-dependencies
        - $param: security_review_knowledge_additions
      dynamic_facets:
        pool:
          $param: security_review_pool
        selector:
          instruction: select-applicable-candidates
      instruction:
        $param: security_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: security-review.md
            format: security-review
  selection:
    selector:
      instruction: select-applicable-candidates
