params:
  review_policy_additions:
    type: facet_ref[]
    facet_kind: policy
  review_knowledge_additions:
    type: facet_ref[]
    facet_kind: knowledge
name: reviewers
tags:
  - review
parallel:
  - name: arch-review
    tags:
      - review
    edit: false
    persona: architecture-reviewer
    policy:
      - review
      - $param: review_policy_additions
    knowledge:
      - architecture
      - $param: review_knowledge_additions
    provider_options:
      extends: review-readonly
    instruction: review-arch
    output_contracts:
      report:
        - name: architect-review.md
          format: architecture-review
  - name: security-review
    tags:
      - review
    edit: false
    persona: security-reviewer
    policy:
      - review
      - $param: review_policy_additions
    knowledge:
      - security
      - takt
      - $param: review_knowledge_additions
    provider_options:
      extends: review-readonly
    instruction: review-security
    output_contracts:
      report:
        - name: security-review.md
          format: security-review
  - name: qa-review
    tags:
      - review
    edit: false
    persona: qa-reviewer
    policy:
      - review
      - qa
      - $param: review_policy_additions
    knowledge:
      - takt
      - $param: review_knowledge_additions
    provider_options:
      extends: review-readonly
    instruction: review-qa
    output_contracts:
      report:
        - name: qa-review.md
          format: qa-review
  - name: testing-review
    tags:
      - review
    edit: false
    persona: testing-reviewer
    policy:
      - review
      - testing
      - $param: review_policy_additions
    knowledge:
      - unit-testing
      - e2e-testing
      - takt
      - $param: review_knowledge_additions
    provider_options:
      extends: review-readonly
    instruction: review-test
    output_contracts:
      report:
        - name: testing-review.md
          format: testing-review
  - name: coding-review
    tags:
      - review
    edit: false
    persona: coding-reviewer
    policy:
      - review
      - coding
      - $param: review_policy_additions
    knowledge:
      - takt
      - $param: review_knowledge_additions
    pass_previous_response: false
    provider_options:
      extends: review-readonly
    instruction: review-coding
    output_contracts:
      report:
        - name: coding-review.md
          format: coding-review
  - name: ai-antipattern-review-2nd
    tags:
      - review
    edit: false
    persona: ai-antipattern-reviewer
    policy:
      - review
      - ai-antipattern
      - $param: review_policy_additions
    knowledge:
      - takt
      - $param: review_knowledge_additions
    provider_options:
      extends: review-readonly
    instruction: ai-antipattern-review
    output_contracts:
      report:
        - name: ai-antipattern-review.md
          format: ai-antipattern-review
