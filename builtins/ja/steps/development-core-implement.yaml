required_permission_mode: edit
team_leader:
  max_parts: 2
  part_tags:
    - coding
  part_persona: coder
  part_edit: true
  part_permission_mode: edit
  part_allowed_tools:
    - Read
    - Glob
    - Grep
    - Edit
    - Write
    - Bash
    - WebSearch
    - WebFetch
instruction:
  $param: implementation_instruction
output_contracts:
  report:
    - name: coder-scope.md
      format: coder-scope
      use_judge: false
    - name: coder-decisions.md
      format: coder-decisions
      use_judge: false
