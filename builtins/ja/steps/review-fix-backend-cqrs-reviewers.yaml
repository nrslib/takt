params:
  architecture_review_instruction:
    type: facet_ref
    facet_kind: instruction
  coding_review_instruction:
    type: facet_ref
    facet_kind: instruction
  security_review_instruction:
    type: facet_ref
    facet_kind: instruction
  cqrs_es_review_instruction:
    type: facet_ref
    facet_kind: instruction
tags:
  - review
parallel:
  fixed:
    - name: arch-review
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: architecture-reviewer
      policy:
        - contract-change
        - review
        - architecture
        - backend
      knowledge:
        - architecture
        - backend
      instruction:
        $param: architecture_review_instruction
      output_contracts:
        report:
          - name: architect-review.md
            format: architecture-review

    - name: cqrs-es-review
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: cqrs-es-reviewer
      policy:
        - cqrs-es
        - contract-change
        - review
        - backend
      knowledge:
        - cqrs-es
        - backend
      instruction:
        $param: cqrs_es_review_instruction
      output_contracts:
        report:
          - name: cqrs-es-review.md
            format: cqrs-es-review

    - name: coding-review
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: coding-reviewer
      policy:
        - contract-change
        - review
        - coding
      instruction:
        $param: coding_review_instruction
      output_contracts:
        report:
          - name: coding-review.md
            format: coding-review

  pool:
    - name: security-review
      description: 既定では選ばない。(a) 変更が secret または credential の取扱い、外部入力の処理、process 実行、filesystem 操作、network または terminal の境界、sandbox、権限に影響し得る場合、または (b) 修正の規模が大きく、セキュリティへの影響がないと判断しきれない場合に選ぶ。ドキュメントのみ・コメントのみ・テストのみの変更や小さな局所修正でも、(a) または (b) に該当すれば選ぶ。どちらにも該当しなければ選ばない。
      capabilities: readonly
      tags:
        - review
      edit: false
      persona: security-reviewer
      policy:
        - contract-change
        - security-review
      knowledge:
        - security
        - security-data
        - security-dependencies
      dynamic_facets:
        pool: security-review-facets
        selector:
          instruction: select-applicable-candidates
      instruction:
        $param: security_review_instruction
      output_contracts:
        report:
          - name: security-review.md
            format: security-review
  selection:
    selector:
      instruction: select-applicable-candidates
