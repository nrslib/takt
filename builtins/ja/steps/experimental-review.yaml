params:
  review_policy_additions:
    type: facet_ref[]
    facet_kind: policy
  review_knowledge_additions:
    type: facet_ref[]
    facet_kind: knowledge
  security_review_knowledge_additions:
    type: facet_ref[]
    facet_kind: knowledge
  security_review_pool:
    type: facet_pool_ref
  architecture_review_instruction: { type: facet_ref, facet_kind: instruction }
  security_review_instruction: { type: facet_ref, facet_kind: instruction }
  testing_review_instruction: { type: facet_ref, facet_kind: instruction }
  coding_review_instruction: { type: facet_ref, facet_kind: instruction }
  ai_antipattern_review_instruction: { type: facet_ref, facet_kind: instruction }
  frontend_review_instruction: { type: facet_ref, facet_kind: instruction }

name: review
tags: [review]
parallel:
  fixed:
    - name: coding-review
      capabilities: readonly
      tags: [review]
      edit: false
      persona: coding-reviewer
      policy:
        - contract-change
        - review
        - coding
        - testing
        - $param: review_policy_additions
      knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - $param: review_knowledge_additions
      instruction:
        $param: coding_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: coding-review.md
            format: coding-review
    - name: ai-antipattern-review
      capabilities: readonly
      tags: [review]
      edit: false
      persona: ai-antipattern-reviewer
      policy:
        - contract-change
        - review
        - ai-antipattern
        - $param: review_policy_additions
      knowledge:
        - architecture
        - $param: review_knowledge_additions
      instruction:
        $param: ai_antipattern_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: ai-antipattern-review.md
            format: ai-antipattern-review
  pool:
    - name: architecture-review
      description: モジュール構造、責務分割、依存方向、呼び出し経路をレビューする
      capabilities: readonly
      tags: [review]
      edit: false
      persona: architecture-reviewer
      policy:
        - contract-change
        - review
        - $param: review_policy_additions
      knowledge:
        - architecture
        - $param: review_knowledge_additions
      instruction:
        $param: architecture_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: architecture-review.md
            format: architecture-review
    - name: frontend-review
      description: UI、コンポーネント、状態管理、アクセシビリティをレビューする
      capabilities: readonly
      tags: [review]
      edit: false
      persona: frontend-reviewer
      policy:
        - contract-change
        - review
        - $param: review_policy_additions
      knowledge:
        - frontend
        - react
        - $param: review_knowledge_additions
      instruction:
        $param: frontend_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: frontend-review.md
            format: frontend-review
    - name: backend-review
      description: API、ドメインロジック、サーバー側処理、永続化をレビューする
      capabilities: readonly
      tags: [review]
      edit: false
      persona: coding-reviewer
      policy:
        - contract-change
        - review
        - coding
        - $param: review_policy_additions
      knowledge:
        - backend
        - architecture
        - $param: review_knowledge_additions
      instruction:
        $param: coding_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: backend-review.md
            format: coding-review
    - name: security-review
      description: 既定では選ばない。(a) 変更が secret または credential の取扱い、外部入力の処理、process 実行、filesystem 操作、network または terminal の境界、sandbox、権限に影響し得る場合、または (b) 修正の規模が大きく、セキュリティへの影響がないと判断しきれない場合に限って選ぶ。ドキュメントのみ・コメントのみ・テストのみの変更や小さな局所修正では選ばない。
      capabilities: readonly
      tags: [review]
      edit: false
      persona: security-reviewer
      policy:
        - contract-change
        - security-review
        - $param: review_policy_additions
      knowledge:
        - security
        - security-data
        - security-dependencies
        - $param: security_review_knowledge_additions
      dynamic_facets:
        pool:
          $param: security_review_pool
        selector:
          instruction: select-applicable-candidates
      instruction:
        $param: security_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: security-review.md
            format: security-review
    - name: testing-review
      description: テストカバレッジ、テスト設計、統合境界、E2E境界をレビューする
      capabilities: readonly
      tags: [review]
      edit: false
      persona: testing-reviewer
      policy:
        - contract-change
        - review
        - testing
        - $param: review_policy_additions
      knowledge:
        - unit-testing
        - e2e-testing
        - $param: review_knowledge_additions
      instruction:
        $param: testing_review_instruction
      pass_previous_response: false
      output_contracts:
        report:
          - name: testing-review.md
            format: testing-review
  selection:
    reports:
      - review-resolution.md
    selector:
      instruction: select-applicable-candidates
