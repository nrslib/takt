name: workflow-maker
description: Workflow Maker は分離された TAKT workflow bundle を作成または改修し、完了前にレビューします。
max_steps: 12
initial_step: create

personas:
  maker: ../facets/personas/coder.md
  reviewer: ../facets/personas/architecture-reviewer.md
policies:
  takt: ../facets/policies/takt.md
knowledge:
  takt: ../facets/knowledge/takt.md
instructions:
  create: ../facets/instructions/workflow-maker-create.md
  review: ../facets/instructions/workflow-maker-review.md
  fix: ../facets/instructions/workflow-maker-fix.md
report_formats:
  doctor: ../facets/output-contracts/workflow-maker-doctor.md
  review: ../facets/output-contracts/workflow-maker-review.md

steps:
  - name: create
    description: 要求に沿ってワークフロー一式を作成・改修し、doctor相当の検証結果を報告する
    capabilities: edit
    edit: true
    persona: maker
    policy: takt
    knowledge: takt
    instruction: create
    output_contracts:
      report:
        - name: workflow-maker-doctor.md
          format: doctor
    rules:
      - condition: completed
        next: review

  - name: review
    description: 成果物とdoctor相当の検証報告を要求に照合し、承認か修正かを判定する
    capabilities: readonly
    edit: false
    persona: reviewer
    policy: takt
    knowledge: takt
    instruction: review
    pass_previous_response: false
    output_contracts:
      report:
        - name: workflow-maker-review.md
          format: review
    rules:
      - condition: approved
        next: COMPLETE
      - condition: needs_fix
        next: fix

  - name: fix
    description: レビューで指摘された欠陥を修正し、doctor相当の再検証結果を報告する
    capabilities: edit
    edit: true
    persona: maker
    policy: takt
    knowledge: takt
    instruction: fix
    pass_previous_response: false
    output_contracts:
      report:
        - name: workflow-maker-doctor.md
          format: doctor
    rules:
      - condition: completed
        next: review
