name: peer-review-suite-finding-contract-base
description: 標準5専門レビューを Finding Contract 出力で実行し、live ledger state を返す共通レビュースイート。
subworkflow:
  callable: true
  visibility: internal
  requires_finding_contract: true
  returns: [needs_fix, needs_review, needs_terminal_adjudication, need_replan]
  params:
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default: []
initial_step: reviewers
steps:
  - name: reviewers
    uses: peer-review-reviewers-finding-contract
    with:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      self:
        - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
          next: finding-conflict-adjudication
        - condition: when(findings.conflicts.count > 0)
          next: ABORT
        - condition: when(findings.reviewerAnomalies.requiresGuaranteedPresentationCount > 0)
          return: needs_review
        - condition: when(findings.reviewerAnomalies.claimBearingTerminalCount > 0)
          return: needs_terminal_adjudication
        - condition: when(findings.reviewerAnomalies.restatementReadyCount > 0)
          return: needs_review
        - condition: when(findings.provisional.dismissEligible.count > 0 && findings.conflicts.count == 0)
          return: needs_terminal_adjudication
        - condition: when(findings.provisional.fixpoint == true && findings.conflicts.count == 0)
          return: need_replan
        - condition: when(findings.rounds.budgetExhausted == true && findings.provisional.count > 0 && findings.conflicts.count == 0)
          return: need_replan
        - condition: when(findings.provisional.count > 0 && findings.conflicts.count == 0)
          return: need_replan
        - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0 && findings.reviewerAnomalies.budgetExhausted == true)
          return: need_replan
        - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0)
          return: needs_review
        - condition: when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
          next: COMPLETE
        - condition: when(findings.open.count > 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
          return: needs_fix
      parallel:
        arch-review: [{ condition: approved }, { condition: needs_fix }]
        security-review: [{ condition: approved }, { condition: needs_fix }]
        testing-review: [{ condition: approved }, { condition: needs_fix }]
        coding-review: [{ condition: approved }, { condition: needs_fix }]
        ai-antipattern-review-2nd: [{ condition: approved }, { condition: needs_fix }]
