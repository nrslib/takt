name: takt-default-localllm
description: 通常の Finding Contract レビューをローカルモデルへ振り分け、integrity・境界・最終 gate を高信頼経路へ分離する TAKT 開発ワークフロー。
finding_contract:
  manager:
    persona: findings-manager
    instruction: findings-manager
    output_contract: findings-manager
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy: [design-planning]
      plan_knowledge: [takt, architecture]
      testing_policy: [coding, testing, takt-testing]
      testing_knowledge: [takt, architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing, takt-testing]
      development_knowledge: [takt, architecture, task-decomposition]
      implementation_instruction: team-leader-implement
      replan_instruction: replan-implementation-finding-contract
      peer_review_workflow: peer-review-finding-contract-localllm
      review_policy: [coding, testing, review]
      review_knowledge: [takt, architecture, implementation-semantics, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
