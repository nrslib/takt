name: peer-review
description: 専門並列ピアレビュー（+ ai-antipattern-review-2nd）→ 修正計画 → 修正のループ後、merge-readiness-review、supervise の順で最終ゲートを実行する。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    arch_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - takt
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - takt
        - architecture
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 30
initial_step: reviewers
loop_monitors:
  - cycle:
      - reviewers
      - fix-plan
      - fix
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（指摘数が減少、修正が反映されている）
          next: reviewers
        - condition: 非生産的（同じ指摘が繰り返される）
          next: ABORT
  - cycle:
      - reviewers
      - final-gate
      - fix-plan
      - fix
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（指摘数が減少、修正が反映されている）
          next: reviewers
        - condition: 非生産的（同じ指摘が繰り返される）
          next: ABORT
steps:
  - name: reviewers
    uses: peer-review-reviewers
    with:
      arch_knowledge:
        $param: arch_knowledge
    rules:
      self:
        - condition: all("approved")
          next: final-gate
        - condition: any("needs_fix")
          next: fix-plan
      parallel:
        arch-review: [{ condition: approved }, { condition: needs_fix }]
        security-review: [{ condition: approved }, { condition: needs_fix }]
        qa-review: [{ condition: approved }, { condition: needs_fix }]
        testing-review: [{ condition: approved }, { condition: needs_fix }]
        coding-review: [{ condition: approved }, { condition: needs_fix }]
        ai-antipattern-review-2nd: [{ condition: approved }, { condition: needs_fix }]
  - name: final-gate
    uses: peer-review-final-gate
    with:
      arch_knowledge:
        $param: arch_knowledge
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_fix
        next: fix-plan
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
  - name: fix-plan
    uses: peer-review-fix-plan
    with:
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: 修正計画を確定した
        next: fix
      - condition: タスク全体の再計画が必要
        return: need_replan
  - name: fix
    uses: peer-review-fix
    with:
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: 修正完了
        next: reviewers
      - condition: 修正計画の見直しが必要
        next: fix-plan
      - condition: 判断できない、情報不足
        return: need_replan
