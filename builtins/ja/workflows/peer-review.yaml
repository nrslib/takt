name: peer-review
description: 専門並列ピアレビュー（+ ai-antipattern-review-2nd）→ 指摘裁定 → 共通修正ループ後、merge-readiness 観点を統合した supervisor が最終裁定する。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    reviewer_suite:
      type: workflow_ref
      default: peer-review-suite-base
    fix_companions:
      type: companion_ref[]
      default: []
    fix_pool:
      type: facet_pool_ref
      default: coding-facets
    remediation_workflow:
      type: workflow_ref
      default: development-remediation
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - takt
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - takt
        - architecture
    verification_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - takt
        - architecture
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    fix_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
    verification_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    fix_plan_instruction:
      type: facet_ref
      facet_kind: instruction
      default: fix-plan-from-review-resolution
    fix_plan_report_format:
      type: facet_ref
      facet_kind: report_format
      default: fix-plan
    final_gate_instruction:
      type: facet_ref
      facet_kind: instruction
      default: supervise-merge-readiness
facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets
initial_step: initial-reviewers
loop_monitors:
  - cycle:
      - reviewers
      - review-adjudication
      - remediation
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: reviewers
        - condition: 修正未完了または報告未収束だが、次のレビュー・修正が実行可能である
          next: reviewers
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: remediation
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
  - cycle:
      - reviewers
      - review-adjudication
      - final-gate
      - remediation
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: reviewers
        - condition: 修正未完了または報告未収束だが、次のレビュー・修正が実行可能である
          next: reviewers
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: remediation
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
steps:
  - name: initial-reviewers
    uses: peer-review-suite-call
    with:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
      architecture_review_instruction: architecture-review
      security_review_instruction: security-review
      testing_review_instruction: testing-review
      coding_review_instruction: coding-review
      ai_antipattern_review_instruction: initial-ai-antipattern-review
      frontend_review_instruction: frontend-review
      cqrs_es_review_instruction: cqrs-es-review
      review_completion_retry_instruction: initial-review-completion-retry
    rules:
      - condition: COMPLETE
        next: review-adjudication
      - condition: needs_fix
        next: review-adjudication
  - name: reviewers
    uses: peer-review-suite-call
    with:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
      architecture_review_instruction: follow-up-architecture-review
      security_review_instruction: follow-up-security-review
      testing_review_instruction: follow-up-testing-review
      coding_review_instruction: follow-up-coding-review
      ai_antipattern_review_instruction: follow-up-ai-antipattern-review
      frontend_review_instruction: follow-up-frontend-review
      cqrs_es_review_instruction: follow-up-cqrs-es-review
      review_completion_retry_instruction: follow-up-review-completion-retry
    rules:
      - condition: COMPLETE
        next: review-adjudication
      - condition: needs_fix
        next: review-adjudication
  - name: review-adjudication
    uses: peer-review-adjudication
    with:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: 修正対象あり
        next: remediation
      - condition: 修正対象なし
        next: final-gate
      - condition: タスク全体の再計画が必要
        return: need_replan
  - name: final-gate
    uses: peer-review-final-gate
    with:
      merge_readiness_policy:
        $param: verification_policy
      review_knowledge:
        $param: review_knowledge_additions
      final_gate_instruction:
        $param: final_gate_instruction
    rules:
      - condition: マージ可能
        next: COMPLETE
      - condition: 修正が必要
        next: remediation
      - condition: タスク全体の再計画が必要
        return: need_replan
      - condition: 実行環境により判定不能
        next: ABORT
  - name: remediation
    kind: workflow_call
    call:
      $param: remediation_workflow
    args:
      fix_pool:
        $param: fix_pool
      fix_companions:
        $param: fix_companions
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      verification_knowledge:
        $param: verification_knowledge
      plan_policy:
        $param: plan_policy
      verification_policy:
        $param: verification_policy
      fix_plan_instruction:
        $param: fix_plan_instruction
      fix_plan_report_format:
        $param: fix_plan_report_format
    rules:
      - condition: COMPLETE
        next: reviewers
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
