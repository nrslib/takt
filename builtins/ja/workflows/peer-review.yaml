name: peer-review
description: 専門並列ピアレビュー（+ ai-antipattern-review-2nd）→ 指摘裁定 → 共通修正ループ後、merge-readiness 観点を統合した supervisor が最終裁定する。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    reviewer_suite:
      type: workflow_ref
      default: peer-review-suite-base
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - takt
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - takt
        - architecture
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    fix_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
    verification_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 30
initial_step: initial-reviewers
loop_monitors:
  - cycle:
      - reviewers
      - review-adjudication
      - fix-plan
      - fix
    ignore_steps:
      - fix-verifier
      - fix-retry
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: reviewers
        - condition: 修正未完了または報告未収束だが、次のレビュー・修正が実行可能である
          next: reviewers
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: fix-plan
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
  - cycle:
      - reviewers
      - review-adjudication
      - final-gate
      - fix-plan
      - fix
    ignore_steps:
      - fix-verifier
      - fix-retry
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: reviewers
        - condition: 修正未完了または報告未収束だが、次のレビュー・修正が実行可能である
          next: reviewers
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: fix-plan
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
  - cycle:
      - fix-plan
      - fix
    ignore_steps:
      - fix-verifier
      - fix-retry
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: fix-plan
        - condition: 修正未完了または報告未収束だが、次のレビュー・修正が実行可能である
          next: fix-plan
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: fix-plan
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
  - cycle:
      - fix-retry
      - fix-verifier
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: fix-retry
        - condition: 修正未完了または報告未収束だが、次の修正が実行可能である
          next: fix-retry
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: fix-plan
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
steps:
  - name: initial-reviewers
    uses: peer-review-suite-call
    vars:
      review_mode: initial
    with:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: COMPLETE
        next: review-adjudication
      - condition: needs_fix
        next: review-adjudication
  - name: reviewers
    uses: peer-review-suite-call
    vars:
      review_mode: follow_up
    with:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: COMPLETE
        next: review-adjudication
      - condition: needs_fix
        next: review-adjudication
  - name: review-adjudication
    uses: peer-review-adjudication
    with:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: 修正対象あり
        next: fix-plan
      - condition: 修正対象なし
        next: final-gate
      - condition: タスク全体の再計画が必要
        return: need_replan
  - name: final-gate
    uses: peer-review-final-gate
    with:
      merge_readiness_policy:
        $param: verification_policy
      review_knowledge:
        $param: review_knowledge_additions
    rules:
      - condition: マージ可能
        next: COMPLETE
      - condition: 修正が必要
        next: fix-plan
      - condition: タスク全体の再計画が必要
        return: need_replan
      - condition: 実行環境により判定不能
        next: ABORT
  - name: fix-plan
    uses: peer-review-fix-plan
    with:
      plan_policy:
        $param: plan_policy
      fix_knowledge:
        $param: fix_knowledge
      plan_instruction: fix-plan-from-review-resolution
    rules:
      - condition: 修正計画を確定した
        next: fix
      - condition: タスク全体の再計画が必要
        return: need_replan

  - name: fix
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: apply-fix-plan
    rules:
      - condition: 修正完了
        next: fix-verifier
      - condition: 修正計画の見直しが必要
        next: fix-plan
      - condition: タスク全体の再計画が必要
        return: need_replan

  - name: fix-verifier
    uses: peer-review-fix-verifier
    with:
      verification_policy:
        $param: verification_policy
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: verified
        next: reviewers
      - condition: incomplete
        next: fix-retry
      - condition: plan_invalid
        next: fix-plan

  - name: fix-retry
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: apply-fix-verification
    rules:
      - condition: 修正完了
        next: fix-verifier
      - condition: 修正計画の見直しが必要
        next: fix-plan
      - condition: タスク全体の再計画が必要
        return: need_replan
