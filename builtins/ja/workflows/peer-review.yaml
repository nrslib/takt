name: peer-review
description: 専門並列ピアレビュー（+ ai-antipattern-review-2nd）→ 修正計画 → 修正 → 修正完了検証のループ後、merge-readiness-review、supervise の順で最終ゲートを実行する。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    reviewer_suite:
      type: workflow_ref
      default: peer-review-suite-base
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - takt
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - takt
        - architecture
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    fix_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
    verification_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    supervisor_persona:
      type: facet_ref
      facet_kind: persona
      default: supervisor
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 30
initial_step: reviewers
loop_monitors:
  - cycle:
      - reviewers
      - remediation
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: reviewers
        - condition: 修正未完了または報告未収束だが、次のレビュー・修正が実行可能である
          next: reviewers
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: remediation
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
  - cycle:
      - reviewers
      - final-gate
      - remediation
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: reviewers
        - condition: 修正未完了または報告未収束だが、次のレビュー・修正が実行可能である
          next: reviewers
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: remediation
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
steps:
  - name: reviewers
    kind: workflow_call
    call:
      $param: reviewer_suite
    args:
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: COMPLETE
        next: final-gate
      - condition: needs_fix
        next: remediation
  - name: final-gate
    uses: peer-review-final-gate
    with:
      merge_readiness_policy:
        $param: verification_policy
      merge_readiness_knowledge:
        $param: review_knowledge_additions
      supervise_knowledge:
        $param: review_knowledge_additions
      supervisor_persona:
        $param: supervisor_persona
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_fix
        next: remediation
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
  - name: remediation
    uses: review-remediation
    with:
      plan_policy:
        $param: plan_policy
      fix_policy:
        $param: fix_policy
      verification_policy:
        $param: verification_policy
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: COMPLETE
        next: reviewers
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
