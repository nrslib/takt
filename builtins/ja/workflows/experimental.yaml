name: experimental
description: 動的実装 companion と、共通コアの裁定・修正検証付きピアレビュー収束ループ、マージ準備ゲートを使う実験的コーディングワークフロー。
max_steps: 51
initial_step: develop

steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      implementation_workflow: development-implement-dynamic
      remediation_workflow: development-remediation-dynamic
      implementation_companions:
        fixed: [ai-antipattern-review-companion]
        pool: []
        moderator: ai-antipattern-review-moderator
      reviewer_suite: experimental-review
      review_policy_additions: []
      review_policy: [coding, testing, review]
      review_knowledge: [architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
