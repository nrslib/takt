name: experimental
description: 汎用の計画、テスト、実装、レビュー、修正、最終監督を共通コアへ委譲する実験的なコーディングワークフロー。
max_steps: 51
initial_step: develop

steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      implementation_companions: [ai-antipattern-review-companion]
      review_workflow: experimental-review
      review_policy_additions: []
      review_policy: [coding, testing, review]
      review_knowledge: [architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
