name: review-fix-dual-cqrs
description: フロントエンド＋CQRS+ES特化レビュー＋修正ループ（構造・モジュール化・ドメインモデル・コンポーネント設計・セキュリティ・コーディング）
max_steps: 30
initial_step: gather
loop_monitors:
  - cycle:
      - reviewers
      - final-gate
      - remediation
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: reviewers
        - condition: 修正未完了または報告未収束だが、次のレビュー・修正が実行可能である
          next: reviewers
        - condition: 現行ループでは収束せず、最終ゲートの判定が必要である
          next: final-gate

steps:
  - name: gather
    uses: review-gather-to-reviewers
    rules:
      - condition: レビュー対象の情報収集完了
        next: reviewers
      - condition: レビュー対象を特定できない、情報不足
        next: ABORT

  - name: reviewers
    tags:
      - review
    parallel:
      - name: arch-review
        capabilities: readonly
        tags:
          - review
        edit: false
        persona: architecture-reviewer
        policy:
          - contract-change
          - review
        knowledge:
          - architecture
          - frontend
          - backend
        instruction: review-arch
        output_contracts:
          report:
            - name: architect-review.md
              format: architecture-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: cqrs-es-review
        capabilities: readonly
        tags:
          - review
        edit: false
        persona: cqrs-es-reviewer
        policy:
          - contract-change
          - review
        knowledge:
          - cqrs-es
          - backend
        instruction: review-cqrs-es
        output_contracts:
          report:
            - name: cqrs-es-review.md
              format: cqrs-es-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: frontend-review
        capabilities: readonly
        tags:
          - review
        edit: false
        persona: frontend-reviewer
        policy:
          - contract-change
          - review
          - design-fidelity
        knowledge: frontend
        instruction: review-frontend
        output_contracts:
          report:
            - name: frontend-review.md
              format: frontend-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: security-review
        capabilities: readonly
        tags:
          - review
        edit: false
        persona: security-reviewer
        policy:
          - contract-change
          - security-review
        knowledge: [security, security-web, security-api, security-data, security-dependencies]
        instruction: review-security
        output_contracts:
          report:
            - name: security-review.md
              format: security-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: coding-review
        capabilities: readonly
        tags:
          - review
        edit: false
        persona: coding-reviewer
        policy:
          - contract-change
          - review
          - coding
        instruction: review-coding
        output_contracts:
          report:
            - name: coding-review.md
              format: coding-review
        rules:
          - condition: approved
          - condition: needs_fix

    rules:
      - condition: any("error")
        next: reviewers
      - condition: all("approved")
        next: final-gate
      - condition: any("needs_fix")
        next: remediation

  - name: final-gate
    kind: workflow_call
    call: supervisor-final-gate
    args:
      supervise_knowledge:
        - frontend
        - backend
        - cqrs-es
        - security
        - architecture
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_fix
        next: remediation
      - condition: need_replan
        next: ABORT
      - condition: ABORT
        next: ABORT
  - name: remediation
    uses: review-remediation
    with:
      plan_policy:
        - coding
        - testing
        - design-fidelity
        - screen-api
        - review
      fix_policy:
        - coding
        - testing
        - design-fidelity
        - screen-api
      verification_policy:
        - coding
        - testing
        - design-fidelity
        - screen-api
        - review
      fix_knowledge:
        - frontend
        - backend
        - cqrs-es
        - security
        - architecture
    rules:
      - condition: COMPLETE
        next: reviewers
      - condition: need_replan
        next: final-gate
      - condition: ABORT
        next: ABORT
