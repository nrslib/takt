name: frontend
description: フロントエンド向けファセットを共通開発フローへ注入するワークフロー。
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy: [design-planning]
      plan_knowledge: [frontend, react, architecture]
      testing_policy: [coding, testing]
      testing_knowledge: [frontend, react, architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing, design-fidelity]
      development_knowledge: [frontend, react, security, architecture]
      review_workflow: peer-review-suite-frontend
      review_policy: [coding, testing, design-fidelity, review]
      review_knowledge: [frontend, react, security, architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
