name: finding-contract-local-review
description: ローカルモデルの専門レビュー後、継承した Finding Contract ledger を terminal authority の integrity gate で検証する。
subworkflow:
  callable: true
  visibility: internal
  requires_finding_contract: true
  returns:
    - needs_fix
    - need_replan
max_steps: 10
initial_step: reviewers
loop_monitors:
  - cycle: [reviewers, integrity-gate]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-gate-needs-review-finding-contract
      rules:
        - condition: 不足証跡を具体的に取得でき、同じローカルレビューを再実行する価値がある
          next: reviewers
        - condition: 同じローカルレビューでは不足証跡を取得できない
          next: ABORT
steps:
  - name: reviewers
    uses: reviewers
    rules:
      self:
        - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
          next: finding-conflict-adjudication
        - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count == 0 && findings.rounds.budgetExhausted == false)
          next: integrity-gate
        - condition: when(findings.conflicts.count > 0)
          next: ABORT
        - condition: when(findings.provisional.dismissEligible.count > 0 && findings.conflicts.count == 0)
          next: integrity-gate
        - condition: when(findings.provisional.fixpoint == true && findings.conflicts.count == 0)
          return: need_replan
        - condition: when(findings.rounds.budgetExhausted == true && findings.provisional.count > 0 && findings.conflicts.count == 0)
          return: need_replan
        - condition: when(findings.provisional.count > 0 && findings.conflicts.count == 0)
          return: need_replan
        - condition: when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
          next: integrity-gate
        - condition: when(findings.open.count > 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
          return: needs_fix
      parallel:
        arch-review: [{ condition: approved }, { condition: needs_fix }]
        ai-antipattern-review: [{ condition: No AI-specific issues }, { condition: AI-specific issues found }]
        coding-review: [{ condition: approved }, { condition: needs_fix }]
        implementation-semantics-review: [{ condition: approved }, { condition: needs_fix }]
        contract-lifecycle-review: [{ condition: approved }, { condition: needs_fix }]
        robustness-review: [{ condition: approved }, { condition: needs_fix }]

  - name: integrity-gate
    uses: finding-contract-final-gate
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_review
        next: reviewers
      - condition: need_replan
        return: need_replan
      - condition: needs_fix
        return: needs_fix
      - condition: needs_conflict_adjudication
        next: finding-conflict-adjudication
      - condition: ABORT
        next: ABORT
