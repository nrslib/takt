name: development-implement-dynamic
description: 共通開発 workflow で動的ファセットを使う実装実行。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    implementation_pool:
      type: facet_pool_ref
      default: coding-facets
    implementation_companions:
      type: companion_ref[]
      default: []
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - ai-antipattern
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - implementation-semantics
    implementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-implement-with-reports
    scope_report_format:
      type: facet_ref
      facet_kind: report_format
      default: coder-scope
facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets
initial_step: implement
steps:
  - name: implement
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    instruction:
      - $param: implementation_instruction
      - development-implementation-completion
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: implementation_instruction
      scope_report_format:
        $param: scope_report_format
    dynamic_facets:
      pool:
        $param: implementation_pool
    companion:
      $param: implementation_companions
    rules:
      - condition: 今回必要な実装を行い、必須検証も完了した（変更と因果関係がなく、今回の必須条件でもない既存失敗・対象外作業は完了を妨げない。レポートの未完了ラベルだけでは差し戻さない）
        next: COMPLETE
      - condition: 今回必要な実装変更がなく、必須検証も完了した（レポート作成のみ。未着手の必須作業がある場合は除く）
        next: COMPLETE
      - condition: 実行可能な必須作業が未実行・未解消のまま実装の応答が終了している（計画変更や外部操作・ユーザー回答待ちではない）
        next: ABORT
      - condition: 計画の前提・範囲・方法または検証能力に不備があり、プロジェクト内で実行可能な作業につながる計画変更が必要である（作業や証拠の不足だけ、または外部操作だけでしか進めない状態は除く）
        return: need_replan
      - condition: 現時点で実行できるプロジェクト内の必須作業がなく、必要な外部操作・外部回答または両立不能な条件が根拠とともに確認されている（判定候補にユーザー入力を求める選択肢があり、その回答で作業を進められる場合は除く。候補にその選択肢がない場合の外部回答待ちは停止対象）
        next: ABORT
      - condition: ユーザー入力が必要
        next: implement
        requires_user_input: true
        interactive_only: true
