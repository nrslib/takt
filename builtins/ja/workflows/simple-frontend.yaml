name: simple-frontend
description: 強いモデルの判断力を信頼し、simple-core にフロントエンド向けナレッジとポリシーを注入するシンプルな開発ワークフロー。
max_steps: 30
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: simple-core
    args:
      plan_policy:
        - design-planning
      testing_policy:
        - coding
        - testing
        - architecture
        - frontend
        - react
      development_policy:
        - coding
        - testing
        - design-fidelity
        - architecture
        - frontend
        - react
      review_policy:
        - review
        - coding
        - testing
        - design-fidelity
        - architecture
        - frontend
        - react
      development_knowledge:
        - frontend
        - react
        - security
        - architecture
      testing_knowledge:
        - frontend
        - react
        - architecture
        - unit-testing
        - e2e-testing
      review_knowledge:
        - frontend
        - react
        - security
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
