name: review-fix
description: 多角レビューで変更内容に応じたレビュワーを動的に選択し、標準 workflow と同じ裁定・検証付き修正ループと要件の最終確認で収束させる。
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: existing-family-lookup
      position: before_instruction
    - ref: invariant-recurrence
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction

max_steps: 30
initial_step: gather

steps:
  - name: gather
    uses: review-gather-with-clarification-to-reviewers
    rules:
      - condition: レビュー対象の情報収集完了
        next: reviewers
      - condition: レビュー対象を特定できない、情報不足
        next: ABORT
        appendix: |
          確認事項:
          - {質問1}
          - {質問2}

  - name: reviewers
    kind: workflow_call
    call: peer-review
    args:
      reviewer_suite: development-review
      review_policy_additions: []
      review_knowledge_additions: [architecture, unit-testing, e2e-testing]
      security_review_knowledge_additions: []
      security_review_pool: security-review-facets
      fix_companions:
        fixed: [ai-antipattern-review-companion, testing-review-companion]
        pool: []
        moderator: review-companion-moderator
      remediation_workflow: development-remediation-dynamic
      fix_pool: coding-facets
      plan_policy: [coding, testing, review, architecture]
      fix_policy: [coding, testing, ai-antipattern]
      fix_knowledge: [architecture, implementation-semantics]
      verification_knowledge: [architecture, unit-testing, e2e-testing]
      verification_policy: [coding, testing, review, architecture]
      final_gate_policy: [coding, testing, review, architecture]
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: need_replan
        next: ABORT
      - condition: ABORT
        next: ABORT
