name: caccia
description: CodeRabbit のレビュースレッドを確認し、妥当な指摘を修正して1反復分の判断レポートを出力する。
max_steps: 1
initial_step: address

steps:
  - name: address
    description: CodeRabbit の全スレッドを検証して妥当な指摘を修正し、各スレッドの判断と根拠を記録する
    tags:
      - implementation
    capabilities: edit
    edit: true
    persona: coder
    policy: caccia-review
    instruction: caccia
    output_contracts:
      report:
        - name: caccia-decisions.json
          format: caccia-decisions
    rules:
      - condition: レポートの outcome が complete で、妥当な指摘をすべて修正し、全スレッドの判断がそろった
        next: COMPLETE
      - condition: レポートの outcome が abort、または必須レポートが未完成
        next: ABORT
