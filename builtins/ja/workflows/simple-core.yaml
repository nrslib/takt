name: simple-core
description: simpleシリーズの中核となる内部開発ワークフロー。注入された instruction、ポリシー、ナレッジを使い、plan → write_tests → implement → review ⇄ fix → supervise を実行する。
subworkflow:
  callable: true
  visibility: internal
  params:
    plan_instruction:
      type: facet_ref
      facet_kind: instruction
      default: plan
    testing_instruction:
      type: facet_ref
      facet_kind: instruction
      default: write-tests-first
    implement_instruction:
      type: facet_ref
      facet_kind: instruction
      default: implement-after-tests
    review_instruction:
      type: facet_ref
      facet_kind: instruction
      default: review-coding
    supervise_instruction:
      type: facet_ref
      facet_kind: instruction
      default: supervise
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - design-planning
    testing_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
    review_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - review
        - coding
        - testing
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
    testing_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - unit-testing
        - e2e-testing
    review_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - unit-testing
        - e2e-testing
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
initial_step: plan
steps:
  - name: plan
    uses: development-core-plan
    with:
      plan_policy:
        $param: plan_policy
      plan_knowledge:
        $param: development_knowledge
      plan_instruction:
        $param: plan_instruction
      plan_report_format: plan
    rules:
      - condition: 要件が明確で実装可能
        next: write_tests
      - condition: ユーザーが質問をしている（実装タスクではない）
        next: COMPLETE
      - condition: 要件が不明確、情報不足
        next: ABORT
        appendix: |
          確認事項:
          - {質問1}
          - {質問2}

  - name: write_tests
    uses: development-core-write-tests
    with:
      testing_policy:
        $param: testing_policy
      testing_knowledge:
        $param: testing_knowledge
      testing_instruction:
        $param: testing_instruction
    rules:
      - condition: テスト作成が完了した
        next: implement
      - condition: テスト対象が未実装のためテスト作成をスキップする
        next: implement
      - condition: テスト作成を進行できない
        next: ABORT
      - condition: ユーザーへの確認事項があるためユーザー入力が必要
        next: write_tests
        requires_user_input: true
        interactive_only: true

  - name: implement
    uses: development-core-implement
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: implement_instruction
    rules:
      - condition: 実装が完了した
        next: review
      - condition: 計画の見直しが必要
        next: plan
      - condition: 実装を進行できない
        next: ABORT
      - condition: ユーザーへの確認事項があるためユーザー入力が必要
        next: implement
        requires_user_input: true
        interactive_only: true

  - name: review
    tags:
      - review
    edit: false
    persona: coding-reviewer
    policy:
      $param: review_policy
    knowledge:
      $param: review_knowledge
    provider_options:
      extends: review-readonly
    pass_previous_response: false
    instruction:
      $param: review_instruction
    output_contracts:
      report:
        - name: coding-review.md
          format: coding-review
    rules:
      - condition: approved
        next: supervise
      - condition: needs_fix
        next: remediation

  - name: remediation
    uses: review-remediation
    with:
      plan_policy:
        $param: review_policy
      fix_policy:
        $param: development_policy
      verification_policy:
        $param: review_policy
      fix_knowledge:
        $param: review_knowledge
    rules:
      - condition: COMPLETE
        next: review
      - condition: need_replan
        next: plan
      - condition: ABORT
        next: ABORT

  - name: supervise
    tags:
      - review
      - final-gate
      - supervise
    edit: false
    persona: supervisor
    policy:
      $param: review_policy
    knowledge:
      $param: review_knowledge
    provider_options:
      extends: review-readonly
    pass_previous_response: false
    instruction:
      $param: supervise_instruction
    output_contracts:
      report:
        - name: supervisor-validation.md
          format: supervisor-validation
        - name: summary.md
          format: supervisor-summary
          use_judge: false
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: approved
        next: COMPLETE
      - condition: need_replan
        next: plan
      - condition: needs_fix
        next: remediation
