name: merge-readiness-dual-final-gate
description: マージ可能品質を確認して証跡を保存した後、dual supervise が最終確認し、必要な次アクションを返す最終ゲート。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - needs_fix
    - need_replan
  params:
    merge_readiness_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - review
    merge_readiness_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
    supervise_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
    supervisor_persona:
      type: facet_ref
      facet_kind: persona
      default: dual-supervisor
capabilities: readonly
initial_step: merge-readiness-review
steps:
  - name: merge-readiness-review
    tags:
      - review
      - final-gate
      - merge-readiness
    edit: false
    persona: merge-readiness-reviewer
    policy:
      - contract-change
      - $param: merge_readiness_policy
    knowledge:
      $param: merge_readiness_knowledge
    pass_previous_response: false
    instruction: review-merge-readiness
    output_contracts:
      report:
        - name: merge-readiness-review.md
          format: merge-readiness-review
    rules:
      - condition: approved
        next: supervise
      - condition: needs_fix
        return: needs_fix

  - name: supervise
    tags:
      - review
      - final-gate
      - supervise
    edit: false
    persona:
      $param: supervisor_persona
    policy:
      - contract-change
      - review
    knowledge:
      $param: supervise_knowledge
    pass_previous_response: false
    instruction: supervise-merge-readiness
    output_contracts:
      report:
        - name: supervisor-validation.md
          format: supervisor-validation
        - name: summary.md
          format: supervisor-summary
          use_judge: false
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: approved
        next: COMPLETE
      - condition: need_replan
        return: need_replan
      - condition: needs_fix
        return: needs_fix
