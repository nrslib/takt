name: draft
description: takt-default の Phase 1。実装 → AI アンチパターン自己レビュー ⇄ 修正 ループ。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    impl_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - takt
        - architecture
        - task-decomposition
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - takt
        - architecture
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 30
initial_step: implement
loop_monitors:
  - cycle:
      - ai-antipattern-review-1st
      - ai-antipattern-fix
    threshold: 5
    judge:
      persona: supervisor
      instruction: loop-monitor-ai-antipattern-fix
      rules:
        - condition: 健全（進捗あり）
          next: ai-antipattern-review-1st
        - condition: 非生産的（改善なし）
          next: COMPLETE
steps:
  - name: implement
    uses: draft-implement
    with:
      impl_knowledge:
        $param: impl_knowledge
    rules:
      - condition: 実装完了
        next: ai-antipattern-review-1st
      - condition: 実装未着手（レポートのみ）
        next: ai-antipattern-review-1st
      - condition: 判断できない、情報不足
        return: need_replan
      - condition: ユーザー入力が必要
        next: implement
        requires_user_input: true
        interactive_only: true
  - name: ai-antipattern-review-1st
    uses: draft-ai-antipattern-review
    rules:
      - condition: AI特有の問題なし
        next: COMPLETE
      - condition: AI特有の問題あり
        next: ai-antipattern-fix
  - name: ai-antipattern-fix
    uses: draft-ai-antipattern-fix
    with:
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: AI問題の修正完了
        next: ai-antipattern-review-1st
      - condition: 修正不要（指摘対象ファイル/仕様の確認済み）
        next: ai-antipattern-no-fix
      - condition: 判断できない、情報不足
        next: ai-antipattern-no-fix
  - name: ai-antipattern-no-fix
    uses: draft-ai-antipattern-arbitration
    rules:
      - condition: ai-antipattern-review-1stの指摘が妥当（修正すべき）
        next: ai-antipattern-fix
      - condition: ai-antipattern-fixの判断が妥当（修正不要）
        next: COMPLETE
