name: dual-cqrs-mini
description: CQRS+ES フロントエンド＋バックエンド向けMini開発ワークフロー（plan → implement → 並列レビュー → 修正 → 完了）。CQRS+ESナレッジ注入付き。
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
        - cqrs-es
        - architecture
        - backend
        - frontend
      plan_knowledge:
        - frontend
        - backend
        - cqrs-es
        - security
        - architecture
      plan_report_format: plan-frontend
      development_policy:
        - coding
        - testing
        - cqrs-es
        - design-fidelity
        - screen-api
        - architecture
        - backend
        - frontend
      development_knowledge:
        - frontend
        - backend
        - cqrs-es
        - security
        - architecture
      supervisor_persona: dual-supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
