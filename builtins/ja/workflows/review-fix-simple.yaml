name: review-fix-simple
description: 情報収集後、1体のエージェントが動的ファセットでコード品質を確認し、必要な修正と検証を行う。
subworkflow:
  callable: true
  visibility: internal
initial_step: gather
facet_pools:
  coding-facets:
    uses: coding-facets
steps:
  - name: gather
    uses: review-gather-with-clarification-to-reviewers
    persona: quality-maintainer
    rules:
      - condition: レビュー対象の情報収集完了
        next: review-fix
      - condition: レビュー対象を特定できない、情報不足
        next: ABORT
  - name: review-fix
    persona: quality-maintainer
    capabilities: edit
    edit: true
    required_permission_mode: edit
    policy:
      - coding
      - testing
      - review
      - ai-antipattern
    knowledge:
      - architecture
      - implementation-semantics
    dynamic_facets:
      pool: coding-facets
    instruction: simple-review-fix
    structured_output:
      schema_ref: simple-review-result
    output_contracts:
      report:
        - name: review-summary.md
          format: simple-review-fix
    rules:
      - condition: when(structured.review-fix.result == "APPROVE")
        next: COMPLETE
      - condition: when(structured.review-fix.result == "REJECT")
        next: ABORT
