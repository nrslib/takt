name: development-implement
description: 共通開発コアで固定ファセットを使う実装実行。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    implementation_pool:
      type: facet_pool_ref
      default: coding-facets
    implementation_companions:
      type: companion_ref[]
      default: []
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - ai-antipattern
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - implementation-semantics
    implementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-implement-with-reports
    scope_report_format:
      type: facet_ref
      facet_kind: report_format
      default: coder-scope
facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets
initial_step: implement
steps:
  - name: implement
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: implementation_instruction
      scope_report_format:
        $param: scope_report_format
    companion:
      $param: implementation_companions
    rules:
      - condition: 引き継ぎ情報に不足がなく、実装が完了した
        next: COMPLETE
      - condition: 引き継ぎ情報に不足がなく、実装未着手（レポートのみ）
        next: COMPLETE
      - condition: 実装の欠落・検証失敗など具体的な実装・検証上の問題で完了できない（他の情報が不明でも、確認できた問題を優先する）
        return: need_replan
      - condition: 引き継ぎ情報の不足だけが完了判断を妨げており、具体的な実装・検証上の問題は確認されていない
        next: ABORT
      - condition: ユーザー入力が必要
        next: implement
        requires_user_input: true
        interactive_only: true
