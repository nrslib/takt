name: dual-mini
description: フロントエンド＋バックエンド向けMini開発ワークフロー（plan → implement → 並列レビュー → 修正 → 完了）。フロントエンド＋バックエンドのナレッジ注入付き。
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
      plan_knowledge:
        - frontend
        - backend
        - security
        - architecture
      plan_report_format: plan-frontend
      development_policy:
        - coding
        - testing
        - design-fidelity
        - screen-api
      development_knowledge:
        - frontend
        - backend
        - security
        - architecture
      supervisor_persona: dual-supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
