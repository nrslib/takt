name: backend-mini
description: バックエンド向けMini開発ワークフロー（plan → implement → 並列レビュー → 修正 → 完了）
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
      plan_knowledge:
        - backend
        - security
        - architecture
      plan_report_format: plan
      development_policy:
        - coding
        - testing
      development_knowledge:
        - backend
        - security
        - architecture
      supervisor_persona: supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
