name: merge-readiness-final-gate
description: マージ可能品質を確認して証跡を保存した後、supervise が最終確認し、必要な次アクションを返す最終ゲート。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - needs_fix
    - need_replan
  params:
    supervise_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
initial_step: merge-readiness-review
steps:
  - name: merge-readiness-review
    uses: merge-readiness-final-review
    rules:
      - condition: approved
        next: supervise
      - condition: needs_fix
        return: needs_fix

  - name: supervise
    uses: merge-readiness-final-supervise
    with:
      supervise_knowledge:
        $param: supervise_knowledge
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: approved
        next: COMPLETE
      - condition: need_replan
        return: need_replan
      - condition: needs_fix
        return: needs_fix
