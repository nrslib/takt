name: peer-review-finding-contract
description: 標準5専門レビューを Finding Contract ledger へ取り込み、ledger 駆動の修正と terminal final gate を実行する。
subworkflow:
  callable: true
  visibility: internal
  requires_finding_contract: true
  returns: [need_replan]
  params:
    reviewer_suite:
      type: workflow_ref
      default: peer-review-suite-finding-contract-base
    review_policy_additions:
      type: facet_ref[]
      facet_kind: policy
      default: []
    review_knowledge_additions:
      type: facet_ref[]
      facet_kind: knowledge
      default: [architecture, takt]
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default: [takt, architecture]
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing, review]
    fix_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing]
    verification_policy:
      type: facet_ref[]
      facet_kind: policy
      default: [coding, testing, review]
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
initial_step: initial-reviewers
loop_monitors:
  - cycle: [fix-plan, fix, reviewers]
    ignore_steps: [fix-verifier, fix-retry]
    threshold: 5
    judge: &fc_convergence_judge
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: 修正が進捗し、トリガー応答の指摘内容が収束しており、次のレビューが実行可能である
          next: reviewers
        - condition: 実装が未完了またはトリガー応答の指摘内容が未収束であり、修正計画の見直しにより解消できる
          next: fix-plan
        - condition: 要件を満たす実行可能な手段がない
          next: ABORT
  - cycle: [fix-plan, fix, reviewers, final-gate]
    ignore_steps: [fix-verifier, fix-retry]
    threshold: 5
    judge: *fc_convergence_judge
  - cycle: [fix-plan, fix]
    ignore_steps: [fix-verifier, fix-retry]
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan-finding-contract
      rules:
        - condition: 要件と受入条件を変えずに修正計画を再定義できる
          next: fix-plan
        - condition: 試行済みの修正計画を踏まえても要件を満たす実現可能な方針がない
          next: ABORT
  - cycle: [fix-retry, fix-verifier]
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-verifier-finding-contract
      rules:
        - condition: 残る完了義務が局所的で、現行の修正計画のまま再修正できる
          next: fix-retry
        - condition: 完了性検証により現行の修正計画の前提破綻が確認され、修正計画を更新すれば要件を満たせる
          next: fix-plan
        - condition: 試行済みの再修正と計画更新を踏まえても要件を満たす実行可能な方針がない
          next: ABORT
steps:
  - name: initial-reviewers
    uses: peer-review-suite-call
    vars:
      review_mode: initial
    with:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: COMPLETE
        next: final-gate
      - condition: needs_terminal_adjudication
        next: final-gate
      - condition: needs_review
        next: reviewers
      - condition: needs_fix
        next: fix-plan
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
  - name: reviewers
    uses: peer-review-suite-call
    vars:
      review_mode: follow_up
    with:
      reviewer_suite:
        $param: reviewer_suite
      review_policy_additions:
        $param: review_policy_additions
      review_knowledge_additions:
        $param: review_knowledge_additions
    rules:
      - condition: COMPLETE
        next: final-gate
      - condition: needs_terminal_adjudication
        next: final-gate
      - condition: needs_review
        next: reviewers
      - condition: needs_fix
        next: fix-plan
      - condition: need_replan
        return: need_replan
      - condition: ABORT
        next: ABORT
  - name: final-gate
    uses: finding-contract-final-gate
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: needs_review
        next: reviewers
      - condition: needs_fix
        next: fix-plan
      - condition: need_replan
        return: need_replan
      - condition: needs_conflict_adjudication
        next: finding-conflict-adjudication
      - condition: ABORT
        next: ABORT
  - name: fix-plan
    uses: peer-review-fix-plan
    with:
      plan_policy:
        $param: plan_policy
      fix_knowledge:
        $param: fix_knowledge
      plan_instruction: fix-plan-finding-contract
    rules:
      - condition: 修正計画を確定した
        next: fix
      - condition: タスク全体の再計画が必要
        return: need_replan
  - name: fix
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: fix-finding-contract
    rules:
      - condition: 修正完了
        next: fix-verifier
      - condition: 修正計画の見直しが必要
        next: fix-plan
      - condition: タスク全体の再計画が必要
        return: need_replan
  - name: fix-verifier
    uses: peer-review-fix-verifier-finding-contract
    with:
      verification_policy:
        $param: verification_policy
      fix_knowledge:
        $param: fix_knowledge
    rules:
      - condition: verified
        next: reviewers
      - condition: incomplete
        next: fix-retry
      - condition: plan_invalid
        next: fix-plan
  - name: fix-retry
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: apply-fix-verification
    rules:
      - condition: 修正完了
        next: fix-verifier
      - condition: 修正計画の見直しが必要
        next: fix-plan
      - condition: タスク全体の再計画が必要
        return: need_replan
