name: review-backend-cqrs
description: CQRS+ES特化レビュー（構造・モジュール化・ドメインモデル・セキュリティ・コーディング）
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction

max_steps: 10
facet_pools:
  security-review-facets:
    uses: security-review-facets
initial_step: gather

steps:
  - name: gather
    uses: review-gather-to-reviewers
    rules:
      - condition: レビュー対象の情報収集完了
        next: reviewers
      - condition: レビュー対象を特定できない、情報不足
        next: ABORT

  - name: reviewers
    description: 構造・CQRS・コードを並列レビューし、必要に応じて脆弱性も確認して修正要否を判定する
    tags:
      - review
    parallel:
      fixed:
        - name: arch-review
          description: バックエンドの構造・責務・依存関係を確認し、設計上の問題と修正案を報告する
          capabilities: readonly
          tags:
            - review
          edit: false
          persona: architecture-reviewer
          policy:
            - contract-change
            - review
            - architecture
            - backend
          knowledge:
            - architecture
            - backend
          instruction: review-arch
          output_contracts:
            report:
              - name: architect-review.md
                format: architecture-review
          rules:
            - condition: approved
            - condition: needs_fix

        - name: cqrs-es-review
          description: CQRSとイベントソーシングの適用を確認し、集約・イベント・投影などの問題と修正案を報告する
          capabilities: readonly
          tags:
            - review
          edit: false
          persona: cqrs-es-reviewer
          policy:
            - cqrs-es
            - contract-change
            - review
            - backend
          knowledge:
            - cqrs-es
            - backend
          instruction: review-cqrs-es
          output_contracts:
            report:
              - name: cqrs-es-review.md
                format: cqrs-es-review
          rules:
            - condition: approved
            - condition: needs_fix

        - name: coding-review
          description: 変更差分のバグ・既存動作の不具合・セキュリティリスク・テスト不足を確認し、根拠と修正案を報告する
          capabilities: readonly
          tags:
            - review
          edit: false
          persona: coding-reviewer
          policy:
            - contract-change
            - review
            - coding
          instruction: review-coding
          output_contracts:
            report:
              - name: coding-review.md
                format: coding-review
          rules:
            - condition: approved
            - condition: needs_fix

      pool:
        - name: security-review
          description: 秘密情報、外部入力、権限、外部との境界にかかわる変更を、セキュリティの観点でレビューする
          selection_hint: 既定では選ばない。(a) 変更が secret または credential の取扱い、外部入力の処理、process 実行、filesystem 操作、network または terminal の境界、sandbox、権限に影響し得る場合、または (b) 修正の規模が大きく、セキュリティへの影響がないと判断しきれない場合に選ぶ。ドキュメントのみ・コメントのみ・テストのみの変更や小さな局所修正でも、(a) または (b) に該当すれば選ぶ。どちらにも該当しなければ選ばない。
          capabilities: readonly
          tags:
            - review
          edit: false
          persona: security-reviewer
          policy:
            - contract-change
            - security-review
          knowledge:
            - security
            - security-data
            - security-dependencies
          dynamic_facets:
            pool: security-review-facets
            selector:
              instruction: select-applicable-candidates
          instruction: review-security
          output_contracts:
            report:
              - name: security-review.md
                format: security-review
          rules:
            - condition: approved
            - condition: needs_fix
      selection:
        selector:
          instruction: select-applicable-candidates

    rules:
      - condition: any("error")
        next: reviewers
      - condition: all("approved")
        next: review-synthesis
      - condition: any("needs_fix")
        next: supervise

  - name: review-synthesis
    uses: review-synthesis-to-complete
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: APPROVE
        next: COMPLETE
      - condition: REJECT
        next: COMPLETE

  - name: supervise
    uses: review-supervise-to-complete
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: APPROVE
        next: COMPLETE
      - condition: REJECT
        next: COMPLETE
