name: takt-experimental-team
description: takt-experimental の計画・テスト・レビュー契約を維持し、現行 schema 制約に合わせて実装系の dynamic facets と companion を使わない静的な Team Leader coder execution へ切り替える実験的 TAKT 開発 workflow です。
max_steps: 51
initial_step: develop

steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      implementation_workflow: development-implement-team
      remediation_workflow: development-remediation-team
      plan_instruction: scenario-based-plan
      plan_report_format: scenario-based-plan
      replan_instruction: scenario-based-replan-implementation
      testing_instruction: scenario-based-write-tests-first
      testing_report_format: scenario-based-test-report
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
      reviewer_suite: takt-experimental-review
      review_policy_additions: [takt-testing]
      review_policy: [coding, testing, takt-testing, review]
      review_knowledge: [takt, architecture, unit-testing, e2e-testing]
      security_review_pool: takt-security-review-facets
      security_review_knowledge_additions: [takt]
      plan_knowledge: [takt, architecture, task-decomposition]
      testing_policy: [coding, testing, takt-testing]
      testing_knowledge: [takt, architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing, takt-testing, ai-antipattern]
      development_knowledge: [takt, architecture, implementation-semantics]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
