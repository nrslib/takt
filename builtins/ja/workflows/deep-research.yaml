name: deep-research
description: 深掘り調査ワークフロー - 発見駆動で新たな問いを追跡し、多角的に調査する
max_steps: 15
initial_step: plan
steps:
  - name: plan
    capabilities: readonly
    tags:
      - plan
    persona: research-planner
    policy: research
    knowledge: research
    instruction: research-plan
    rules:
      - condition: 計画が完了した
        next: dig
      - condition: 情報が不足しており計画を立てられない
        next: ABORT
  - name: dig
    capabilities: edit
    tags:
      - plan
    persona: research-digger
    policy: research
    knowledge: research
    instruction: research-dig
    edit: true
    team_leader:
      max_parts: 3
      part_persona: research-digger
      part_edit: true
      part_allowed_tools:
        - Read
        - Write
        - Bash
        - Glob
        - Grep
        - WebSearch
        - WebFetch
    rules:
      - condition: 調査が完了した
        next: analyze
      - condition: 調査を実行できない
        next: ABORT
  - name: analyze
    capabilities: edit
    tags:
      - plan
    persona: research-analyzer
    policy: research
    knowledge: research
    instruction: research-analyze
    edit: true
    rules:
      - condition: 新たな問いがあり追加調査が必要
        next: dig
      - condition: 十分に掘り下げた
        next: supervise
  - name: supervise
    capabilities: readonly
    tags:
      - review
      - supervise
    persona: research-supervisor
    policy: research
    knowledge: research
    instruction: research-supervise
    output_contracts:
      report:
        - name: research-report.md
          format: research-report
    rules:
      - condition: 調査結果が元の依頼に対して十分である
        next: COMPLETE
      - condition: 調査結果が不十分であり、計画からやり直す必要がある
        next: plan
