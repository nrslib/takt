name: deep-research
description: 深掘り調査ワークフロー - 発見駆動で新たな問いを追跡し、多角的に調査する
max_steps: 15
initial_step: plan
steps:
  - name: plan
    description: 調査依頼を分解し、調査項目・候補となる情報源・優先順位を含む計画を作成する
    capabilities: readonly
    tags:
      - plan
    persona: research-planner
    policy: research
    knowledge: research
    instruction: research-plan
    rules:
      - condition: 計画が完了した
        next: dig
      - condition: 情報が不足しており計画を立てられない
        next: ABORT
  - name: dig
    description: 調査項目を独立した担当へ分担して並列に調査し、出典と取得日を含むデータを保存する
    capabilities: edit
    tags:
      - plan
    persona: research-digger
    policy: research
    knowledge: research
    instruction: research-dig
    edit: true
    team_leader:
      max_parts: 3
      part_persona: research-digger
      part_edit: true
      part_allowed_tools:
        - Read
        - Write
        - Bash
        - Glob
        - Grep
        - WebSearch
        - WebFetch
    rules:
      - condition: 調査が完了した
        next: analyze
      - condition: 調査を実行できない
        next: ABORT
  - name: analyze
    description: 調査結果の発見と不足を分析・保存し、追加調査の指示または全体サマリーを作成する
    capabilities: edit
    tags:
      - plan
    persona: research-analyzer
    policy: research
    knowledge: research
    instruction: research-analyze
    edit: true
    rules:
      - condition: 新たな問いがあり追加調査が必要
        next: dig
      - condition: 十分に掘り下げた
        next: supervise
  - name: supervise
    description: 調査が元の依頼に十分答えているかを評価し、完了か再計画かを判定して調査レポートを作成する
    capabilities: readonly
    tags:
      - review
      - supervise
    persona: research-supervisor
    policy: research
    knowledge: research
    instruction: research-supervise
    output_contracts:
      report:
        - name: research-report.md
          format: research-report
    rules:
      - condition: 調査結果が元の依頼に対して十分である
        next: COMPLETE
      - condition: 調査結果が不十分であり、計画からやり直す必要がある
        next: plan
