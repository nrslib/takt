name: review-remediation
description: レビュー指摘を裁定・計画・修正して再レビューへ戻す共通工程。
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction

subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    fix_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
    fix_replan_instruction:
      type: facet_ref
      facet_kind: instruction
      default: fix-replan
initial_step: review-adjudication
loop_monitors:
  - cycle:
      - fix
      - fix-replan
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: fix
        - condition: 修正未完了または報告未収束だが、次のレビュー・修正が実行可能である
          next: fix
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: fix-replan
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
steps:
  - name: review-adjudication
    uses: peer-review-adjudication
    with:
      review_policy_additions:
        $param: plan_policy
      review_knowledge_additions:
        $param: fix_knowledge
    rules:
      - condition: 修正対象あり
        next: fix-plan
      - condition: 修正対象なし
        next: COMPLETE
      - condition: タスク全体の再計画が必要
        return: need_replan

  - name: fix-plan
    uses: peer-review-fix-plan
    with:
      plan_policy:
        $param: plan_policy
      fix_knowledge:
        $param: fix_knowledge
      plan_instruction: fix-plan-from-review-resolution
      plan_report_format: fix-plan
    rules:
      - condition: 修正計画を確定した、または原因未確定でも現行の要求・修正範囲内で具体的な調査と、その結果に応じた安全な修正・検証を最初の修正単位として実行できる（未実行・未確認だけではタスク全体の再計画にしない）
        next: fix
      - condition: 要求・修正範囲などタスク全体の前提を見直す必要があり、その変更で具体的なプロジェクト内の作業が実行可能になる（局所的な原因調査の未実行だけでは該当しない）
        return: need_replan
      - condition: 必要な作業をプロジェクト内で進める手段がなく、その根拠と必要な外部操作または両立不能な条件が確認されている
        next: ABORT
  - name: fix-replan
    uses: peer-review-fix-plan
    with:
      plan_policy:
        $param: plan_policy
      fix_knowledge:
        $param: fix_knowledge
      plan_instruction:
        $param: fix_replan_instruction
      plan_report_format: fix-plan
    rules:
      - condition: 修正計画を確定した、または原因未確定でも現行の要求・修正範囲内で具体的な調査と、その結果に応じた安全な修正・検証を最初の修正単位として実行できる（未実行・未確認だけではタスク全体の再計画にしない）
        next: fix
      - condition: 要求・修正範囲などタスク全体の前提を見直す必要があり、その変更で具体的なプロジェクト内の作業が実行可能になる（局所的な原因調査の未実行だけでは該当しない）
        return: need_replan
      - condition: 必要な作業をプロジェクト内で進める手段がなく、その根拠と必要な外部操作または両立不能な条件が確認されている
        next: ABORT
  - name: fix
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: apply-fix-plan
    rules:
      - condition: 修正完了
        next: COMPLETE
      - condition: 修正計画の見直しが必要
        next: fix-replan
      - condition: タスク全体の再計画が必要
        return: need_replan
