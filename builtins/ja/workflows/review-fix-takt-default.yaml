name: review-fix-takt-default
description: レビュー対象を収集してから、TAKT固有ファセットを共通開発フローへ注入するワークフロー。
max_steps: 52
initial_step: gather
steps:
  - name: gather
    uses: gather
    rules:
      - condition: レビュー対象の情報収集完了
        next: develop
      - condition: レビュー対象を特定できない、情報不足
        next: ABORT
        appendix: |
          確認事項:
          - {質問1}
          - {質問2}
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy: [design-planning]
      plan_knowledge: [takt, architecture]
      testing_policy: [coding, testing, takt-testing]
      testing_knowledge: [takt, architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing, takt-testing, ai-antipattern]
      development_knowledge: [takt, architecture, task-decomposition, implementation-semantics]
      implementation_instruction: implement
      review_policy: [coding, testing, takt-testing, review]
      review_knowledge: [takt, architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
