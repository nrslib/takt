name: simple-dual-cqrs
description: 強いモデルの判断力を信頼し、simple-core にフロントエンド、バックエンド、CQRS+ES のナレッジとポリシーを注入するシンプルな開発ワークフロー。
max_steps: 30
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: simple-core
    args:
      plan_policy:
        - design-planning
      testing_policy:
        - coding
        - testing
      development_policy:
        - coding
        - testing
        - design-fidelity
        - screen-api
      review_policy:
        - review
        - coding
        - testing
        - design-fidelity
        - screen-api
      development_knowledge:
        - frontend
        - react
        - backend
        - cqrs-es
        - security
        - architecture
      testing_knowledge:
        - frontend
        - react
        - backend
        - cqrs-es
        - architecture
        - unit-testing
        - e2e-testing
      review_knowledge:
        - frontend
        - react
        - backend
        - cqrs-es
        - security
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
