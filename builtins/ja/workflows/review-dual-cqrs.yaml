name: review-dual-cqrs
description: フロントエンド＋CQRS+ES特化レビュー（構造・モジュール化・ドメインモデル・コンポーネント設計・セキュリティ・コーディング）
max_steps: 10
initial_step: gather

steps:
  - name: gather
    uses: review-gather-to-reviewers
    rules:
      - condition: レビュー対象の情報収集完了
        next: reviewers
      - condition: レビュー対象を特定できない、情報不足
        next: ABORT

  - name: reviewers
    tags:
      - review
    parallel:
      - name: arch-review
        capabilities: readonly
        tags:
          - review
        edit: false
        persona: architecture-reviewer
        policy:
          - contract-change
          - review
        knowledge:
          - architecture
          - frontend
          - backend
        instruction: review-arch
        output_contracts:
          report:
            - name: architect-review.md
              format: architecture-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: cqrs-es-review
        capabilities: readonly
        tags:
          - review
        edit: false
        persona: cqrs-es-reviewer
        policy:
          - contract-change
          - review
        knowledge:
          - cqrs-es
          - backend
        instruction: review-cqrs-es
        output_contracts:
          report:
            - name: cqrs-es-review.md
              format: cqrs-es-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: frontend-review
        capabilities: readonly
        tags:
          - review
        edit: false
        persona: frontend-reviewer
        policy:
          - contract-change
          - review
          - design-fidelity
        knowledge: frontend
        instruction: review-frontend
        output_contracts:
          report:
            - name: frontend-review.md
              format: frontend-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: security-review
        capabilities: readonly
        tags:
          - review
        edit: false
        persona: security-reviewer
        policy:
          - contract-change
          - review
        knowledge: security
        instruction: review-security
        output_contracts:
          report:
            - name: security-review.md
              format: security-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: coding-review
        capabilities: readonly
        tags:
          - review
        edit: false
        persona: coding-reviewer
        policy:
          - contract-change
          - review
          - coding
        instruction: review-coding
        output_contracts:
          report:
            - name: coding-review.md
              format: coding-review
        rules:
          - condition: approved
          - condition: needs_fix

    rules:
      - condition: all("approved")
        next: merge-readiness-review
      - condition: any("needs_fix")
        next: supervise

  - name: merge-readiness-review
    uses: merge-readiness-to-review-synthesis
    rules:
      - condition: approved
        next: review-synthesis
      - condition: needs_fix
        next: review-synthesis

  - name: review-synthesis
    uses: review-synthesis-to-complete
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: approved
        next: COMPLETE

  - name: supervise
    uses: review-supervise-to-complete
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: レビュー統合完了
        next: COMPLETE
