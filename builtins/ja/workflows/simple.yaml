name: simple
description: pure と同じ最小構造に、変更内容に応じて TAKT がドメインファセットを自動選択して注入する軽量開発ワークフロー。AI アンチパターンとアーキテクチャの指針は常に含まれる。
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction

max_steps: 30
facet_pools:
  coding-facets:
    uses: coding-facets
capabilities:
  - readonly
initial_step: plan
steps:
  - name: plan
    capabilities:
      - readonly
    uses: development-core-plan
    with:
      plan_policy:
        - design-planning
      plan_knowledge:
        - architecture
      plan_instruction: simple-plan
      plan_report_format: plan
    rules:
      - condition: 要件が明確で実装可能
        next: write_tests
      - condition: ユーザーが質問をしている（実装タスクではない）
        next: COMPLETE
      - condition: 要件が不明確、情報不足
        next: ABORT
        appendix: |
          確認事項:
          - {質問1}
          - {質問2}

  - name: write_tests
    capabilities:
      - edit
    uses: development-core-write-tests
    with:
      testing_policy:
        - coding
        - testing
      testing_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
      testing_instruction: simple-write-tests-first
      testing_report_format: test-report
    rules:
      - condition: 計画上の契約を実装前に検証する既存・新規テストを確認して実行し、追加・変更の要否、結果、未確認範囲を記録した
        next: implement
      - condition: 実装を先に行うことでしか必要なテストを作成できない具体的理由と、実装後に作成・実行するテストを記録した。未実装の関数・APIやテスト失敗だけでは該当しない
        next: implement
      - condition: 計画の前提が実コードまたは要件と具体的に矛盾し、テストの観測対象や期待結果を定められない。計画の見直しで解消できる根拠を記録した
        next: plan
      - condition: 不可欠な外部操作・回答待ちだけが残る、または要件が両立しないと確認され、計画の見直しでも進められない
        next: ABORT
      - condition: ユーザーへの確認事項があるためユーザー入力が必要
        next: write_tests
        requires_user_input: true
        interactive_only: true

  - name: implement
    capabilities:
      - edit
    uses: development-core-implement
    with:
      development_policy:
        - coding
        - testing
        - ai-antipattern
      development_knowledge:
        - architecture
      implementation_instruction: simple-implement-after-tests
      scope_report_format: coder-scope
    dynamic_facets:
      pool: coding-facets
    rules:
      - condition: 実装が完了した
        next: review
      - condition: 計画の見直しが必要
        next: plan
      - condition: 実装を進行できない
        next: ABORT
      - condition: ユーザーへの確認事項があるためユーザー入力が必要
        next: implement
        requires_user_input: true
        interactive_only: true

  - name: review
    uses: simple-coding-review
    with:
      review_policy:
        - review
        - coding
        - testing
        - ai-antipattern
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
      review_instruction:
        simple-review-coding
    dynamic_facets:
      pool: coding-facets
    rules:
      - condition: approved
        next: supervise
      - condition: needs_fix
        next: remediation

  - name: follow-up-review
    input_reports:
      from_step: remediation
      reports:
        - fix-plan.md
        - fix-report.md
        - fix-verification.md
    uses: simple-coding-review
    with:
      review_policy:
        - review
        - coding
        - testing
        - ai-antipattern
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
      review_instruction:
        simple-review-coding
    dynamic_facets:
      pool: coding-facets
    rules:
      - condition: approved
        next: supervise
      - condition: needs_fix
        next: remediation

  - name: remediation
    uses: review-remediation
    with:
      plan_policy:
        - review
        - coding
        - testing
        - ai-antipattern
      fix_policy:
        - coding
        - testing
        - ai-antipattern
      verification_policy:
        - review
        - coding
        - testing
        - ai-antipattern
      fix_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: follow-up-review
      - condition: no_fix
        next: supervise
      - condition: need_replan
        next: plan
      - condition: ABORT
        next: ABORT

  - name: supervise
    description: 現在のコードを要件と前段の指摘に照合し、完了・修正・外部確認待ちを判定する
    input_reports:
      from_step: remediation
      reports:
        - review-resolution.md
      optional_if_unrun: true
    tags:
      - review
      - final-gate
      - supervise
    edit: false
    persona: supervisor
    policy:
      - process-deviation
      - contract-change
      - review
      - coding
      - testing
      - ai-antipattern
    knowledge:
      - architecture
      - unit-testing
      - e2e-testing
    pass_previous_response: false
    instruction: simple-supervise
    output_contracts:
      report:
        - name: supervisor-validation.md
          format: supervisor-validation
        - name: summary.md
          format: supervisor-summary
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: APPROVE
        next: COMPLETE
      - condition: REJECT
        next: remediation
