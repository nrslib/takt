name: backend-cqrs-mini
description: CQRS+ES向けMini開発ワークフロー（plan → implement → 並列レビュー → 修正 → 完了）
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
      plan_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
      plan_report_format: plan
      development_policy:
        - coding
        - testing
      development_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
      supervisor_persona: supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
