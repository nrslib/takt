name: frontend-mini
description: フロントエンド向けMini開発ワークフロー（plan → implement → 並列レビュー → 修正 → 完了）
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
        - architecture
        - frontend
      plan_knowledge:
        - frontend
        - security
        - architecture
      plan_report_format: plan-frontend
      development_policy:
        - coding
        - testing
        - design-fidelity
        - architecture
        - frontend
      development_knowledge:
        - frontend
        - security
        - architecture
      supervisor_persona: supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
