name: default
description: 共通開発フローを標準ファセットで実行するテスト先行開発ワークフロー。
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy: [design-planning, architecture]
      plan_knowledge: [architecture]
      testing_policy: [coding, testing, architecture]
      testing_knowledge: [architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing, architecture]
      development_knowledge: [architecture]
      implementation_instruction: implement-after-tests
      review_policy: [coding, testing, review, architecture]
      review_knowledge: [architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
