name: final-gate
description: 現在のコードと前段の報告から、supervisor が要件の充足状態と必要な次の対応を判断する。
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction

subworkflow:
  callable: true
  visibility: internal
  returns:
    - needs_fix
    - need_replan
  params:
    supervise_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
    supervise_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - contract-change
        - architecture
    supervisor_persona:
      type: facet_ref
      facet_kind: persona
      default: supervisor
capabilities: readonly
initial_step: supervise
steps:
  - name: supervise
    tags:
      - review
      - final-gate
      - supervise
    edit: false
    persona:
      $param: supervisor_persona
    policy:
      - review
      - $param: supervise_policy
    knowledge:
      $param: supervise_knowledge
    pass_previous_response: false
    instruction:
      - supervise
      - review-remediation-problem-tracking
    output_contracts:
      report:
        - name: supervisor-validation.md
          format: supervisor-validation
        - name: summary.md
          format: supervisor-summary
    rules:
      - condition: BLOCKED
        return: need_replan
      - condition: APPROVE
        next: COMPLETE
      - condition: REJECT
        return: needs_fix
