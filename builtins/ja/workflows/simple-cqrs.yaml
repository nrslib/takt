name: simple-cqrs
description: 強いモデルの判断力を信頼し、simple-core にバックエンドと CQRS+ES のナレッジとポリシーを注入するシンプルな開発ワークフロー。
max_steps: 30
initial_step: develop
steps:
  - name: develop
    description: CQRS+ESに沿ってバックエンドを計画・テスト・実装・修正し、レビューと要件確認を実施する
    kind: workflow_call
    call: simple-core
    args:
      plan_policy:
        - design-planning
        - cqrs-es
      testing_policy:
        - coding
        - testing
        - cqrs-es
        - architecture
        - backend
      development_policy:
        - coding
        - testing
        - cqrs-es
        - architecture
        - backend
      review_policy:
        - review
        - coding
        - testing
        - cqrs-es
        - architecture
        - backend
      development_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
      testing_knowledge:
        - backend
        - cqrs-es
        - architecture
        - unit-testing
        - e2e-testing
      review_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
