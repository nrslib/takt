name: default-mini
description: 標準ファセットを共通Mini開発フローへ注入する、テスト作成ステップなしの軽量ワークフロー。
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy: [design-planning]
      plan_knowledge: [architecture]
      plan_report_format: plan
      development_policy: [coding, testing]
      development_knowledge: [architecture]
      supervisor_persona: supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
