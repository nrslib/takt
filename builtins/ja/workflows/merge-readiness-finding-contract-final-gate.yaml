name: merge-readiness-finding-contract-final-gate
description: merge-readiness の証跡を記録し、supervise が共有台帳を検証する Finding Contract 最終ゲート。
subworkflow:
  callable: true
  visibility: internal
  requires_finding_contract: true
  returns:
    - needs_review
    - need_replan
    - needs_fix
    - needs_conflict_adjudication
  params:
    supervise_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - takt
capabilities: readonly
initial_step: merge-readiness-review
steps:
  - name: merge-readiness-review
    tags: [review, final-gate, merge-readiness]
    edit: false
    session: compact
    persona: merge-readiness-reviewer
    policy:
      - contract-change
      - review
    instruction: review-merge-readiness
    rules:
      - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
        return: needs_conflict_adjudication
      - condition: when(findings.conflicts.count > 0 && findings.rounds.budgetExhausted == false)
        return: needs_review
      - condition: when(findings.conflicts.count > 0)
        next: ABORT
      - condition: when(findings.provisional.fixpoint == true)
        return: need_replan
      - condition: when(findings.rounds.budgetExhausted == true && findings.provisional.count > 0)
        return: need_replan
      - condition: when(findings.provisional.count > 0)
        return: need_replan
      # 言い直し予算を使い切った claim-bearing な reviewer anomaly は、再レビューでも
      # terminal adjudication でも解消できない。ここで COMPLETE へ送り、エンジンの
      # review-integrity ゲート(review_integrity_unresolved)に可視的な失敗として
      # 落とす — needs_review へ戻すと再レビューと最終ゲートを無限に往復する。
      # open.count の needs_fix より前に置く: この anomaly が残る限りエンジンの
      # review-integrity 不変条件により完了できないため、修正ループは無駄弾になる。
      - condition: when(findings.reviewerAnomalies.claimBearingTerminalCount > 0)
        next: COMPLETE
      - condition: when(findings.reviewerAnomalies.requiresGuaranteedPresentationCount > 0)
        return: needs_review
      - condition: when(findings.reviewerAnomalies.restatementReadyCount > 0)
        return: needs_review
      - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0 && findings.reviewerAnomalies.budgetExhausted == true)
        return: need_replan
      - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0)
        return: needs_review
      - condition: needs_fix
        return: needs_fix
      - condition: when(findings.open.count > 0)
        return: needs_fix
      - condition: approved && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
        next: supervise
    output_contracts:
      report:
        - name: merge-readiness-review.md
          format: merge-readiness-review-finding-contract

  - name: supervise
    uses: finding-contract-supervise
    with:
      supervise_knowledge:
        $param: supervise_knowledge
    rules:
      - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
        return: needs_conflict_adjudication
      - condition: when(findings.conflicts.count > 0 && findings.rounds.budgetExhausted == false)
        return: needs_review
      - condition: when(findings.conflicts.count > 0)
        next: ABORT
      - condition: when(findings.provisional.fixpoint == true)
        return: need_replan
      - condition: when(findings.rounds.budgetExhausted == true && findings.provisional.count > 0)
        return: need_replan
      - condition: when(findings.provisional.count > 0)
        return: need_replan
      # 言い直し予算を使い切った claim-bearing な reviewer anomaly は、再レビューでも
      # terminal adjudication でも解消できない。ここで COMPLETE へ送り、エンジンの
      # review-integrity ゲート(review_integrity_unresolved)に可視的な失敗として
      # 落とす — needs_review へ戻すと再レビューと最終ゲートを無限に往復する。
      # open.count の needs_fix より前に置く: この anomaly が残る限りエンジンの
      # review-integrity 不変条件により完了できないため、修正ループは無駄弾になる。
      - condition: when(findings.reviewerAnomalies.claimBearingTerminalCount > 0)
        next: COMPLETE
      - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0 && findings.reviewerAnomalies.budgetExhausted == true)
        return: need_replan
      - condition: when(findings.open.count == 0 && findings.reviewerAnomalies.count > 0)
        return: needs_review
      - condition: needs_fix
        return: needs_fix
      - condition: need_replan
        return: need_replan
      - condition: when(findings.open.count > 0)
        return: needs_fix
      - condition: approved && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
        next: COMPLETE
