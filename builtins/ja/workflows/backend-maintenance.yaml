name: backend-maintenance
description: 既存バックエンド保守向けファセットを共通開発フローへ注入するワークフロー。
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      plan_policy: [design-planning, existing-system-respect]
      plan_knowledge: [backend, architecture, existing-system]
      plan_instruction: plan-maintenance
      testing_policy: [coding, testing, existing-system-respect]
      testing_knowledge: [backend, architecture, unit-testing, e2e-testing, existing-system]
      testing_instruction: write-tests-maintenance
      development_policy: [coding, testing, existing-system-respect]
      development_knowledge: [backend, security, architecture, existing-system]
      implementation_instruction: implement-maintenance
      reviewer_suite: peer-review-suite-backend
      review_policy_additions: [existing-system-respect]
      review_policy: [coding, testing, existing-system-respect, review]
      review_knowledge: [backend, security, architecture, unit-testing, e2e-testing, existing-system]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
