knowledge:
  frontend: ../facets/knowledge/frontend.md
  react: ../facets/knowledge/react.md
  backend: ../facets/knowledge/backend.md
  unit-testing: ../facets/knowledge/unit-testing.md
  e2e-testing: ../facets/knowledge/e2e-testing.md
  security: ../facets/knowledge/security.md
