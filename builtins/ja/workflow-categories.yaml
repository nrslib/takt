workflow_categories:
  🚀 クイックスタート:
    workflows:
      - default: "裁定・検証付きレビューを行う標準コーディングワークフロー"
      - maintenance: "既存コードと契約を尊重する保守開発ワークフロー"
      - simple: "ドメインファセットを自動選択する軽量開発ワークフロー"
      - review-fix: "多角レビューと裁定・検証付き修正の収束ループ"
  🛠️ 開発:
    workflows:
      - default
      - maintenance
      - simple
      - pure: "ファセットなしで判断力を信頼する素の開発ワークフロー"
  🔍 レビュー:
    workflows:
      - review: "専門レビュアーを選び、並列レビューを統合"
      - review-fix
      - audit-unit: "ユニットテストの振る舞いと不足を監査"
      - audit-e2e: "E2Eのユーザーフローとカバレッジ不足を監査"
      - audit-security: "全ファイルを対象にセキュリティを監査"
      - audit-architecture: "アーキテクチャ全体を監査し、Issue向けレポートを作成"
  🏗️ インフラストラクチャ:
    workflows:
      - terraform: "planから完了までを行うTerraform IaC開発"
  🎵 TAKT開発:
    workflows:
      - takt-default: "TAKT固有ファセットを使う標準開発ワークフロー"
      - takt-default-team: "Team Leader実行へ切り替えたTAKT開発ワークフロー"
      - auto-improvement-loop: "PR・Issue・改善タスクを巡回する自動ループ"
      - review-takt-default: "TAKT開発向けの多角レビュー"
      - review-fix-takt-default: "TAKT固有ファセットを注入するレビュー・修正ワークフロー"
  📦 レガシー:
    workflows:
      - cli: "CLI向けファセットを注入する開発ワークフロー"
    ✨ Simple:
      workflows:
        - simple-mini: "テスト作成を省いた軽量なMini開発"
        - simple-frontend: "フロントエンド知識を注入するシンプル開発"
        - simple-backend: "バックエンド知識を注入するシンプル開発"
        - simple-dual: "フロントエンドとバックエンド知識を注入するシンプル開発"
        - simple-cqrs: "バックエンドとCQRS+ES知識を注入するシンプル開発"
        - simple-dual-cqrs: "フロントエンド・バックエンド・CQRS+ES対応のシンプル開発"
    ⚡ Mini:
      workflows:
        - simple-mini
        - frontend-mini: "フロントエンド向けのMini開発ワークフロー"
        - backend-mini: "バックエンド向けのMini開発ワークフロー"
        - backend-cqrs-mini: "CQRS+ES向けのMini開発ワークフロー"
        - dual-mini: "フロントエンド・バックエンド向けのMini開発"
        - dual-cqrs-mini: "CQRS+ES対応のフルスタックMini開発"
    🎨 フロントエンド:
      workflows:
        - simple-frontend
        - frontend: "フロントエンド向けファセットを注入する開発ワークフロー"
        - frontend-mini
        - frontend-maintenance: "既存フロントエンド向けの保守開発ワークフロー"
    ⚙️ バックエンド:
      workflows:
        - simple-backend
        - simple-cqrs
        - backend: "バックエンド向けファセットを注入する開発ワークフロー"
        - backend-mini
        - backend-maintenance: "既存バックエンド向けの保守開発ワークフロー"
        - backend-cqrs: "バックエンドとCQRS+ES向けの開発ワークフロー"
        - backend-cqrs-mini
    🔧 デュアル:
      workflows:
        - simple-dual
        - simple-dual-cqrs
        - dual: "フロントエンドとバックエンド向けの開発ワークフロー"
        - dual-mini
        - dual-cqrs: "フロントエンド・バックエンド・CQRS+ES向けの開発"
        - dual-cqrs-mini
    🔍 レビュー:
      workflows:
        - review-frontend: "フロントエンド特化の構造・設計レビュー"
        - review-fix-frontend: "フロントエンド特化レビューと修正ループ"
        - review-backend: "バックエンド特化の構造・設計レビュー"
        - review-fix-backend: "バックエンド特化レビューと修正ループ"
        - review-dual: "フロントエンド・バックエンド特化のレビュー"
        - review-fix-dual: "フロントエンド・バックエンド特化レビューと修正ループ"
        - review-dual-cqrs: "フロントエンド・CQRS+ES特化のレビュー"
        - review-fix-dual-cqrs: "フロントエンド・CQRS+ES特化レビューと修正ループ"
        - review-backend-cqrs: "バックエンドとCQRS+ES特化のレビュー"
        - review-fix-backend-cqrs: "バックエンド・CQRS+ES特化レビューと修正ループ"
        - audit-architecture-frontend: "フロントエンドの境界を監査し、Issue向けレポートを作成"
        - audit-architecture-backend: "バックエンドの境界を監査し、Issue向けレポートを作成"
        - audit-architecture-dual: "フルスタックの境界と配線を監査し、Issue向けレポートを作成"
  その他:
    workflows:
      - research: "質問せず自律的に調査を実行するワークフロー"
      - deep-research: "新たな問いを追跡する発見駆動の深掘り調査"
      - magi: "3つの観点で分析し、多数決で判定する合議システム"
show_others_category: true
others_category_name: その他

