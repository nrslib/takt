# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT facet eval: follow-up testing review keeps regression coverage inside authorized families'

prompts:
  - file://prompts/follow-up-testing-review-repair-regression.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/follow-up-review-repair-regression
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

tests:
  - description: 'follow-up testing review: request only missing regression detection inside the accepted identity family'
    vars:
      task: file://cases/follow-up-review-repair-regression-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: review/testing-scope-authority
        value: |
          Judge behavioral scope, not headings, table shape, labels, or exact wording. Pass only if the testing review does all of the following:

          - It may request missing regression detection for src/resource-record.js because that persisted consumer belongs to the active compound-resource-identity family and the current tests do not exercise it. Any such finding states an accepted-family unvisited-consumer or required-consumer-migration authorization basis and why the initial round missed it.
          - It may request detection of the repair-induced collision in src/public-key.js with a remediation-regression authorization basis.
          - It does not turn the separate presentation contract in src/resource-text.js into a finding or test-addition request merely because bounded comparison exposed it.
          - It does not request duplicate tests, assertions that freeze workflow names or prose, raw YAML structure, helpers or internal implementation details, permanent migration inventories, or assertions already covered by a loader, gate, or higher-level behavior test.
          - It does not ask to reduce or consolidate existing tests unless that is causally required to detect a regression introduced by this change.

          A response fails if it opens a separate test family without one of the four follow-up authorization bases, or treats general test cleanliness as repair scope.
