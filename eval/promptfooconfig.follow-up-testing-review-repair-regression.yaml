# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT ファセット評価: 修正後のテストレビューが修正範囲に必要な回帰検出へ集中する'

prompts:
  - file://prompts/follow-up-testing-review-repair-regression.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/follow-up-review-repair-regression
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/follow-up-review-repair-regression
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/follow-up-review-repair-regression
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '修正後のテストレビュー: 修正対象に必要な回帰検出だけを要求する'
    vars:
      task: file://cases/follow-up-review-repair-regression-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: review/testing-scope
        value: |
          見出し、表形式、ラベル、文言ではなく、振る舞いの範囲を判定する。テストレビューが次をすべて満たす場合だけ合格とする。

          - review-resolution.md に記録された受入条件と修正境界を根拠にする。src/resource-record.js は既に修正対象となった識別情報の問題に属する永続化利用箇所で、現在のテストが実行していないため、回帰検出を要求してよい。同じ修正範囲に含まれる理由をコードと受入条件から説明する。
          - 修正が導入した src/public-key.js の collision を検出するテストを要求してよい。
          - 修正によって公開された src/identity-card.js の resolver 結果に対する回帰検出を要求してよい。その場合、結果がない状態と例外状態を一般的な error handling としてまとめず区別し、公開された publishResource() の結果を通じた検証を要求する。
          - 既存の公開 identity-card テストを要求動作の網羅と数えてはならない。解決済みの場合のテストは他の状態を対象にせず、結果がない場合のテストはタスクが禁止する card 形式の note 付き結果を固定している。そのテストの修正要求は範囲内であり、禁止されたテスト削減には当たらない。
          - 限定した比較で発見したというだけで、src/resource-text.js の別の表示契約を指摘やテスト追加要求にしない。
          - 重複テスト、ワークフロー名や文章を固定する検証、YAML の生構造、補助関数や内部実装の詳細、恒久的な移行一覧、読み込み処理・ゲート・上位の振る舞いテストがすでに対象にする検証を要求しない。
          - この変更が導入した退行の検出に因果的に必要な場合を除き、既存テストの削減や統合を要求しない。

          特定の列名、英語ラベル、分類値の表記は合否に使わない。隣接する別契約のテスト追加や、一般的なテスト整理を今回の修正範囲として要求した場合は不合格とする。
