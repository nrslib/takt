# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: peer-review / review-adjudication evidence-based finding disposition.

description: 'TAKT facet eval: レビュー finding 裁定の精度と網羅性'

prompts:
  - file://prompts/review-adjudication.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/review-adjudication
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/review-adjudication
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/review-adjudication
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        working_dir: fixtures/review-adjudication
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '裁定: 妥当な観察と許可された remediation を分離する'
    vars:
      task: file://cases/review-adjudication-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: review/adjudication-phase1-semantics
        value: file://asserts/review-adjudication-phase1.mjs
      - type: llm-rubric
        metric: review/adjudication-authority
        value: |
          見出し、列名、表形式、文言ではなく、裁定の意味を判定する。裁定が技術的妥当性と修正権限を明示的に分離し、次をすべて満たす場合だけ合格とする。

          - channel-normalization 欠陥は、受理済みの正規化動作へ直接違反するため actionable とする。coding finding と architecture finding は1つの修正対象 family を共有し、両方に正確に `direct_acceptance_criterion_violation` を記録する。一方だけを正本の actionable finding、もう一方を duplicate とする。等価な2つの initial finding のどちらを正本にしてもよい。未移行の実行 consumer は影響の証拠であり、2つ目の Authorization Basis ではない。値の結合や prose alias は不合格とする。architecture report の transaction 提案を受入条件へ昇格させない。
          - remediation が作成した worker 実行経路は、同じ channel-normalization family の別 finding だが、正確に `remediation_regression` を記録する。同じ安定した family identity を維持しながら basis を分離し、2つの機械値を結合せず、initial finding の direct basis を上書きせず、family identity を分割しない。初回ラウンドには経路が存在しなかったことを説明する。
          - `ARCH-NEW-channel-type-error-L2` を正確に1回裁定する。この主要ケースの fail-fast は厳密な error class や message を約束しないため、より強い error-shape 要求は `overreach` であり、Authorization Basis を持たず、修正対象 family に入らない。
          - src/build-label.js の完全な重複を技術的に妥当な観察として認めるが、変更されていない別契約に属するため対象外に保つ。Critical label から修正権限を作らず、修正対象 family や fix planning に含めない。
          - README 拡張、根拠のない secret-leak 主張、環境だけを根拠にする Windows 要求は、それぞれの証拠上の理由により非修正対象に保つ。
          - すべての actionable finding に、許可された機械値の Authorization Basis を正確に1つと remediation boundary を記録する。異なる basis の finding は、同じ family を共有しても別々に帰属可能な状態を保つ。actionable family が残る間は blocking を維持し、記録済み、新旧、重大度を理由に免除しない。

  - description: '裁定: 別経路と提出 family tag を記録済み family へ統合する'
    vars:
      task: file://cases/review-adjudication-family-merge-task.md
      previous_response: ''
    assert:
      - type: regex
        metric: review/existing-family-merge
        value: '`?JUDGEMENT: candidate=ARCH-NEW-channel-normalization-L2; decision=merge; target_family=FAM-channel-normalization`?\s*$'
      - type: llm-rubric
        metric: review/merge-case-type-error-authority
        value: |
          ARCH-NEW-channel-type-error-L2 を正確に1回 overreach と裁定し、Authorization Basis と修正対象 family を付与せず、正規化 candidate を FAM-channel-normalization へ統合した場合だけ合格とする。タスクは不正な文字列の即時失敗を要求するが、文字列以外の値に安定した error class や message を要求しない。

  - description: '裁定: 同じ担当箇所にある別の不変条件を分離する'
    vars:
      task: file://cases/review-adjudication-family-separation-task.md
      previous_response: ''
    assert:
      - type: regex
        metric: review/different-invariant-separation
        value: 'JUDGEMENT: candidate=ARCH-NEW-channel-type-error-L2; decision=separate; target_family=(?!FAM-channel-normalization(?:\s|$))\S+\s*$'
      - type: llm-rubric
        metric: review/different-invariant-initial-basis
        value: |
          ARCH-NEW-channel-type-error-L2 を正確に1回 actionable と裁定し、正確に `direct_acceptance_criterion_violation` を付与し、FAM-channel-normalization とは異なる修正対象 family に入れ、normalizeChannel という担当箇所の共通性だけを2つの不変条件の統合根拠にしなかった場合だけ合格とする。
