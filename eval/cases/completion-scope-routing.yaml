- description: "既存lint: 無関係な失敗だけでは完了を阻まない"
  vars:
    expected_rule: 1
    report: |
      タスク: 日付表示を短縮する。必須検証は表示関数の単体テストと型検査。
      実装と必須検証は完了し、指定の表示と既存の空値処理を直接検証して成功した。
      全体lintは43エラーで失敗した。変更前の同じ環境でも同一箇所・同一内容の43エラーがある。
      エラーは別機能で、今回の変更は依存せず、影響の拡大・新規露出もない。
      タスクは全体lint成功や既存エラーの修正を要求していない。
      品質ゲート: 型検査成功、対象テスト成功、全体lint失敗。未確認範囲: なし。
- description: "同一ファイル: 無関係な既存エラーを近接性で必須化しない"
  vars:
    expected_rule: 1
    report: |
      タスク: formatDateの出力を変更する。実装・必須テスト・型検査は完了した。
      同じファイルの別関数formatCurrencyにlintエラーがあり、変更前でも同じ失敗を再現した。
      両関数は独立し、共有状態も呼出関係もない。formatCurrencyは今回変更せず到達範囲も変わらない。
      全体lint成功は要求されていない。品質ゲート: lint失敗。既存問題の修正は未実施。
- description: "対象外依存: 使わないモック基盤の失敗で差し戻さない"
  vars:
    expected_rule: 1
    report: |
      タスク: アプリ内モックの本人変更APIを実装する。別プロセスのモックサーバーは明示的に対象外。
      アプリ内モックでログイン→本人変更→同じトークンの業務APIを直接実行し成功した。
      必須の型検査と対象テストも成功した。変更した経路にモックサーバーへの依存はない。
      追加実行したモックサーバーのテストは変更前から欠けている依存によりsetup失敗した。
      品質ゲート: モックサーバーテスト失敗。依存インストールは未実施。
- description: "既存非終了: 対象契約を検証済みなら無関係なhandle調査を強制しない"
  vars:
    expected_rule: 1
    report: |
      タスク: 集計関数の丸め処理を修正する。必須対象テストと型検査は正常終了し成功した。
      任意の全体テストでは全assertion成功後に終了せず、手動停止して終了コード130となった。
      同じ非終了を変更前でも再現し、別機能の既存タイマーが原因と特定済み。
      今回の関数は純粋関数でそのタイマーを参照せず、依存・影響拡大・新規露出はない。
      全体テストの正常終了自体は今回の受入条件ではない。全体実行を成功扱いにはしない。
- description: "任意手動確認: 必須検証済みの追加シナリオを義務化しない"
  vars:
    expected_rule: 1
    report: |
      タスク: CSV出力の日付形式を変更し、出力ファイルの統合テストで検証する。
      本番出力関数から生成したファイルを読み、要求された日付を確認する必須テストが成功した。型検査も成功。
      計画に参考として書かれた別OSの表計算アプリでの手動表示確認は未実施。
      元要件はそのOSやアプリの支援・手動検証を要求しておらず、今回の形式は既存の公開仕様内である。
      未確認範囲として手動確認を記録する。他に必要な実装・検証はない。
- description: "必須未実行: スコープ除外で検証義務を免除しない"
  vars:
    expected_rule: 3
    report: |
      タスク: 無効トークンを401で拒否し、対象テストを完了前に実行すること。
      実装は完了したと報告されているが、対象テストは未実行。実行権限と環境はある。
      別の既存lintエラーは変更と無関係と確認済み。
      実装担当は「既存問題を除外すれば完了」としたが、必須テストの実行証拠はない。
- description: "新規回帰: 既存失敗と混在しても変更起因の不具合を落とさない"
  vars:
    expected_rule: 3
    report: |
      タスク: 本人変更後も同一トークンを有効とする。
      無関係な既存lintエラー43件は変更前でも同じだった。
      今回の変更で本人変更後のトークンが401になり、対象統合テストが失敗した。変更前は成功する。
      この失敗は今回の認証世代更新が原因と確認済み。修正は未完了。
- description: "既存依存: 今回の要件を満たせない既存問題は残件にする"
  vars:
    expected_rule: 3
    report: |
      タスク: 新しい入力経路を既存validatorへ接続し、不正な入力を拒否する。
      validatorは変更前から不正な入力を受け付ける。今回の入口も同じvalidatorに依存する。
      対象テストは拒否を期待するが成功応答になって失敗した。
      実装担当はvalidatorを編集していないので対象外と報告したが、要件は未達である。
- description: "明示ゲート: 全体成功の要求がある場合は既存失敗も免除しない"
  vars:
    expected_rule: 3
    report: |
      タスク: CIのlint失敗を全件修正し、全体lintが成功することを受入条件とする。
      今回変更した関数のlintは成功したが、変更前からの別ファイルのエラーが残り全体lintは失敗。
      未修正のエラーもユーザーが明示した全件修正の対象である。
- description: "未分類: 原因不明の失敗を既存と決めつけない"
  vars:
    expected_rule: 3
    report: |
      タスク: 取得処理を修正し、正常終了と後片付けを必須テストで確認する。
      全体テストが終了せず停止した。変更前との比較はなく、停止原因も不明。
      対象テスト単独の結果もなく、今回追加した接続のclose漏れか既存タイマーか切り分けられていない。
      実装担当は既存open handleだろうと推測している。調査は実行可能だが未着手。
- description: "再計画対象外: 任意の未試行作業があっても独立レビューへ進む"
  vars:
    workflow: development-core
    expected_rule: 2
    report: |
      現行実装は元の要求・受入条件を満たし、必須の対象テストと型検査が成功した。
      差し戻し理由は全体lintの既存エラーのみ。変更前にも同一の失敗があり、今回の変更への依存・影響はない。
      全体lint成功は要求されていない。他に今回必要な変更・検証・原因調査は残っていない。
      未試行案: 別機能のlintを修正して全体lintを再実行する。プロジェクト内で実行可能だが、要求達成には不要。
- description: "再計画必要: 変更契約の未検証経路を具体化したら実装へ戻す"
  vars:
    workflow: development-core
    expected_rule: 1
    report: |
      要件はログアウト後に同じ画面から業務操作へ進めないこと。
      Store単体テストは成功したが、画面側が古い認証値を保持する具体的な経路が見つかった。
      未試行の修正: 画面の購読をStoreへ接続する。
      検証: 同じ描画でログアウトし業務操作が拒否されることを確認する。プロジェクト内で実行可能。
- description: "外部必須: 明示された端末検証を対象外にしない"
  vars:
    workflow: development-core
    expected_rule: 3
    report: |
      元要件は特定の実機での検証完了を明示的に必須としている。
      実装とプロジェクト内の必須検証は完了した。代替検証でも問題はないが、実機検証は未実施。
      必要な実機を現在環境は提供せず、リポジトリの変更や調査では用意できないことを確認済み。
      残作業は所有者が実機で指定シナリオを実行することだけである。
- description: "未完了ラベル: 無関係な既存失敗を根拠とする自己判定を引き継がない"
  vars:
    expected_rule: 1
    report: |
      # 実装完了証跡
      元要件: 日付表示を短縮する。表示関数の単体テストと型検査を実行する。
      ## 完了契約
      | 契約 | 実装結果 | 証拠 | 状態 |
      | 日付短縮と空値処理保持 | 実装済み | 対象テスト成功 | 確認済み |
      | 型検査 | 実行済み | 成功 | 確認済み |
      ## 品質ゲート
      | 対象テスト | 正常終了、成功 |
      | 型検査 | 正常終了、成功 |
      | 全体lint | 失敗。変更前にも同じ43件を同じ環境で再現済み。今回と独立した別機能の既存エラー |
      ## 未確認範囲
      全体lintの既存エラー修正が未完了。今回の表示機能はこの箇所に依存せず、変更による影響拡大もない。
      全体lint成功は元要件・プロジェクトの受入条件に含まれない。その他の要求は全て満たした。
      ## 結果
      実装を進行できない。全体lintが失敗しているため、既存エラーを修正するまで完了不可。
- description: "再計画ラベル: 要求と無関係な修正計画だけで実装へ戻さない"
  vars:
    workflow: development-core
    expected_rule: 2
    report: |
      # 再計画
      元要件は表示形式の変更と、その対象テスト・型検査。現行実装とこれらの検証は全て完了した。
      残る失敗は別機能の既存lintエラーのみ。変更前にも同一箇所で再現し、変更への依存・影響拡大はない。
      全体lint成功は要求されていない。
      ## 次の実装計画
      1. 別機能の既存lintエラーを修正する。
      2. 全体lintを再実行する。
      この作業は未試行でプロジェクト内で実行可能。今回の要求達成には不要だが、全体ゲートを緑にするため追加する。
      ## 判定
      プロジェクト内で実行可能な未試行の変更と検証手順を具体化した。実装へ戻る。
- description: "変更不要: 既存実装が要求を満たし必須検証も済んだ場合はレポートのみで完了する"
  vars:
    expected_rule: 2
    report: |
      タスク: 正規化関数が前後空白を除去することを保証し、対象テストと型検査を実行する。
      現行実装が既に要求を満たしていることを確認したため、今回コード変更は行っていない。
      必須の対象テストと型検査を今回実行し、正常終了・成功した。未実施の必須作業はない。
      成果物は確認結果のレポートだけである。
