  snapshotAt: 2026-11-01T01:00:00.000Z
  tasks: []
  readResults:
    - tool: Read
      arguments:
        file_path: /workspace/project/.takt/verification/catalog-release.md
      result: 商品 CSV の実装はゴール先端 cccccccccccccccccccccccccccccccccccccccc に取り込み済み。ローカルの docs/catalog-csv-contract.md で列名・引用符・文字コードが規定され、同じ先端でその契約を検証するテストとビルドが通過済み。残りはその資料に基づく利用案内の作成。外部の CSV 解説サイトは補助参考であり、仕様や利用案内の根拠には不要。
    - tool: takt_list_workflows
      arguments:
        cwd: /workspace/project
      result:
        workflows:
          - name: default
            description: 資料の作成とレビューを行う。
    - tool: takt_get_workflow
      arguments:
        cwd: /workspace/project
        workflow: default
      result:
        name: default
        path: /workspace/project/.takt/workflows/default.yaml
        description: 資料の作成とレビューを行う。
        initialStep: write
        steps:
          - name: write
            description: 既存仕様と確認済みの実装に沿って資料を作成し、レビューの指摘があれば修正する。
            kind: agent
            rules:
              - condition:
                  kind: semantic
                  label: COMPLETE
                next: review
          - name: review
            description: 資料が既存仕様と確認済みの実装に一致しているかレビューする。
            kind: agent
            rules:
              - condition:
                  kind: semantic
                  label: APPROVED
                next: COMPLETE
              - condition:
                  kind: semantic
                  label: NEEDS_FIX
                next: write
        collection: steps
        totalCount: 2
        returnedCount: 2
        omittedCount: 0
        offset: 0
        nextOffset: null
        truncated: false
    - tool: Bash
      arguments:
        command: curl --head https://reference.example.test/csv-guide
