      arguments:
        file_path: /workspace/project/project-policy.md
      result: 公開先は同じディレクトリ内の POSIX ファイルで、同一ファイルシステム上の rename は原子的。公開処理は同時に1つだけ動く。
    - tool: Read
      arguments:
        file_path: /workspace/project/.takt/runs/reports/review-resolution.md
      result: |-
        ## 修正対象
        公開履歴テーブル、一時版の識別子、昇格ポインター、再起動時の照合処理を追加する。

        ## 裁定の根拠
        公開途中の停止で不完全なレポートが見える可能性をなくすため、公開状態を永続的に管理する必要がある。
    - tool: takt_get_run
      arguments:
        cwd: /workspace/project
        runSlug: run-annual-report
      result:
        runSlug: run-annual-report
        task: レポートを生成し、完了した成果を公開先へ反映する。
