    Summarize the following goal document.

    # Catalog delivery destinations

    ## Objective
    Register destinations, align startup selection and operation scope, and display the current destination.

    ## Work
    1. Register and persist destinations.
    2. Resolve saved destinations on startup.
    3. Add and remove destinations.
    4. Restrict external integration operations to the selected destination.
    5. List registered destinations.
    6. Report errors when sending to an unknown destination.
    7. Display the destination in the UI.
    8. Update operating instructions.

    ## Requirements
    Preserve behavior when no destination is registered and retain existing saved data.

    ## Tests
    Check registration, startup resolution, add/remove, scope errors, listings and UI display. Classify added/changed tests and register them for type checking.

    ## How to run tests (mandatory)
    During work, directly run only targeted test files with npx vitest run --config <matching config> <file>. Run type checking (npm run test:types), npm run build and npm run lint together once at the end of the whole goal. Then run added or changed tests individually. Do not run the full heavy IT suite (npm run test:it:heavy) or the full E2E suite.

    ## Exclusions
    Creating external services, bulk sending to multiple destinations, new external integration types.

    ## Completion
    Registration, resolution, scope control and display work, preserving existing behavior. Build, lint, unit and light IT pass, and added/changed tests pass individually.

    There are no remaining decisions for me to make. Please prepare the goal summary using the document as it stands.
  readResults: []
