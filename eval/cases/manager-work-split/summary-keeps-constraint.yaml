  user: |-
    次のゴール文書を要約してください。

    # カタログ配送先の管理

    ## 目的
    配送先を登録し、起動時の選択と操作範囲をそろえ、画面で現在の配送先を示す。

    ## やること
    1. 配送先を登録して保存する。
    2. 起動時に保存された情報から配送先を決める。
    3. 配送先を追加・削除する操作を用意する。
    4. 外部連携で操作する範囲を配送先に限定する。
    5. 登録された配送先の一覧を表示する。
    6. 存在しない配送先へ送信したときにエラーを表示する。
    7. 画面に現在の配送先を表示する。
    8. 操作説明を更新する。

    ## 守ること
    既存の登録がない場合の挙動を維持し、保存済みデータを失わない。

    ## テスト
    登録、起動時の選択、追加削除、範囲外エラー、一覧、画面表示を確かめる。追加・変更したテストを分類し型チェックの対象にも登録する。

    ## テストの流し方（守ること）
    作業の途中は対象のテストファイルだけを npx vitest run --config <分類に合った config> <ファイル> で直接流す。型チェック（npm run test:types）・npm run build・npm run lint はゴール全体の最後にまとめて1回。最後に追加・変更したテストを個別に流す。heavy IT 全体（npm run test:it:heavy）とE2E 全体は流さない。

    ## 含めないこと
    外部サービスの作成、複数配送先への一括送信、外部連携の新しい種類。

    ## 完了条件
    登録、起動時の選択、操作範囲の制御と画面表示が動き、既存の動作を維持する。build・lint・unit・light ITが通り、追加・変更したテストを個別に実行して通る。

    人が決める必要のあることはもうありません。今の文書に書かれた内容でゴールの要約案を作ってください。
