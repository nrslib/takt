  user: |-
    次のゴール文書を要約してください。

    # オンラインストアの購入画面

    ## 目的
    カートから注文確認、決済結果までの画面を整え、購入者が金額と注文状況を確認できるようにする。

    ## やること
    1. カート画面で商品の数量を変更できるようにする。
    2. 小計、送料、合計金額を表示する。
    3. クーポン入力と無効なクーポンのエラー表示を追加する。
    4. 配送先フォームの必須項目を検証する。
    5. 注文確認画面で入力内容と金額を表示する。
    6. 決済の成功・失敗を画面に表示し、送信中の二重注文を防ぐ。
    7. 注文完了画面に注文番号と購入内容を表示する。
    8. 購入手順とエラー時の案内を更新する。

    ## 守ること
    既存の税込価格の丸め方と、会員・ゲスト双方の購入経路を維持する。入力した配送先は画面を戻っても失わない。
    本番の決済 API は呼ばない。決済の検証にはスタブまたはテスト用の決済 API を使う。

    ## テスト
    数量変更、金額計算、クーポン、配送先の入力検証、決済結果、二重送信の防止と注文番号の表示をコンポーネントテストで確かめる。
    ブラウザを使う E2E ではカートから注文完了までの購入経路と決済失敗時の案内をテスト環境で確かめる。

    ## テストの流し方（守ること）
    途中は変更した画面のコンポーネントテストだけを流す。ブラウザを使う E2E はゴール全体の最後に 1 回だけ流す。

    ## 含めないこと
    会員認証の変更、配送業者との連携、決済事業者の変更、ストア全体のデザイン変更。

    ## 完了条件
    カート、注文確認、決済結果と注文完了がつながり、金額と注文番号が正しく表示される。会員・ゲストの既存の動作を維持し、指定したコンポーネントテストと E2E が通り、案内が更新される。

    人が決める必要のあることはもうありません。今の文書に書かれた内容でゴールの要約案を作ってください。
  readResults: []
