  user: |-
    Summarize the following goal document.

    # Online store checkout screens

    ## Objective
    Improve the screens from cart through order review and payment results so buyers can check prices and order status.

    ## Work
    1. Allow product quantity changes in the cart screen.
    2. Display subtotal, shipping and total prices.
    3. Add coupon input and errors for invalid coupons.
    4. Validate required delivery address fields.
    5. Display entered details and prices on the order review screen.
    6. Show payment success or failure and prevent duplicate orders while submitting.
    7. Show the order number and purchased items on the order completion screen.
    8. Update checkout instructions and guidance for errors.

    ## Requirements
    Preserve existing tax-inclusive price rounding and checkout paths for both members and guests. Retain entered addresses when navigating back.
    Do not call the production payment API. Validate payments with a stub or the test payment API.

    ## Tests
    Use component tests to check quantity changes, price calculations, coupons, address validation, payment results, duplicate submission prevention and order number display.
    Use browser E2E in the test environment to check the path from cart to order completion and guidance after payment failure.

    ## How to run tests (mandatory)
    During work, run only component tests for the changed screens. Run browser E2E exactly once at the end of the whole goal.

    ## Exclusions
    Changing member authentication, integrating shipping carriers, changing the payment provider, redesigning the whole store.

    ## Completion
    Cart, order review, payment results and order completion work together, showing correct prices and order numbers. Preserve existing member and guest behavior, pass the specified component tests and E2E, and update guidance.

    There are no remaining decisions for me to make. Please prepare the goal summary using the document as it stands.
  readResults: []
