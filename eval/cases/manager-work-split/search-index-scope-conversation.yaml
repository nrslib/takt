    - tool: Agent
      arguments:
        subagent_type: Explore
        description: Trace shared memo creation, search and editing
        prompt: |-
          Read /workspace/project without changing it. Trace memo persistence, HTTP APIs, title search, full-text indexing and editing from results.
          Report existing parts and missing connections for memos without a team, with file and line references.
          Check callers, configuration and related tests. Do not change code.
      result: |-
        Investigation report. These are observations from code and documentation, not additional requests from the person.

        1. Memo model and persistence
        Memo in src/storage/memo.ts:5-20 has teamId: string | null and can persist memos without a team. ID, title, body, author, organization, update time and revision are shared fields. src/storage/shared-memo-store.ts:13-96 implements create, list, get, update and remove. Creation writes teamId: null and revision: 1. Updates compare the supplied revision against the stored one. These memos do not need to remain only in screen state.
        The current draft in src/ui/memo-draft.ts:12-48 does remain in screen state and never calls SharedMemoStore.create. src/http/memo-routes.ts:10-18 registers list, get, update and delete for shared memos, but creation only has a POST with a team ID. The store's creation method is used by tests; no HTTP entry point registers a memo without a team.

        2. List and title search
        src/search/title-search.ts:20-38 passes the query to repository.findTitles. src/storage/memo-repository.ts:44-69 reads title matches from both team and shared stores and merges by update time. It does not exclude teamId: null. Persisted shared memos are already findable through title search in the list screen. Text normalization, result limits and continuation apply to both sources.
        Title search does not inspect memo bodies. A query appearing only in a body produces no match through this entry point. Results retain memo ID and teamId, with null for shared memos. The existing list filtering reads the same storage that a creation API would populate. No additional search result format is needed for persisted shared rows.

        3. Full-text update path
        src/search/full-text-index.ts:17-48 consumes memo_updated and indexes title and body. The event in src/events/memo-events.ts:8-17 requires teamId: string. Team memo creation and update publish this event from src/http/create-team-memo.ts:32 and update-team-memo.ts:30. Shared memo update in src/http/update-shared-memo.ts:24 only returns the stored result and publishes no event.
        Successful shared memo persistence therefore does not update the full-text index. The main search box reads this index through src/http/search.ts:18-42. There is no fallback that scans all stored memos. Index rows currently also require team ownership. Working title search does not establish working full-text search.

        4. Initial indexing and rebuild
        src/search/rebuild-index.ts:18-52 enumerates registered teams and indexes each team's memos. It never scans SharedMemoStore. Adding event publication alone would leave existing shared memos without later edits absent after a rebuild. The writer reconciles ID and revision, rejecting older changes rather than appending unlimited copies of the same memo.
        Rebuild and incremental updates are separate entry points using the same row format and writer. Both keep organization boundaries. Including shared memos in full-text search would require consistent target resolution in both entry points. Current code does not invent a team ID for shared memos or insert title results into the main search while bypassing indexing.

        5. Search usage and configuration
        docs/search.md:12-35 describes list-screen title search as a lightweight filter. The main search box finds body content using full-text search. The terminal client uses that same API and has no list-screen title search, so its search entry point is the full-text index. Both title and full-text search follow search.enabled. Existing configuration resolves the index connection; no connection failure was observed.
        Current documentation describes team memo indexing but does not specify shared memo bodies as indexed content. Adding them would make memos whose bodies alone match appear in ordinary search results. Using only the existing title search would leave that index unchanged. Adding an API and expanding index coverage are separate connections.

        6. Editing from a result
        src/search/results.ts:22-39 includes memo ID and ownership in links. src/http/open-memo.ts:17-31 reads SharedMemoStore.get for null teamId. The editor displays title, body and revision for both stores. A separate screen is unnecessary for opening an unassigned result. memo-editor.test.ts:72-95 already checks opening that result link.
        Saving sends the current revision to the shared memo PUT endpoint and rejects conflicts. Successful updates persist and are immediately visible to title search, which reads storage. Full-text search reads the index, so persistence alone does not refresh its next result. The editor never writes directly to the index after saving; team memos rely on a server-side update event.

        7. Authorization and target resolution
        SharedMemoStore is instantiated per organization; absence of a team does not mean public access outside the organization. src/http/memo-context.ts:14-40 resolves the authenticated organization for list, get and edit. Both search entry points also remain inside that organization boundary. Supporting null teamId does not require removing authorization.
        The existing title length, body length and revision validation can apply to shared memo creation. Full-text support would require carrying organization and a target that can represent null through update events. Credentials and index connection values do not belong in memo bodies or result links. The observed gaps concern creation and index connections, rather than missing configuration or broken authorization.

        8. Related tests
        shared-memo-store.test.ts covers creation, retrieval and revision-checked updates without a team. title-search.test.ts:41-68 finds shared memos by title. full-text-index.test.ts:55-102 covers team memo bodies and update ordering but never constructs a target without a team. rebuild-index.test.ts only verifies registered team enumeration.
        memo-editor.test.ts opens and saves shared memos but does not search the updated full-text index. No integration test traces creation through the new API, search, editing and a subsequent updated result. Title search already reads updated shared storage directly. Full-text events, index target representation and rebuild enumeration still assume team ownership.

        The store, list title search, result links and editor already support shared memos. The registration API and creation, update and rebuild connections to the full-text index are absent. The investigation changed no code or configuration.
