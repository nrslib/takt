    チームに紐付かない共有メモを登録するAPIを足し、検索でも見つかるようにしたい。
    検索結果からメモを開いて編集し、保存した内容が次の検索にも反映されること。
    検索の対応経路は、作業量や利用者への影響を見て決めたい。
  readResults:
