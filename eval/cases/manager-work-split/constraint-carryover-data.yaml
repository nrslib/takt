      - Generate CSV reports using the new aggregate output format and preserve existing daily totals.
      - Check aggregate values and CSV columns with sample data, recording recomputation results and operating instructions.
    constraints: &a7
      - "Work constraint: During work, run only pytest tests for the changed modules."
      - "Work constraint: Recompute the entire dataset from locally stored data exactly once at the end of the whole goal."
      - "Work constraint: Do not connect to the production database. Use local sample data for intermediate validation."
