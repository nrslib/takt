    - tool: Read
      arguments:
        file_path: /workspace/project/.takt/worktrees/invoice-export/src/invoices/export.ts
      result: |-
        import { z } from 'zod';
        import { writeFile } from 'node:fs/promises';
        import { loadInvoices, loadAccountInvoices, encodeCsv } from './records.js';

        export const exportAccountInvoiceArgs = z.object({
          accountId: z.string(), invoiceIds: z.array(z.string()),
          format: z.enum(['csv', 'json']), destination: z.string(),
        });
        export type InvoiceFileArgs = Omit<z.infer<typeof exportAccountInvoiceArgs>, 'accountId'>;
        export async function exportInvoiceFiles({ invoiceIds, format, destination }: InvoiceFileArgs) {
          const invoices = await loadInvoices(invoiceIds);
          const content = format === 'csv' ? encodeCsv(invoices) : JSON.stringify(invoices);
          await writeFile(destination, content);
        }
        export async function exportAccountInvoices(args: z.infer<typeof exportAccountInvoiceArgs>) {
          await loadAccountInvoices(args.accountId, args.invoiceIds);
          await exportInvoiceFiles(args);
        }
    - tool: Read
      arguments:
        file_path: /workspace/project/.takt/worktrees/invoice-export/src/cli/invoice-export.ts
      result: |-
        import { z } from 'zod';
        import { exportAccountInvoiceArgs, exportInvoiceFiles } from '../invoices/export.js';

        export const invoiceExportArgs = exportAccountInvoiceArgs.omit({ accountId: true }).extend({
          format: z.literal('csv'),
        });
        export async function invoiceExport(raw: unknown) {
          const args = invoiceExportArgs.parse(raw);
          await exportInvoiceFiles(args);
          process.stdout.write(`${args.destination}\n`);
        }
