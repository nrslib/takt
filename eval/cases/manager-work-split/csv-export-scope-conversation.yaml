      result: |-
        Investigation report. These are observations from code and documentation, not additional requests from the person.

        1. Storage model and creation callers
        WorkLog in src/storage/work-log.ts:5-18 has departmentId: string | null, along with an ID, occurrence time, activity type, duration, body and import time. There is already a persistent representation for logs whose department is not yet known. src/storage/unassigned-log-store.ts:14-88 implements create, list, listPending, get, remove and markImported. Creation writes departmentId: null using the same file locking and ID allocation as department logs.
        The production HTTP routes expose list and delete for unassigned logs, but no creation endpoint. The only POST in src/http/log-routes.ts:12-18 is /departments/:id/logs, whose validator requires a department ID. The screen note in src/ui/draft-log.ts:11-42 only updates local screen state and never calls UnassignedLogStore.create. No creation caller was found outside tests.

        2. Screen list and download
        src/ui/log-table.ts:35-92 reads the unassigned view using departmentId: null. It retains row IDs when switching selection, and passes the same selection to src/exports/csv-download.ts:21-35 for the CSV button. src/storage/log-repository.ts:44-62 reads UnassignedLogStore for null, so persisted unassigned logs can already appear in that view and its CSV download.
        Both kinds of logs use the columns id, department_id, occurred_at, duration and body. Unassigned logs write an empty department_id. Quoting, newlines and comma escaping are centralized in src/exports/csv-codec.ts:18-73. The encoder does not require a department name and uses the same encoding for both kinds of log. This path needs no additional CSV format to handle unassigned rows.

        3. Nightly CSV enumeration
        src/jobs/nightly-csv.ts:17-41 enumerates registered departments and writes one snapshot for each. Unassigned logs are not departments, so the loop never reads them. writeDepartmentSnapshot takes a string and cannot represent a null target. Even successfully saved unassigned logs therefore produce no CSV in the nightly output directory.
        Snapshot writing uses atomic file replacement and the same encodeCsv as screen downloads. src/exports/snapshot-writer.ts:12-64 owns output timestamps, replacement and failure records. That writer could be called for unassigned logs, but there is no such caller today. Downloading a CSV from the screen does not copy it to the nightly output directory or trigger the scheduled job.

        4. Deployment modes and configuration
        docs/exports.md:12-39 describes both manual downloads and recurring aggregation fed by nightly CSV files. The latter installations operate without opening the screen; nightly output is their file retrieval path. Both CSV entry points follow exports.csv.enabled. The job checks this flag in addition to the existing scheduler setting. Existing configuration resolves the output destination, so its value is already known.
        Current documentation does not define CSV enablement as including unassigned logs in nightly output; its examples assume an enumerated department. Screen download and nightly export have separate entry points, and neither executes the other. Adding nightly output would add a new input file for recurring aggregation. Existing department filenames and CSV columns can remain intact.

        5. Import and duplicate handling
        src/import/import-csv.ts:21-63 selects src/import/unassigned-target.ts when department_id is empty. It compares row IDs against persisted records, so importing the same file twice does not keep adding copies. src/import/unassigned-target.ts:12-25 saves rows and calls markImported to persist import state. Department imports use the same ID reconciliation.
        Files from both CSV outputs are readable by this importer. The current schema does not need an extra column identifying the export entry point. No validator rejects unassigned rows; existing tests show imports reaching storage. However, saving imported data and resuming aggregation are different states. The unassigned import tests currently establish only the former.

        6. Aggregation resumption connection
        Department imports call enqueueAggregation from src/import/import-csv.ts:52 inside target.departmentId !== null. Unassigned imports never enter that branch and enqueue no aggregation event. aggregation_ready in src/aggregation/events.ts:6-12 requires departmentId: string. src/aggregation/worker.ts:28-40 uses that ID to read the checkpoint.
        src/aggregation/checkpoints.ts:9-32 already has a persisted cursor representation for unassigned logs. It can save and reload the cursor, but no connection carries that target from import to worker. There is no code inventing a department ID to fill the gap. Resumption requires a consistent target across import, event and worker resolution. Correcting export alone would not complete import-triggered aggregation resumption.

        7. API and authorization boundaries
        The department creation API in src/http/create-log.ts:15-56 validates input shape, activity type and duration before saving. The HTTP boundary resolves the authenticated user's organization. UnassignedLogStore is also instantiated per organization, so absence of a department does not mean absence of an organization. Existing list and delete endpoints operate inside this same organization boundary.
        A creation endpoint can reuse that input validation. CSV download authorization is separate from creation and is checked by the current CSV route. The scheduled job runs as its existing job identity. No observed credential failure or missing configuration explains the output gap. The two paths differ in how they enumerate their targets.

        8. Tests and missing end-to-end connections
        src/__tests__/unassigned-log-store.test.ts covers persistence, paging, deletion and imported state. csv-download.test.ts:48-71 verifies CSV output for a null selection, retaining IDs and body with an empty department column. nightly-csv.test.ts:37-66 checks only registered department files. There is no test for unassigned rows in nightly output.
        import-csv.test.ts:66-103 separately verifies department imports enqueue aggregation and unassigned imports reach storage. The latter does not check worker resumption. No integration test traces a new creation API through storage, CSV, reimport and resumption with the retained cursor. The headless usage described in docs/exports.md does not use the existing screen download route.

        Existing connected components are the unassigned store, list, screen CSV and import persistence. Missing connections are creation through the API, nightly target enumeration and the import-to-aggregation event. No code or configuration was changed during this investigation.
