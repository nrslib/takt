    元要件の完了義務は build、lint、unit、light integration、成果物検証 npm run test:artifact です。
    前の報告は完了宣言ですが、今回の成果物検証の実行証跡はありません。tools/platform の変更は不要です。
    実際に得た結果を確認してから、実装結果を報告してください。
  plan: |
    src/label.mjs は正しい実装になっている。新しい仕様や追加修正は不要。
    npm run build、npm run lint、npm test、npm run test:it、npm run test:artifact を実行する。
    今回の作業ディレクトリに検証成功の証跡はまだない。
    最後のコマンドで生成・再読込する実ファイルが完了証拠である。全コマンドはローカルで実行可能。
