# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: peer-review / coding-review defect-family discovery closure.
# Run via npm run eval:prompts:review-family-closure

description: 'TAKT facet eval: peer-review problem-family completion sweep'

prompts:
  - file://prompts/review-family-closure.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/review-family-closure
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: 'review: report every affected path in one attribution-contract family'
    vars:
      task: file://cases/review-family-closure-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: review/problem-family-closure
        value: |
          Judge substantive defect-family coverage, not headings, table shape, or exact wording. Pass only if the review rejects and reports the complete report-attribution problem family across src/runtime-state.js, src/batch.js, src/parallel.js, src/relay.js, src/resume.js, src/analytics.js, and tests/reporting.test.js, tying them to the same explicit producing-context invariant or root cause. Fail if it stops at representative locations, treats an unchecked path as verified, or reports the correct direct/emitter paths as defective.
