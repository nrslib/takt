# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: 'TAKT workflow eval: fix verifier routes mixed plan and implementation gaps to fix-plan'

prompts:
  - file://prompts/fix-verifier-state-routing.phase3.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/fix-verifier-state-closure
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

tests:
  - description: 'fix verifier routing: plan defect wins while implementation gap remains recorded'
    vars:
      scenario: file://cases/fix-verifier-state-routing.md
    assert:
      - type: regex
        value: '\[FIX-VERIFIER:2\]'
