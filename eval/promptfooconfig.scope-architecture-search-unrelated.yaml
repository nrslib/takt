# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT facet eval: shared architecture instruction ignores unrelated policy and knowledge'

prompts:
  - file://prompts/scope-architecture-search-unrelated.phase1.md

providers:
  - id: file://providers/takt-codex.mjs
    label: codex
    config:
      working_dir: fixtures/scope-architecture-search
      model_reasoning_effort: low

tests:
  - description: 'unrelated facets do not expand findings or suppress required exploration'
    vars:
      task: file://cases/scope-architecture-search.md
      previous_response: ''
    assert:
      - type: javascript
        metric: scope/search-unrelated-facets
        value: file://asserts/scope-architecture-search.mjs
