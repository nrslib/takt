# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT facet cross-eval: Codex restores the primary Requeue-to-runner contract'

prompts:
  - file://prompts/final-readiness-default-priority.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/final-readiness-default-priority
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: medium

tests:
  - description: 'final gate: Codex rejects secondary-path lock-in that contradicts the primary source'
    vars:
      task: file://cases/final-readiness-default-priority-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: primary-requeue/final-gate-recovery-codex
        value: file://asserts/final-readiness-default-priority.mjs
