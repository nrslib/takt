    vars:
      task: 'file:///private/tmp/takt-guard-final-review-v3/guard-task.md'
      previous_response: ''
    assert:
      - type: javascript
        metric: guard/strict-output
        value: 'file:///private/tmp/takt-guard-final-review-v3/guard-scorer.mjs'
