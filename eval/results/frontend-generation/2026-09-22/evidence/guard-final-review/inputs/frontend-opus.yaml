description: 'guard final review v3 Opus'
prompts:
  - label: frontend-review
    raw: 'file:///Users/nrs/work/git/takt/eval/prompts/frontend-review.phase1.j2'
    config:
      working_dir: .work/frontend-review
      required_snapshots:
        - .takt/eval-snapshots/frontend-review-policies.md
        - .takt/eval-snapshots/frontend-review-knowledge.md
  - label: frontend-review-react
    raw: 'file:///Users/nrs/work/git/takt/eval/prompts/frontend-review-react.phase1.j2'
    config:
      working_dir: .work/frontend-review-react
      required_snapshots:
        - .takt/eval-snapshots/frontend-review-react-policies.md
        - .takt/eval-snapshots/frontend-review-react-knowledge.md

providers:
  - id: 'file:///Users/nrs/work/git/takt/eval/providers/cli-review.mjs'
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      isolate_working_dir: false

evaluateOptions:
  maxConcurrency: 1

tests:
