# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT ファセット評価: 修正後セキュリティレビューで直前の裁定と阻害問題の証拠基準を維持する。
# claude / codex 両 CLI のログインが必要。デフォルトスイートからは除外。

description: 'TAKT ファセット評価: 修正後セキュリティレビューで直前の裁定を維持する'

prompts:
  - file://prompts/review-adjudication-binding.phase1.md

providers:
  - id: 'exec: bash providers/claude-review.sh claude-opus-5 fixtures/review-adjudication-binding'
    label: claude-opus-5
  - id: 'exec: bash providers/codex-review.sh gpt-5.6-luna max fixtures/review-adjudication-binding'
    label: codex-luna-max
  - id: 'exec: bash providers/codex-review.sh gpt-5.6-sol high fixtures/review-adjudication-binding'
    label: codex-sol-high

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: 'A: 最新の out_of_scope 判断を修正後レビューで維持する'
    vars:
      task: file://cases/review-adjudication-binding-a.md
      previous_response: ''
    assert:
      - type: regex
        metric: A/approve
        value: '(結果|Result)\s*[:：]\s*APPROVE'
      - type: llm-rubric
        metric: A/disposition-binding
        value: |
          見出しや表の形ではなく、セキュリティレビューの判断内容を評価する。APPROVE を返し、以前の3件 SEC-NEW-rule-size-L14、SEC-NEW-terminal-output-L28、SEC-NEW-symlink-target-L41 を漏れなく記録し、最新の判断どおりすべて out_of_scope として扱う場合だけ合格とする。いずれも persists、reopened、REJECT の根拠にしてはならない。3件のいずれかを省略する、未解消として作り直す、または阻害問題として扱う場合は不合格とする。

  - description: 'B: 同じ事象の再測定だけでは指摘を再開しない'
    vars:
      task: file://cases/review-adjudication-binding-b-remeasurement.md
      previous_response: ''
    assert:
      - type: regex
        metric: B-remeasurement/approve
        value: '(結果|Result)\s*[:：]\s*APPROVE'
      - type: llm-rubric
        metric: B-remeasurement/reopen-discipline
        value: |
          正確な文言ではなく、セキュリティレビューの判断内容を評価する。APPROVE を返し、SEC-NEW-terminal-output-L28 を out_of_scope のまま維持し、同じ単独 ESC バイトの反復観測だけでは reopened にできないと判断する場合だけ合格とする。この指摘を persists、reopened、または新しい阻害問題にしてはならない。阻害しない注意事項は許容する。

  - description: 'B 対照: 修正による再導入では reopened と REJECT を認める'
    vars:
      task: file://cases/review-adjudication-binding-b-remediation.md
      previous_response: ''
    assert:
      - type: regex
        metric: B-remediation/reject
        value: '(結果|Result)\s*[:：]\s*REJECT'
      - type: llm-rubric
        metric: B-remediation/reopen-discipline
        value: |
          正確な文言ではなく、セキュリティレビューの判断内容を評価する。REJECT を返し、端末制御の問題を reopened として扱い、直前は out_of_scope だったことと、修正によって同じ問題が再導入されたことを理由として示す場合だけ合格とする。新しい OSC シーケンスを、再現された端末タイトル偽装へ結び付けなければならない。persists とする、単なる再測定を理由にする、直前の判断または再導入の事実を省略する、あるいは APPROVE する場合は不合格とする。

  - description: 'C: ルールサイズと単独 ESC バイトだけでは阻害問題の証拠にならない'
    vars:
      task: file://cases/review-adjudication-binding-c-threshold.md
      previous_response: ''
    assert:
      - type: regex
        metric: C-threshold/approve
        value: '(結果|Result)\s*[:：]\s*APPROVE'
      - type: llm-rubric
        metric: C-threshold/security-evidence
        value: |
          提示されたセキュリティ証拠が阻害問題を示すかだけを評価する。APPROVE を返し、リポジトリ作成者が管理するルールファイルにサイズ上限がないことも、単独の ESC バイトが端末出力へ到達したことも、阻害問題にしない場合だけ合格とする。いずれも注意事項として記録して構わない。SEC-NEW-rule-size-L14 と SEC-NEW-terminal-output-L28 を含む以前の3件は out_of_scope のまま維持し、persists または reopened にしてはならない。

  - description: 'C 対照: 再現された OSC の表示効果は阻害問題の証拠になる'
    vars:
      task: file://cases/review-adjudication-binding-c-osc.md
      previous_response: ''
    assert:
      - type: regex
        metric: C-OSC/reject
        value: '(結果|Result)\s*[:：]\s*REJECT'
      - type: llm-rubric
        metric: C-OSC/security-evidence
        value: |
          正確な文言ではなく、セキュリティレビューの判断内容を評価する。REJECT を返し、再現された OSC による端末タイトル偽装を具体的な阻害問題の証拠として扱う場合だけ合格とする。SEC-NEW-terminal-output-L28 は具体的な端末効果がなかったため以前は out_of_scope だったので、今回は reopened とし、直前の判断と、新しい証拠によって端末効果を確認できたことを示さなければならない。以前の証拠が不足していたことだけを理由に指摘を抑止する、persists とする、具体的な表示効果を省略する、または APPROVE する場合は不合格とする。
