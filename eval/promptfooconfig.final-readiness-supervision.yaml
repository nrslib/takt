# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: peer-review / final-gate merge-readiness supervision.

description: 'TAKT facet eval: final supervisor merge-readiness precision and recall'

prompts:
  - file://prompts/final-readiness-supervision.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/final-readiness-supervision
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

tests:
  - description: 'final supervisor: reject an unmet configuration-entry requirement without reopening an adjudicated README request'
    vars:
      task: file://cases/final-readiness-supervision-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: final-supervisor/merge-readiness
        value: file://asserts/final-readiness-supervision.mjs
