# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: review-fix-default / final-gate new-finding evidence.

description: 'TAKT facet eval: public review-fix final-gate new-finding evidence'

prompts:
  - file://prompts/final-readiness-merge-review.phase2.md
  - file://prompts/final-readiness-supervision.phase2.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/final-readiness-supervision
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

tests:
  - description: 'public final gate: explain the authority and initial-round omission for a newly found consumer gap'
    vars:
      task: file://cases/final-readiness-supervision-task.md
      previous_response: file://cases/final-readiness-new-finding-phase1.md
    assert:
      - type: javascript
        metric: review-fix-final-gate/new-finding-evidence
        value: file://asserts/final-readiness-supervision.mjs
