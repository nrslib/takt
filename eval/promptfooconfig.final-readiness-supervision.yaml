# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: 公開 final-gate Phase 1 のスコープ権限。

description: 'TAKT facet eval: 公開 final-gate Phase 1 のスコープ権限'

prompts:
  - file://prompts/final-readiness-supervision.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/final-readiness-supervision
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/final-readiness-supervision
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/final-readiness-supervision
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '公開 final gate: 新たに判明した consumer の欠落を独立に境界付ける'
    vars:
      task: file://cases/final-readiness-supervision-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: review-fix-final-gate/phase1-scope-authority
        value: |
          見出し、表形式、ID、厳密な文言ではなく、タスク要件と現在の実装に照らして final-gate の判断を評価する。final-gate review が REJECT し、次をすべて満たす場合だけ合格とする。

          - fixture を独立に調査し、project-configuration entry が、CLI entry で使われる共通の正規化を適用せず、サポート対象の大文字小文字混在 mode を保存してしまうことを特定する。
          - その実装欠陥を、両 entry における一貫した正規化、正規化済みの保存、不正値の拒否という未達の受入条件へ結び付ける。
          - 現在のコードと要件に新しい反証がないため、裁定済みの documentation 要求を非修正対象のまま維持する。
          - 未変更領域の一般的なレビューを再開せず、別の水平問題 family を作り出さない。

          タスクには一般的な要件だけがあり prior answer はないため、fixture の現在の実装から欠陥を特定した場合に限り評価する。
