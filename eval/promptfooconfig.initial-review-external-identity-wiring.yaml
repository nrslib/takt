# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT ファセット評価: 初回レビューで外部対象の配線を確認する'

prompts:
  - file://prompts/initial-review-external-identity-wiring.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/initial-review-external-identity-wiring
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/initial-review-external-identity-wiring
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/initial-review-external-identity-wiring
      isolate_working_dir: true

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '初回レビュー: 文書化された外部ステップ対象の値を導出して追跡する'
    vars:
      task: file://cases/initial-review-external-identity-wiring-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: review/external-identity-wiring
        value: file://asserts/initial-review-external-identity-wiring.mjs
