# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT ファセット評価: 初回レビューで外部対象の配線を確認する'

prompts:
  - file://prompts/initial-review-external-identity-wiring.phase1.md

providers:
  - id: 'exec: bash providers/claude-review.sh claude-opus-5 fixtures/initial-review-external-identity-wiring'
    label: claude-opus
  - id: 'exec: bash providers/codex-review.sh gpt-5.6-luna max fixtures/initial-review-external-identity-wiring'
    label: codex-luna-max
  - id: 'exec: bash providers/codex-review.sh gpt-5.6-sol high fixtures/initial-review-external-identity-wiring'
    label: codex-sol-high

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '初回レビュー: 文書化された外部ステップ対象の値を導出して追跡する'
    vars:
      task: file://cases/initial-review-external-identity-wiring-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: review/external-identity-wiring
        value: file://asserts/initial-review-external-identity-wiring.mjs
