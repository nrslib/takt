# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT facet eval: adjudication keeps the primary Requeue-to-runner contract authoritative'

prompts:
  - file://prompts/review-adjudication-default-priority.phase1.md

providers:
  - id: 'exec: bash providers/claude-review.sh opus fixtures/review-adjudication-default-priority'
    label: claude-opus

tests:
  - description: 'adjudication: secondary recovery preference cannot override the primary execution path'
    vars:
      task: file://cases/review-adjudication-default-priority-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: primary-requeue/adjudication-authority
        value: file://asserts/review-adjudication-default-priority.mjs
