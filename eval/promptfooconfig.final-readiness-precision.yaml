# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT ファセット評価: 最終確認での要件判断。

description: 'TAKT ファセット評価: 最終確認での要件判断'

prompts:
  - file://prompts/final-readiness-precision.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/final-readiness-precision
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/final-readiness-precision
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/final-readiness-precision
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '最終確認: 計画にだけある模擬E2Eの実行記録がなくても、要件を満たす実装を承認する'
    vars:
      task: file://cases/final-readiness-precision-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: final-supervisor/precision
        value: file://asserts/final-readiness-precision.mjs
  - description: '最終確認: 実行記録ではなく、未充足のコード要件を理由に差し戻す'
    vars:
      task: file://cases/final-readiness-requirement-gap-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: final-supervisor/requirement-gap
        value: file://asserts/final-readiness-requirement-gap.mjs
  - description: '最終確認: タスク内のコードでは解決できない外部判断を保留として扱う'
    vars:
      task: file://cases/final-readiness-external-decision-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: final-supervisor/external-decision
        value: file://asserts/final-readiness-external-decision.mjs
