# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: review-fix-default / supervise requirement decisions.

description: 'TAKT facet eval: final supervisor requirement decisions'

prompts:
  - file://prompts/final-readiness-precision.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/final-readiness-precision
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: 'final supervisor: accept complete behavior when plan-only mock E2E evidence is absent'
    vars:
      task: file://cases/final-readiness-precision-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: final-supervisor/precision
        value: file://asserts/final-readiness-precision.mjs
  - description: 'final supervisor: reject an unmet code requirement, not missing execution evidence'
    vars:
      task: file://cases/final-readiness-requirement-gap-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: final-supervisor/requirement-gap
        value: file://asserts/final-readiness-requirement-gap.mjs
