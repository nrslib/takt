# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: review-fix-default / supervise precision on a mergeable change.

description: 'TAKT facet eval: final supervisor merge-readiness precision'

prompts:
  - file://prompts/final-readiness-precision.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/final-readiness-precision
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

tests:
  - description: 'final supervisor: accept complete behavior without reopening an adjudicated documentation improvement'
    vars:
      task: file://cases/final-readiness-precision-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: final-supervisor/precision
        value: file://asserts/final-readiness-precision.mjs
