# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT interactive summary eval: Gherkin is always available and formal specification guidance is conditional'

prompts:
  - file://task-instruction-gherkin-prompt.mjs

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/task-instruction-gherkin
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: 'English source: design details stay in Markdown and observable behavior becomes focused Gherkin'
    vars:
      language: en
      formalSpec: false
      conversation: |
        Add configurable retry handling to the payment flow. Extract the current
        retry decisions behind a RetryPolicy interface so payment providers do not
        depend on timing details. Keep provider adapters separate from policy
        selection, and do not add a new dependency.

        A transient provider failure should be retried at most three times. A
        permanent rejection must fail immediately without retrying. When all
        transient retries are exhausted, return the existing payment-failed result.
        Add unit tests for the policy and integration tests for the payment flow.
    assert:
      - type: javascript
        metric: task-instruction-gherkin/structure
        value: |
          const block = output.match(/```gherkin\s*([\s\S]*?)```/i)?.[1] ?? '';
          return /Feature\s*:/i.test(block) && /Scenario\s*:/i.test(block);
      - type: javascript
        metric: task-instruction-gherkin/no-implementation-in-gherkin
        value: |
          const block = output.match(/```gherkin\s*([\s\S]*?)```/i)?.[1] ?? '';
          return block.length > 0 && !/(RetryPolicy|interface|adapter|dependency|file|function|class)/i.test(block);
      - type: javascript
        metric: task-instruction-gherkin/focused-scenarios
        value: |
          const block = output.match(/```gherkin\s*([\s\S]*?)```/i)?.[1] ?? '';
          return (block.match(/\bScenario\s*:/gi) ?? []).length <= 3;
      - type: llm-rubric
        metric: task-instruction-gherkin/semantic-separation-en
        value: |
          Judge the generated task instruction itself. Pass only if it is a coherent
          Markdown document that preserves the explicitly requested design intent:
          introduce a RetryPolicy abstraction, separate provider adapters
          from policy selection, add no dependency, and cover both unit and
          integration tests. Those implementation and design details must remain in
          Markdown outside the Gherkin block.

          The fenced Gherkin must capture the externally observable retry contract:
          transient failures retry no more than three times, permanent rejection
          fails without retry, and exhausted transient retries return the existing
          payment-failed result. It must use concrete verifiable outcomes, avoid
          implementation mechanisms, avoid repeating detailed acceptance clauses
          in the surrounding Markdown, and use no more scenarios than needed to
          distinguish these behaviors. A high-level statement of purpose and a
          verification reference to the Gherkin scenarios do not count as duplication.

  - description: 'Japanese: abstraction intent stays in Markdown and boundary behavior becomes focused Gherkin'
    vars:
      language: ja
      formalSpec: false
      conversation: |
        商品検索のキャッシュ処理を追加してほしい。キャッシュ方式は
        SearchCache インターフェースで抽象化し、検索ユースケースが Redis の
        詳細を知らない構成にする。既存の依存性注入の境界を維持し、新しい
        ライブラリは追加しないこと。

        同じ検索条件の有効なキャッシュがあれば検索結果を再利用する。
        キャッシュが期限切れなら検索を実行して結果を更新する。キャッシュ基盤が
        利用不能な場合でも検索自体は成功させ、キャッシュなしの結果を返す。
        抽象化の単体テストと検索フローの統合テストを追加する。
    assert:
      - type: javascript
        metric: task-instruction-gherkin/structure-ja
        value: |
          const block = output.match(/```gherkin\s*([\s\S]*?)```/i)?.[1] ?? '';
          return /Feature\s*:/i.test(block) && /Scenario\s*:/i.test(block);
      - type: javascript
        metric: task-instruction-gherkin/no-implementation-in-gherkin-ja
        value: |
          const block = output.match(/```gherkin\s*([\s\S]*?)```/i)?.[1] ?? '';
          return block.length > 0 && !/(SearchCache|Redis|インターフェース|依存性注入|ライブラリ|ファイル|関数|クラス)/i.test(block);
      - type: javascript
        metric: task-instruction-gherkin/focused-scenarios-ja
        value: |
          const block = output.match(/```gherkin\s*([\s\S]*?)```/i)?.[1] ?? '';
          return (block.match(/\bScenario\s*:/gi) ?? []).length <= 3;
      - type: llm-rubric
        metric: task-instruction-gherkin/semantic-separation-ja
        value: |
          実際に生成されたタスク指示書を評価すること。日本語の一貫した Markdown
          文書であり、SearchCache インターフェースによる抽象化、検索ユースケースを
          Redis の詳細から分離する設計意図、既存の依存性注入境界、新規ライブラリを
          追加しない制約、単体テストと統合テストが Gherkin の外の Markdown に保持
          されている場合のみ合格とする。

          fenced Gherkin には、同一条件の有効なキャッシュの再利用、期限切れ時の検索と
          更新、キャッシュ基盤が利用不能でも検索を成功させる振る舞いが、判定可能な
          結果として記述されている必要がある。実装方法を含めず、詳細な受け入れ条件を
          Markdown 側に再掲せず、これらの境界を区別するために必要な最小限の Scenario
          にすること。Markdown で目的を大まかに説明することや、確認方法から Gherkin
          全体を参照することは重複とみなさない。

  - description: 'Formal specification mode uses applicable notation without duplicate requirements or ASCII diagrams'
    vars:
      language: en
      formalSpec: true
      conversation: |
        Add a lease service with Requested, Active, Expired, and Released states.
        Activation is allowed only from Requested. An active lease eventually
        becomes Expired unless it is released first. Each resource has at most one
        active lease, and every lease belongs to exactly one resource and one owner.
        Keep observable API behavior in Gherkin. Use formal notation only where it
        is applicable, use actual syntax, and do not duplicate requirements.
    assert:
      - type: javascript
        metric: task-instruction-formal-spec/no-ascii-diagram
        value: |
          return !/[+|][-=]{2,}|->.*->|\[[^\]]+\]\s*--/m.test(output);
      - type: llm-rubric
        metric: task-instruction-formal-spec/applicable-notation
        value: |
          Pass only if the generated task instruction uses actual Quint syntax for
          the lease state-transition or temporal requirements and actual Alloy
          syntax for the ownership/cardinality relationships. The same requirement
          must not be repeated across Gherkin, Quint, Alloy, and Markdown. It must
          not contain an ASCII diagram or invent pseudo-notation.
