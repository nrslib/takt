# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT facet eval: default write-tests keeps behavior while removing structure proxies'

prompts:
  - file://prompts/scope-default-write-tests.phase1.md

providers:
  - id: file://providers/takt-codex.mjs
    label: codex
    config:
      working_dir: .work/scope-default-write-tests
      permission_mode: edit
      model_reasoning_effort: low

tests:
  - description: 'default write-tests: behavior contract, no line or source proxy'
    vars:
      task: file://cases/scope-write-tests-task.md
      previous_response: ''
      work_id: scope-default-write-tests
    assert:
      - type: javascript
        metric: scope/default-write-tests
        value: file://asserts/scope-discipline-write-tests.mjs
