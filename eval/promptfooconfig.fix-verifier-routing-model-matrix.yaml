# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# 4モデルのログインが必要な測定用スイート。デフォルトゲートからは除外する。

description: 'TAKT workflow eval: fix-verifier mixed-gap routing across Opus, Sol, Luna Max, and Kimi K3'

prompts:
  - file://prompts/fix-verifier-state-routing.phase3.md

providers:
  - id: 'exec: bash providers/claude-review.sh claude-opus-5 fixtures/fix-verifier-state-closure'
    label: claude-opus
  - id: 'exec: bash providers/codex-review.sh gpt-5.6-sol high fixtures/fix-verifier-state-closure'
    label: codex-sol-high
  - id: 'exec: bash providers/codex-review.sh gpt-5.6-luna max fixtures/fix-verifier-state-closure'
    label: codex-luna-max
  - id: 'exec: bash providers/opencode-review.sh moonshotai/kimi-k3 fixtures/fix-verifier-state-closure'
    label: kimi-k3

evaluateOptions:
  maxConcurrency: 4

tests:
  - description: 'fix verifier routing: plan defect wins while implementation gap remains recorded'
    vars:
      scenario: file://cases/fix-verifier-state-routing.md
    assert:
      - type: regex
        value: '\[FIX-VERIFIER:2\]'
