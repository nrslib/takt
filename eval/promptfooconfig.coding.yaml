# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Prompt quality eval for TAKT facets across the standard review model matrix.
#
# Evaluates the REAL assembled Phase 1 prompt of the coding-review substep
# (peer-review subworkflow, the takt-default lineage), rendered via
# eval/scripts/prepare.mjs. arch-review lives in promptfooconfig.arch.yaml.
#
# Run from the repo root:
#   npm run eval:prompts:coding   # requires Claude and Codex CLI logins

description: 'TAKT facet eval: peer-review / coding-review'

prompts:
  - file://prompts/coding-review.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/sample-project
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/sample-project
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/sample-project
      isolate_working_dir: true

# The Claude provider uses Claude CLI login. Codex providers and the grader use
# Codex CLI login; no API billing is used.
defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: 'recall: planted coding-policy violations must be flagged'
    vars:
      task: file://cases/buggy-user-store.md
      previous_response: file://cases/prev-gather-buggy.md
    assert:
      - type: javascript
        metric: recall/fallback-for-required-data
        value: |
          return /(register|user-?store)/i.test(output) &&
            /(fallback|フォールバック|\?\?|unknown)/i.test(output);
      - type: javascript
        metric: recall/swallowed-error
        value: |
          return /(loadFromJson|catch|例外|exception)/i.test(output) &&
            /(swallow|silent|suppress|ignor|握りつぶ|黙殺|隠蔽|無視|空配列|empty array|伝播(?:されない|されず|されません|していない|しない|せず|しません|させていない|させない|させず)|再(?:throw|スロー|送出)(?:されない|されず|しない|せず)|飲み込)/i.test(output);
      - type: javascript
        metric: recall/any-type
        value: |
          return /(:\s*any\b|`any`|\bany\b\s*型|\bany\b\s+type|の\s*\bany\b|\bany\b\s*と)/i.test(output) &&
            /(問題|指摘|禁止|避け|型安全|unsafe|no-explicit-any|type-?safe|破壊|上書き|任意|無制限|検証|拒否|限定)/i.test(output);
      - type: javascript
        metric: recall/in-place-mutation
        value: |
          const target = /(?:sortByName|\.sort\b|ソート|並べ替え|並び替え)/i;
          const mutation = /(?:破壊|変更|書き換え|mutat|in[ -]?place|元の(?:配列|入力|値|参照)(?:を|が|の)?(?:破壊|変更|書き換え|ソート))/i;
          const inputEffect = /(?:入力|元の|呼び出し元|同一参照|配列|input|caller|array)/i;
          const text = String(output);
          const findingBlocks = text.split(/\n(?=###\s)/);

          // A reviewer may separate the missing target behavior and its mutation
          // evidence into different findings. Keep mutation and input ownership
          // in one finding, while allowing the target evidence in another.
          const scopedMutation = findingBlocks.some(
            (block) => mutation.test(block) && inputEffect.test(block),
          );
          return target.test(text) && scopedMutation;
      - type: javascript
        metric: recall/deferred-validation
        value: |
          const marker = /\b(?:TODO|FIXME)\b/gi;
          const incomplete = /(?:先送り|未実装|未完成|実装待ち|未完了|未解消|保留|実装されて(?:いない|おらず|いません)|無検証|未検証|検証不足|検証されて(?:いない|おらず|いません)|欠落|不足|missing|absent|incomplete|pending|unresolved|(?:not|(?:is|was|are|were|has|have)n['’]t)\s+(?:yet\s+)?(?:been\s+)?(?:present|implemented|validated|verified|completed|complete|resolved|finished)|残すべき処理では(?:ない|ありません)|(?:実装|検証|解消)(?:済み|完了)(?:ではない|ではありません|でない|じゃない|ではなく|でなく)|実装されていない|defer(?:red|ring)?|unfinished|unimplemented|unvalidated|unverified)/i;
          const incompleteGlobal = new RegExp(incomplete.source, 'gi');
          const complete = /(?:\b(?:present|implemented|validated|verified|resolved|completed|complete|finished)\b|(?<!未)完了|実装(?:済み|完了)|検証(?:済み|完了)|解消(?:済み|完了))/gi;
          const targetBoundary = /(?:[,，、;():：]|\b(?:and|but|or|while|although|even\s+though|however|though|whereas|with|plus|this|that|it)\b|ただし|しかし|一方で|でしたが|ですが|だが)/i;
          const targetTokens = (clause) => new Set(
            clause
              .toLowerCase()
              .replace(/検証|バリデーション/g, ' validation ')
              .replace(/認証|認可/g, ' authorization ')
              .replace(/キャッシュ/g, ' cache ')
              .replace(/入力/g, ' input ')
              .replace(/出力/g, ' output ')
              .replace(/\bauth(?:orization)?\b/gi, ' authorization ')
              .replace(/\b(?:todo|fixme|is|was|are|were|has|have|been|being|now|already|still|later|currently|finally|subsequently|eventually|since|fully|successfully|correctly|properly|not|yet|the|a|an|and|but|or|while|although|even|though|however|whereas|with|plus|this|that|it|check|checks|handler|handling|logic|rules?|fields?|paths?|code|implementation|work|feature|task|item|missing|absent|incomplete|pending|unresolved|unfinished|unimplemented|unvalidated|unverified|defer(?:red|ring)?|present|implemented|validated|verified|resolved|completed|complete|finished)\b/gi, ' ')
              .split(/[^a-z0-9_]+/)
              .filter((token) => token.length > 2),
          );
          const targetContext = (clause, match) => {
            const before = clause.slice(0, match.index ?? 0);
            const after = clause.slice((match.index ?? 0) + match[0].length);
            const previousBoundaries = [...before.matchAll(new RegExp(targetBoundary.source, 'gi'))];
            const previousBoundary = previousBoundaries.at(-1);
            const nextBoundary = after.search(targetBoundary);
            const contextStart = previousBoundary
              ? previousBoundary.index + previousBoundary[0].length
              : 0;
            return targetTokens(
              before.slice(contextStart) +
              ' ' +
              match[0] +
              ' ' +
              after.slice(0, nextBoundary < 0 ? after.length : nextBoundary),
            );
          };
          const sameTarget = (previousTargets, nextTargets) => {
            if (previousTargets.size === 0 || nextTargets.size === 0) return false;
            const sharedTokens = [...previousTargets].filter((token) => nextTargets.has(token));
            return sharedTokens.length === previousTargets.size && sharedTokens.length === nextTargets.size;
          };
          const isPositiveCompletion = (clause, match) =>
            !/\b(?:not|(?:is|was|are|were|has|have)n['’]t)(?:\s+yet)?(?:\s+been)?\s*$/i.test(
              clause.slice(0, match.index ?? 0),
            ) &&
            !/^\s*(?:ではない|ではありません|でない|じゃない|ではなく|でなく|していない|しておらず|していません)/i.test(
              clause.slice((match.index ?? 0) + match[0].length),
            );
          const isNegatedIncomplete = (clause, match) =>
            /\b(?:not|(?:is|was|are|were|has|have)n['’]t)\s*$/i.test(clause.slice(0, match.index ?? 0)) ||
            /^\s*(?:ではない|ではありません|でない|じゃない|ではなく|でなく)/i.test(
              clause.slice((match.index ?? 0) + match[0].length),
            );
          const incompleteMatches = (clause) =>
            [...clause.matchAll(incompleteGlobal)].filter((match) => !isNegatedIncomplete(clause, match));
          const positiveCompletions = (clause) =>
            [...clause.matchAll(complete)].filter((match) => isPositiveCompletion(clause, match));
          const isDirectContinuation = /^(?:(?:is|was|are|were|has|have)\b|(?:implemented|validated|verified|resolved|completed|complete|finished)\b|(?:it|this|that)\s+(?:is|was|are|were|has|have)\b|(?:now|already|still)\s+(?:(?:is|was|are|were|has|have)\b|(?:it|this|that)\s+(?:is|was|are|were|has|have)\b|(?:implemented|validated|verified|resolved|completed|complete|finished)\b)|(?<!未)完了|(?:実装|検証|解消)(?:済み|完了))/i;
          const completionCancels = (incompleteClause, completionClause) => {
            const completions = positiveCompletions(completionClause);
            return incompleteMatches(incompleteClause).some((incompleteMatch) =>
              completions.some((completionMatch) => {
                if (incompleteClause === completionClause &&
                  (completionMatch.index ?? 0) <= (incompleteMatch.index ?? 0)) return false;
                const incompleteTargets = targetContext(incompleteClause, incompleteMatch);
                const completionTargets = targetContext(completionClause, completionMatch);
                return sameTarget(incompleteTargets, completionTargets) ||
                  (completionTargets.size === 0 && isDirectContinuation.test(completionClause));
              }),
            );
          };
          const hasViolation = (segment) => {
            const clauses = segment
              .split(/(?:[,，、;():：]|\b(?:and|but|or|while|although|even\s+though|however|though|whereas|with|plus|this|that|it)\b|ただし|しかし|一方で|でしたが|ですが|だが)/i)
              .map((clause) => clause.trim())
              .filter(Boolean);
            return clauses.some((clause, clauseIndex) => {
              if (incompleteMatches(clause).length === 0) return false;
              if (completionCancels(clause, clause)) return false;
              return !clauses
                .slice(clauseIndex + 1)
                .some((nextClause) => completionCancels(clause, nextClause));
            });
          };
          return String(output).split(/[\n。.!?！？]+/).some((unit) => {
            const markers = [...unit.matchAll(marker)];
            return markers.some((markerMatch, index) => {
              const start = markerMatch.index ?? 0;
              const end = markers[index + 1]?.index ?? unit.length;
              const leadingContext = index === 0 ? unit.slice(0, start) : '';
              return (
                hasViolation(leadingContext) ||
                hasViolation(unit.slice(start, end))
              );
            });
          });
      - type: javascript
        metric: recall/blocking-verdict
        value: |
          return /(?:^|\n)(?:#{1,6}[ \t]*)?(?:(?:レビュー)?結果|判定|Result|Verdict)(?:[ \t]*[:：][ \t]*|[ \t]+|\n[ \t]*\n?[ \t]*)(?:\*\*)?(?:REJECT|REQUEST\s+CHANGES)\b/im.test(output) ||
            /(?:^|\n)#{1,6}\s*(?:\*\*)?(?:REJECT|REQUEST\s+CHANGES)\b/im.test(output);

  - description: 'precision: clean diff must not produce fabricated findings'
    vars:
      task: file://cases/clean-logger.md
      previous_response: file://cases/prev-gather-clean.md
    assert:
      - type: llm-rubric
        metric: precision/no-false-positive
        value: |
          The output is a code review of a small, correct Logger class.
          Pass only if the verdict is APPROVE and the review does NOT assert
          a substantive defect (bug, policy violation, security risk) in the
          logger change. Minor or optional improvement suggestions are
          acceptable only when they remain non-blocking and are not reported
          as findings. Fail if the verdict is REJECT / REQUEST CHANGES or the
          review claims any concrete defect requiring a fix.

  - description: 'recall: explicitly required completeness must remain blocking'
    vars:
      task: file://cases/required-logger-shorthands.md
      previous_response: file://cases/prev-gather-required-logger-shorthands.md
    assert:
      - type: llm-rubric
        metric: recall/required-completeness
        value: |
          The task explicitly requires Logger convenience methods for all four
          levels: debug(), info(), warn(), and error(). The implementation has
          only debug() and error(). Pass only if the review returns REJECT or
          REQUEST CHANGES and identifies both missing required methods, info()
          and warn(), as a requirement violation. Fail if it approves, treats
          the methods as optional, or suppresses the issue as an improvement
          suggestion, warning, symmetry concern, or overreach.
