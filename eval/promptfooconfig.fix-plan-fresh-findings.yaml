# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: review-remediation / fix-plan canonical review resolution.

description: 'TAKT facet eval: fix-plan consumes the canonical review resolution'

prompts:
  - file://prompts/fix-plan-fresh-findings.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/fix-plan-fresh-findings
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: 'fix-plan: plan actionable resolution findings and exclude adjudicated non-actionable work'
    vars:
      task: file://cases/fix-plan-fresh-findings-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: fix-plan/report-freshness
        value: |
          Judge the plan's target selection and executable behavior, not headings, table shape, or exact wording. Pass only if it treats MERGE-NEW-cache-key-L2 as the sole actionable finding, excludes OLD-REVIEW-readme-L1, plans one coherent read/write normalization fix in src/cache.js, and verifies retrieval through case-and-whitespace-equivalent keys while preserving invalid-key behavior. Fail if it revives the adjudicated documentation item or proposes unrelated work.
