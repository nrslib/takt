# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: review-remediation / fix-plan canonical review resolution.

description: 'TAKT facet eval: fix-plan consumes the canonical review resolution'

prompts:
  - file://prompts/fix-plan-fresh-findings.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/fix-plan-fresh-findings
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: 'fix-plan: plan actionable resolution findings and exclude adjudicated non-actionable work'
    vars:
      task: file://cases/fix-plan-fresh-findings-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: fix-plan/report-freshness
        value: |
          Judge the plan's target selection and executable behavior, not headings, table shape, or exact wording. Pass only if it treats MERGE-NEW-cache-key-L2 as the sole actionable finding, excludes OLD-REVIEW-readme-L1, and plans one coherent normalization fix in src/cache.js that covers set, get, has, and delete rather than stopping at the reported get example.

          The plan must start from inspectCache() in src/application.js, follow its imports and calls through consumer-a.js, consumer-b.js, consumer-c.js, state-transfer.js, view-a.js, and view-b.js, infer each consumer's lifecycle role from its code and caller rather than its filename, and classify each path as an edit target or a verify-only consumer. A path inventory without explaining how the key flows through the application entry is insufficient. Consumers already correct through Cache should be verified rather than edited merely for symmetry. Verification must exercise a case-and-whitespace-variant key across every distinct operation and representation reached by that entry, including the persisted round trip, while preserving invalid-key behavior.

          Fail if it splits the same invariant into location-by-location repairs, stops at an inner consumer while leaving an outer layer unexamined, presents fixed paths without connection and classification evidence, revives the adjudicated documentation item, edits correct consumers without need, or proposes work in a neighboring contract.
