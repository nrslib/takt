# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT ファセット評価: 修正計画が確定済みのレビュー裁定を使用する。

description: 'TAKT ファセット評価: 修正計画が確定済みのレビュー裁定を使用する'

prompts:
  - file://prompts/fix-plan-fresh-findings.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/fix-plan-fresh-findings
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/fix-plan-fresh-findings
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/fix-plan-fresh-findings
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '修正計画: 修正対象の指摘を計画し、非修正対象を除外する'
    vars:
      task: file://cases/fix-plan-fresh-findings-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: fix-plan/report-freshness
        value: |
          MERGE-NEW-cache-key-L2 と REGRESSION-NEW-cache-delete-L21 を、同じキャッシュキー正規化の原因から生じる2つの指摘として1つの修正単位へまとめ、OLD-REVIEW-readme-L1 を除外し、報告例だけで止まらず set、get、has、delete を含む src/cache.js の一貫した正規化修正を計画した場合だけ合格とする。

          src/application.js の inspectCache() と、そこから import・呼び出しされる consumer-a.js、consumer-b.js、consumer-c.js、state-transfer.js、view-a.js、view-b.js を実際の呼び出しとデータフローで接続し、各利用箇所を編集対象または確認だけ行う利用箇所に分類する。説明の順序は問わないが、ファイル名の一覧だけで接続済みとしてはならない。Cache を通じてすでに正しい利用箇所は、対称性だけを理由に編集せず検証する。検証は不正なキーの振る舞いを保持しながら、大文字小文字と空白を変えたキーを、永続化の往復を含む入口から到達する異なる操作と表現で実行する。

          同じ条件を場所ごとの修正へ分割する、外側の入口を未確認のまま内側の利用箇所で止まる、接続と役割の証拠なしに固定の経路を提示する、裁定済みのドキュメント項目を復活させる、正しい利用箇所を不要に編集する、または隣接契約の作業を提案した場合は不合格とする。
