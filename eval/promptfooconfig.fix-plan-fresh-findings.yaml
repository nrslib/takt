# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: review-remediation / fix-plan canonical review resolution.

description: 'TAKT facet eval: fix-plan が正本の review resolution を使用する'

prompts:
  - file://prompts/fix-plan-fresh-findings.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/fix-plan-fresh-findings
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/fix-plan-fresh-findings
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/fix-plan-fresh-findings
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: 'fix-plan: actionable finding を計画し、非修正対象を除外する'
    vars:
      task: file://cases/fix-plan-fresh-findings-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: fix-plan/report-freshness
        value: |
          見出し、表形式、文言ではなく、計画の対象選択と実行可能な振る舞いを判定する。MERGE-NEW-cache-key-L2 と REGRESSION-NEW-cache-delete-L21 を1つの cache-key-normalization family に属する2つの actionable finding として扱い、OLD-REVIEW-readme-L1 を除外し、報告例だけで止まらず set、get、has、delete を含む src/cache.js の一貫した正規化修正を1つ計画した場合だけ合格とする。finding coverage は MERGE-NEW-cache-key-L2 に正確に `accepted_family_unvisited_consumer`、REGRESSION-NEW-cache-delete-L21 に正確に `remediation_regression` を転記する。2つの finding が同じ family と修正単位を共有することだけを理由に、値を結合、翻訳、上書きしてはならない。

          計画は src/application.js の inspectCache() から開始し、import と call を consumer-a.js、consumer-b.js、consumer-c.js、state-transfer.js、view-a.js、view-b.js まで追跡する。各 consumer の lifecycle role を filename ではなく code と caller から推定し、各経路を edit target または verify-only consumer に分類する。key が application entry をどのように流れるかを説明しない path inventory は不十分とする。Cache を通じてすでに正しい consumer は、対称性だけを理由に編集せず検証する。検証は不正 key の振る舞いを保持しながら、大文字小文字と空白を変えた key を、永続化の往復を含む entry から到達する異なる operation と representation のすべてで実行する。

          同じ不変条件を場所ごとの修正へ分割する、outer layer を未確認のまま inner consumer で止まる、接続と分類の証拠なしに固定 path を提示する、裁定済みのドキュメント項目を復活させる、正しい consumer を不要に編集する、または隣接契約の作業を提案した場合は不合格とする。
