# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT ファセット評価: 修正後レビューが修正済みという主張を独立に反証する'

prompts:
  - file://prompts/follow-up-review-repair-regression.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/follow-up-review-repair-regression
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/follow-up-review-repair-regression
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/follow-up-review-repair-regression
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '修正後レビュー: 不完全な修正を、修正起因の退行および隣接契約の欠陥と区別する'
    vars:
      task: file://cases/follow-up-review-repair-regression-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: review/remediation-falsification
        value: |
          レビューが因果関係をコード上の証拠で区別して REJECT し、次をすべて満たす場合だけ合格とする。

          - src/public-key.js を修正が導入した衝突の欠陥として特定し、この新しい指摘を修正が導入したことを明示する。
          - src/retry-token.js と src/checkpoint.js に対する元の指摘を、別に未解消として維持する。
          - src/application.js の publishResource() から保存結果をたどり、src/resource-record.js の保存処理が job ID だけを記録する一方、復元処理は両方の ID を保持する既存の識別情報と照合することを確認する。この保存・復元経路を、記録済みの identity 修正の範囲に属する既存だが未確認だった利用箇所として特定し、同じ修正範囲に含まれる理由をコードと受入条件から説明する。保存側と復元側の不一致を別原因として別の問題に分けても、修正範囲から除外していなければ不合格にしない。
          - review-resolution.md に記録された受入条件と修正境界を根拠に、src/public-key.js は修正が導入した退行、src/resource-record.js は記録済みの修正範囲にある未確認だった利用箇所として区別する。問題のまとめ方ではなく、この因果関係と修正範囲を評価する。
          - publishResource() を通して解決済みの identity-card 条件を追跡し、note なしの完全な tenant/job card を返すことを確認する。この正常条件は欠陥条件と分けて証拠を示す。
          - 新しく公開された identity-card 経路を修正起因と特定し、src/identity-card.js の resolver が生む2つの具体的な結果を報告する。タスクは card 形式の結果を返さず失敗を伝播することを要求するが、結果がない場合と例外が投げられた場合は、それぞれ成功に見える note 付き結果へ変換される。2つの結果を1つの指摘にまとめてもよいが、両方を明示的に証明する。一般的なエラー処理への参照だけでは不十分とする。
          - 明示された「識別情報を完全に解決できた場合だけ」という前提条件も評価する。tenant ID または job ID を欠く resolver の成功結果が `undefined` を含む成功に見える card に到達することを報告するか、その入力が到達不能である具体的な根拠を示して除外する。入力が完全だと仮定するだけでは不合格とする。
          - 修正報告と既存の公開 identity-card テストを、note の振る舞いを保持すべき理由として採用しない。以前から存在することやテストが合格することは、保持すべき仕様を成立させない。src/application.js は明示的なタスク要件に従う公開用の表現でこの振る舞いを新たに公開している。結果がない場合のテストが要件の禁止する結果を固定しており、例外状態を対象にするテストがないことを記載する。
          - 具体的な経路と分岐を示す静的なコード上の証拠は、これらの結果の証明として十分である。振る舞いが静的に確定する場合、読み取り専用レビューは実行再現を要求しない。
          - 同じ入口からのデータフローに基づき、src/primary-key.js と src/structured-key.js が正常である理由、および src/resource-text.js が正常または非修正対象である理由を説明する。厳密な分類ラベルは要求しない。

          経路を列挙するだけ、またはすべての欠陥を元の未解消指摘にまとめるだけでは、修正起因の退行と同じ問題に属する既存の利用箇所を区別する接続証拠と因果関係がないため不合格とする。隣接するテキスト契約への拡張も不合格とする。
