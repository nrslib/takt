# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: public final-gate Phase 2 finding preservation.

description: 'TAKT facet eval: public final-gate Phase 2 finding preservation'

prompts:
  - file://prompts/final-readiness-supervision-phase2.phase2.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/final-readiness-supervision
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

tests:
  - description: 'public final gate report: preserve a new finding without reviving adjudicated noise'
    vars:
      task: file://cases/final-readiness-supervision-task.md
      previous_response: file://cases/final-readiness-new-finding-phase1.md
    assert:
      - type: javascript
        metric: review-fix-final-gate/phase2-finding-preservation
        value: file://asserts/final-readiness-supervision.mjs
