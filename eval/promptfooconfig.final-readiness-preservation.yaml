# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: 公開 final-gate Phase 2 の finding 保持。

description: 'TAKT facet eval: 公開 final-gate Phase 2 の finding 保持'

prompts:
  - file://prompts/final-readiness-supervision-phase2.phase2.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/final-readiness-supervision
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/final-readiness-supervision
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/final-readiness-supervision
      isolate_working_dir: true

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '公開 final gate report: 裁定済みのノイズを復活させず新規 finding を保持する'
    vars:
      task: file://cases/final-readiness-supervision-task.md
      previous_response: file://cases/final-readiness-new-finding-phase1.md
    assert:
      - type: javascript
        metric: review-fix-final-gate/phase2-finding-preservation
        value: file://asserts/final-readiness-supervision.mjs
