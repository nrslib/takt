# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT ファセット評価: 並列実行中の失敗だけを直列化の根拠にしない修正計画'

prompts:
  - file://prompts/fix-plan-cause-check.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/fix-plan-cause-check
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/fix-plan-cause-check
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/fix-plan-cause-check
      isolate_working_dir: true

evaluateOptions:
  maxConcurrency: 1
  repeat: 3

tests:
  - description: '修正計画: 資源競合が未確認なら並列実行を維持する'
    vars:
      task: file://cases/fix-plan-cause-check-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: fix-plan/cause-check
        value: |
          見出し、表形式、厳密な文言ではなく、原因の特定と実装担当へ指示する変更内容を評価する。

          「並列実行では失敗し、単独実行では成功した」という事実だけでは資源競合を証明できないと判断すること。直列化、shard 並列度の削減、timeout 延長、retry の拡大、テスト除外を修正方法にせず、`Promise.all` 自体を根本原因にしないこと。記録された製品上の原因、すなわち完了状態が保存済みの review ID に対して更新経路が別の task update を生成する問題を修正対象とすること。変更範囲を完了状態と task update の所有箇所に限定すること。読み取り専用の調査でその所有箇所または妥当な実装方法を特定できない場合は、計画を確定せず再計画を要求すること。

          単独成功と並列失敗を資源競合の証明とする、`Promise.all` を直列実行へ置き換える、直列化後の成功を原因の証明とする、更新の所有箇所に記録された review ID の重複を無視する、または並列度、timeout、retry、テスト対象、無関係な製品契約を変更する場合は不合格とする。
