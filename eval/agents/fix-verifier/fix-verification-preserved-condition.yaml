# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT ファセット評価: 維持すべき既存条件の退行'

prompts:
  - file://../../prompts/fix-verification-preserved-condition.phase1.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/fix-verification-preserved-condition
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/fix-verification-preserved-condition
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/fix-verification-preserved-condition
      isolate_working_dir: true

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '修正完了検証: 維持すべき既存条件を壊した場合は未完了とする'
    vars:
      task: file://../../cases/fix-verification-preserved-condition-task.md
      previous_response: ''
      regression_case: preserved_default
    assert:
      - type: javascript
        metric: fix-verification/preserved-condition
        value: file://../../asserts/fix-verification-regression.mjs
