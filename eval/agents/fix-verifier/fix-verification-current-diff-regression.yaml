# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT ファセット評価: 今回の差分による広域品質確認の退行'

prompts:
  - file://../../prompts/fix-verification-current-diff-regression.phase1.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/fix-verification-current-diff-regression
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/fix-verification-current-diff-regression
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/fix-verification-current-diff-regression
      isolate_working_dir: true

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '修正完了検証: 今回の差分が広い品質確認を壊した場合は未完了とする'
    vars:
      task: file://../../cases/fix-verification-current-diff-regression-task.md
      previous_response: ''
      regression_case: current_diff_export
    assert:
      - type: javascript
        metric: fix-verification/current-diff-regression
        value: file://../../asserts/fix-verification-regression.mjs
