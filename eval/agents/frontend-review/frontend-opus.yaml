# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Run via npm run eval:prompts -- frontend-opus

description: 'GUI design: paired implementations, modal and confirmation behavior, framework idioms, and operation paths'

prompts:
  - label: frontend-review
    raw: file://../../prompts/frontend-review.phase1.j2
    config:
      working_dir: .work/frontend-review
      required_snapshots:
        - .takt/eval-snapshots/frontend-review-policies.md
        - .takt/eval-snapshots/frontend-review-knowledge.md
  - label: frontend-review-react
    raw: file://../../prompts/frontend-review-react.phase1.j2
    config:
      working_dir: .work/frontend-review-react
      required_snapshots:
        - .takt/eval-snapshots/frontend-review-react-policies.md
        - .takt/eval-snapshots/frontend-review-react-knowledge.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      isolate_working_dir: true

evaluateOptions:
  maxConcurrency: 1

tests:
  - description: '13 paired designs and 6 framework idioms'
    vars:
      task: file://../../cases/frontend-gui-patterns.md
      previous_response: file://../../cases/prev-gather-frontend-gui.md
    assert:
      - type: javascript
        metric: gui/acceptance
        value: file://../../asserts/frontend-gui-accept.mjs
      - type: javascript
        metric: gui/defect-detection
        value: file://../../asserts/frontend-gui-reject.mjs
