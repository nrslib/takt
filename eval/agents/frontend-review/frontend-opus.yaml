# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Run via npm run eval:prompts -- frontend-opus

description: 'GUI design: paired implementations and framework idioms'

prompts:
  - file://../../prompts/frontend-review.phase1.md
  - file://../../prompts/frontend-review-react.phase1.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/frontend-design
      isolate_working_dir: true

evaluateOptions:
  maxConcurrency: 1

tests:
  - description: '8 paired designs and 5 framework idioms'
    vars:
      task: file://../../cases/frontend-gui-patterns.md
      previous_response: file://../../cases/prev-gather-frontend-gui.md
    assert:
      - type: javascript
        metric: gui/acceptance
        value: file://../../asserts/frontend-gui-accept.mjs
      - type: javascript
        metric: gui/defect-detection
        value: file://../../asserts/frontend-gui-reject.mjs
