# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT ファセット評価: 同じ接続を reconnect 前後で観測するテストを作り、所有権の報告を埋める'

prompts:
  - file://../../prompts/state-after-event-write-tests.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: ../../.work/state-after-event-write-tests
      sandbox_mode: workspace-write
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: 'テスト作成: 同じ接続の reconnect 前後を一続きに観測する'
    vars:
      task: file://../../cases/state-after-event-write-tests-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: write-tests/state-after-event-artifacts
        value: file://../../asserts/state-after-event-write-tests.mjs
      - type: llm-rubric
        metric: write-tests/state-after-event-observable-evidence
        value: |
          見出し、IDの形式、表の形、正確な文言ではなく、作成物の実質で判定する。合格条件はすべて満たすこと。

          - 出力文が、同じ接続で reconnect 前後を一続きに観測したテストを作成したと説明する。
          - 独立した接続、別々の起動、または実環境の手動確認を証拠として使ったと明示した場合だけ不合格とする。これらを使っていないと明示していないことは不合格にしない。
          - `createConnection` の呼び出し回数、実際のオブジェクト identity、test report の内容は artifact assert がファイルを実行・検査して判定する。チャット出力の説明だけでこれらを合格にしない。

          無関係な永続化、並行性、モジュール数に基づくテストを追加することは合格条件ではなく、要求してはならない。
