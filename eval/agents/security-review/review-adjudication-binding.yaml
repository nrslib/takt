# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT ファセット評価: 修正後セキュリティレビューで直前の裁定と阻害問題の証拠基準を維持する。
# claude / codex 両 CLI のログインが必要。デフォルトスイートからは除外。

description: 'TAKT ファセット評価: 修正後セキュリティレビューで直前の裁定を維持する'

prompts:
  - file://../../prompts/review-adjudication-binding.phase1.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/review-adjudication-binding
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/review-adjudication-binding
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/review-adjudication-binding
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: 'A: 直前に修正不要と判断した指摘を修正後レビューでも維持する'
    vars:
      task: file://../../cases/review-adjudication-binding-a.md
      previous_response: ''
    assert:
      - type: regex
        metric: A/approve
        value: '(?:結果|判定|結論|Result|Decision|Verdict)\s*[:：]\s*(?:\*{1,2}|_{1,2}|`)?APPROVE(?:\*{1,2}|_{1,2}|`)?'
      - type: llm-rubric
        metric: A/disposition-binding
        value: |
          セキュリティレビューの判断内容を評価する。APPROVE を返し、以前の3件 SEC-NEW-rule-size-L14、SEC-NEW-terminal-output-L28、SEC-NEW-symlink-target-L41 を漏れなく記録し、直前の判断どおり、いずれも今回修正すべき問題ではないと説明する場合だけ合格とする。3件のいずれかを省略する、未解消の問題として作り直す、または差し止めの理由にする場合は不合格とする。

  - description: 'B: 同じ事象の再測定だけでは指摘を再開しない'
    vars:
      task: file://../../cases/review-adjudication-binding-b-remeasurement.md
      previous_response: ''
    assert:
      - type: regex
        metric: B-remeasurement/approve
        value: '(?:結果|判定|結論|Result|Decision|Verdict)\s*[:：]\s*(?:\*{1,2}|_{1,2}|`)?APPROVE(?:\*{1,2}|_{1,2}|`)?'
      - type: llm-rubric
        metric: B-remeasurement/reopen-discipline
        value: |
          セキュリティレビューの判断内容を評価する。APPROVE を返し、SEC-NEW-terminal-output-L28 は今回修正すべき問題ではないという直前の判断を維持し、同じ単独 ESC バイトの反復観測だけでは判断を変更できないと説明する場合だけ合格とする。この指摘を未解消の問題または新しい差し止め理由にしてはならない。進行を妨げない注意事項は許容する。

  - description: 'B 対照: 修正による再導入では判断を変更して差し戻す'
    vars:
      task: file://../../cases/review-adjudication-binding-b-remediation.md
      previous_response: ''
    assert:
      - type: regex
        metric: B-remediation/reject
        value: '(?:結果|判定|結論|Result|Decision|Verdict)\s*[:：]\s*(?:\*{1,2}|_{1,2}|`)?REJECT(?:\*{1,2}|_{1,2}|`)?'
      - type: llm-rubric
        metric: B-remediation/reopen-discipline
        value: |
          セキュリティレビューの判断内容を評価する。REJECT を返し、端末制御の問題は直前には修正不要と判断されたものの、今回の修正によって具体的な問題が導入されたため判断を変更したと説明する場合だけ合格とする。新しい OSC シーケンスを、再現された端末タイトル偽装へ結び付けなければならない。単なる再測定を理由にする、直前の判断または修正による導入の事実を省略する、あるいは APPROVE する場合は不合格とする。

  - description: 'C: ルールサイズと単独 ESC バイトだけでは阻害問題の証拠にならない'
    vars:
      task: file://../../cases/review-adjudication-binding-c-threshold.md
      previous_response: ''
    assert:
      - type: regex
        metric: C-threshold/approve
        value: '(?:結果|判定|結論|Result|Decision|Verdict)\s*[:：]\s*(?:\*{1,2}|_{1,2}|`)?APPROVE(?:\*{1,2}|_{1,2}|`)?'
      - type: llm-rubric
        metric: C-threshold/security-evidence
        value: |
          提示されたセキュリティ証拠が差し止めるべき問題を示すか評価する。APPROVE を返し、リポジトリ作成者が管理するルールファイルにサイズ上限がないことも、単独の ESC バイトが端末出力へ到達したことも、今回修正すべき問題にしない場合だけ合格とする。いずれも注意事項として記録して構わない。SEC-NEW-rule-size-L14 と SEC-NEW-terminal-output-L28 を含む以前の3件は、直前の判断どおり修正不要とし、未解消の問題または新しい差し止め理由にしてはならない。

  - description: 'C 対照: 再現された OSC の表示効果は阻害問題の証拠になる'
    vars:
      task: file://../../cases/review-adjudication-binding-c-osc.md
      previous_response: ''
    assert:
      - type: regex
        metric: C-OSC/reject
        value: '(?:結果|判定|結論|Result|Decision|Verdict)\s*[:：]\s*(?:\*{1,2}|_{1,2}|`)?REJECT(?:\*{1,2}|_{1,2}|`)?'
      - type: llm-rubric
        metric: C-OSC/security-evidence
        value: |
          セキュリティレビューの判断内容を評価する。REJECT を返し、再現された OSC による端末タイトル偽装を具体的な差し止め理由として扱う場合だけ合格とする。SEC-NEW-terminal-output-L28 は、以前は具体的な端末効果を確認できず修正不要と判断されたが、今回は新しい証拠で端末効果を確認できたため判断を変更したと説明しなければならない。以前の証拠が不足していたことだけを理由に今回も指摘を退ける、具体的な表示効果を省略する、または APPROVE する場合は不合格とする。
