# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT ファセット評価: イベント後に同じ実体の状態へ追従する計画と誤発火なしを対で確認する'

prompts:
  - file://../../prompts/state-after-event-plan.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: ../../fixtures/state-after-event-plan
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low
  - id: file://../../providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/state-after-event-plan
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/state-after-event-plan
      isolate_working_dir: true

evaluateOptions:
  maxConcurrency: 3

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: '計画: 同じマウント済み端末を resize 前後で追従させる'
    vars:
      task: file://../../cases/state-after-event-plan-trigger-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: plan/state-after-event-trigger
        value: |
          見出し、IDの形式、表の形、正確な文言ではなく、計画の実質で判定する。合格条件はすべて満たすこと。

          - 履歴の帯が `createOutput.appendHistory` の時点の `terminal.columns` で一度だけ書き出され、resize 後に再描画されない構造であることを、実装を根拠に見抜く。`refresh()` が live 行だけを扱うことも含める。
          - 端末幅の変化後も履歴の帯を追従させるため、履歴を保持して resize 時に再描画する、履歴を一度だけ書く経路から外すなどの構造変更を計画に含める。
          - 完了契約と完了証拠を、一つのマウント済みビューで「帯を表示 → 幅変更と resize → 既存の帯がその時点の幅で描画される」ことを一続きに観測するテストとする。
          - 別々の幅で別々にマウントした描画を証拠にしない。live 行の resize テストを履歴帯の証拠として流用しない。実TTYの手動確認だけに送らない。

          これらを満たさない計画は不合格とする。
  - description: '計画: 純粋な整形変更ではイベント軸を追加しない'
    vars:
      task: file://../../cases/state-after-event-plan-no-trigger-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: plan/state-after-event-no-trigger
        value: |
          見出し、IDの形式、表の形、正確な文言ではなく、計画の実質で判定する。合格条件はすべて満たすこと。

          - resize、イベント前後、同じ実体の前後観測、永続化、再接続、並行性の軸を計画へ追加しない。
          - 送信済みユーザー発言の先頭マーカーの変換と、その直接のテストを主対象にする。
          - 既存動作を維持する契約や、変更不要の根拠を記載しても減点しない。

          既存の resize 処理や live 行の振る舞いを「維持する」「変更しない」と記載しても減点しない。

          これらを満たさず、上記のイベント軸を追加した計画は不合格とする。
