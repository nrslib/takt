# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT ファセット評価: 初回レビューで変更契約を特定する'

prompts:
  - file://../../prompts/initial-review-contract-discovery.phase1.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/initial-review-contract-discovery
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/initial-review-contract-discovery
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/initial-review-contract-discovery
      isolate_working_dir: true

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '初回レビュー: projection と identity の変更契約を独立に特定する'
    vars:
      task: file://../../cases/initial-review-contract-discovery-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: review/initial-contract-discovery
        value: file://../../asserts/initial-review-contract-discovery.mjs
