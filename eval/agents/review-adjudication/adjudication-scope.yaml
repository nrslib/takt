evaluateOptions:
  maxConcurrency: 1
defaultTest:
  vars:
    task: spec.md と Report Directory の最新レビューを、現在のコードと記録に照らして裁定してください。
    previous_response: ""
  options:
    provider:
      id: openai:codex-sdk
      config:
        working_dir: ../../
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model: gpt-6-luna
        model_reasoning_effort: medium
  assert:
    - type: llm-rubric
      metric: adjudication-scope/decisions
      value: >-
        このケースの採否の正解と確認してよい範囲は次のケース基準で決まる。正解や関係するファイルを自分で決め直さず、ケース基準と矛盾する理由で不合格にしない。

        ケース基準: {{case_key}}

        評価対象は、そのケースの依頼文と資料にある指摘・引き継ぎ項目だけとする。そのケースの要求・仕様と提出された証拠に照らして採否と根拠を評価し、別ケースの指摘 ID やファイルについての判断を要求しない。 見出し・文言・読んだ量ではなく、analysis/report の採否と理由を評価する。全対象について判断を返し、採用する未解消の欠陥には受入条件と修正境界を示す。正しい指摘の不採用は、読解量が少なくても不合格。未確認を確認済みの欠陥や問題なしへ読み替えない。 仕様・要求・既存契約に反する実在の不具合は、脅威モデルの内側なら今回の作業・計画との関係を問わず採る。品質改善・リファクタリングは今回の要求・変更との関係、機能追加・仕様変更は要求上の根拠で判断する。欠陥と提案された直し方は分けて裁定する。
    - type: llm-rubric
      metric: adjudication-scope/evidence
      value: >-
        このケースの採否の正解と確認してよい範囲は次のケース基準で決まる。正解や関係するファイルを自分で決め直さず、ケース基準と矛盾する理由で不合格にしない。

        ケース基準: {{case_key}}

        評価対象の指摘と資料は、そのケースの依頼文と資料にあるものとする。読解の証拠は出力JSONの initialPrompt と traces の各フェーズ・セッション・道具ID・入力・実返却本文とし、根拠のない自己申告では証明しない。資料は、供給された同内容を読めていればよく、出典ファイルを別途開くことは要求しない。 守る条件と具体的な違反、採否を変える成立前提を実際の証拠で確認する。必要な証拠がない推測、採否に必要な参照可能資料を残した未確認、ログ不足・切り詰めで確認できない場合は不合格。仕様に明記された導入条件も前提を決める証拠とする。短い関連ファイルの全文、所在検索、必要な長い経路は許す。 引き継いだ指摘は、独立検証・最新レビューの記録と現在の実装・設定および元の受入条件との対応で評価する。対応する記録は確認結果として使え、裁定者自身の再実行を一律の合格条件にしない。 受入条件は守る条件を満たす結果、修正境界は確認済みの原因と契約から示せば十分。全呼び出し元・唯一性・具体的な修正方式の追加調査を一律には要求しない。採否を決めた経路の説明だけを追加調査の証拠とみなさない。
    - type: llm-rubric
      metric: adjudication-scope/scope
      value: >-
        このケースの採否の正解と確認してよい範囲は次のケース基準で決まる。正解や関係するファイルを自分で決め直さず、ケース基準と矛盾する理由で不合格にしない。

        ケース基準: {{case_key}}

        そのケースの依頼文と資料にある裁定対象について、採否を変える未確定事項、反証や記録の食い違いを確かめる読解を認め、ファイル数・文字数・道具回数では罰しない。正しい不具合が今回の作業や計画と無関係であることは、採用やその前提確認を範囲外にする理由にならない。 裁定対象外の懸念をどこまで確かめてよいかは、各ケースの基準に従う。 引き継いだ結果との対応に必要な実装・検証記録・固定版の該当箇所の確認は許す。矛盾や不足もなく過去の計画・修正の本文を順に読み経過を再構築する、直ったかの検証をやり直す、採否が決まった後に全利用箇所や修正方式を道具で実際に探索する場合は不合格。修正方式の選択や全利用箇所の確認を修正計画へ渡す記述は探索ではなく、不合格にしない。 確認済みの原因・経路から受入条件と最小の修正境界を記述することは必要な報告であり、追加探索と区別する。実際の道具返却から無関係な読解や探索の再開を示して判定し、説明が詳しいことだけでは不合格にしない。
    - type: llm-rubric
      metric: adjudication-scope/handoff
      value: >-
        このケースの採否の正解と確認してよい範囲は次のケース基準で決まる。正解や関係するファイルを自分で決め直さず、ケース基準と矛盾する理由で不合格にしない。

        ケース基準: {{case_key}}

        そのケースの依頼文と資料にある引き継ぎ項目について、以前の採用と現在の解消状態を分け、元の受入条件と現在の状態に対応する独立検証・最新レビューの結果を引き継ぐ。対応する記録で確認済みの事項を、裁定者が自分で再実行していないという理由で未解決の作業に戻したら不合格。再実行していない旨の注記だけなら未解決への先送りとみなさない。 供給された固定版参照と実行順序・欠落や未完了の情報を報告に残す。参照の転記には本文読解を要求せず、報告への転記自体は履歴分析とみなさない。 採否が決まらない場合は未解決の事項と渡し先を示し、事実不足は修正計画の調査、要求上の義務の不明は再計画へ渡す。必要な証拠が揃った事項を未解決へ逃がせば不合格。採用後の具体的な直し方や全利用箇所の確認を後続へ渡す記述は許し、それらが未調査という理由で採否や受入条件を未確定としない。節の名前だけで未解決への先送りと判定しない。 Phase 2 は実 Phase 1 の判断を保持する。報告のために探索、再検証、履歴分析を再開すれば不合格。
tests:
  - description: adjudication-scope-input-local-ja
    prompts:
      - adjudication-scope-input-local-ja
    assert:
      - type: llm-rubric
        metric: adjudication-scope/input-local
        value: >-
          SEC-PATH は脅威モデルの外にある防御要求として非採用。日英とも spec.md:2 は所有者だけが編集する設定値による自身のファイル読込を許可、4行目は同じ権限によるローカル状態の変更を防御対象外、5行目はこの導入が所有者のローカル選択を使い外部リクエスト入口がないと明記する。3行目は外部投稿値を処理するときの保護義務であり、この導入で外部投稿値が到達するという意味ではない。 spec と entry → .state/selection.json の設定読込 → reader の実返却で主体・同じ権限の経路を確認すれば十分。所有者が公開範囲外の自身のファイルを読めることは仕様どおりであり、仕様との食い違いでも未解決の前提でもない。型だけから安全と推定すれば不合格。唯一の呼び出し元や共有経路の不在を全体検索で示すこと、仮定上の外部経路の追加調査、未解決として残すことは要求しない。
      - type: llm-rubric
        metric: adjudication-scope/inherited-count
        value: >-
          このケースの P-COUNT / CODE-COUNT は以前の採用と元の2条件を保持し、解消済みとして引き継ぐ。reports-seed/review-resolution.md:2 の空配列の件数0・2件の件数2、reports-seed/fix-verification.md:2-3 の対象と成功結果、最新 coding-review.md の解消済み欄にある現在も独立検証と同じコード状態という記録の対応で十分。Report Directory に供給された同内容が initialPrompt または道具の実返却で読めていればよく、種ファイル自体の読解は要求しない。 ハッシュ再計算・テスト再実行・history/round-1 の固定版本文の再読は必須ではない。矛盾のない対応を読めていれば、裁定者が再実行・再計算していない旨の注記だけで不合格にしない。それらを未解決の作業として修正計画へ送れば不合格。src/count.mjs、現在の検証記録、固定版の計画・修正・検証記録の該当箇所の読解やハッシュ照合を、現在の状態との対応確認に使うことは許す。追加確認を行ったこと自体を不合格にせず、直ったかの検証のやり直しや、矛盾・不足のない過去の経過の再構築とは区別する。 reports-seed/review-resolution.md:4 で供給された round-1 の history/round-1/fix-plan.md、history/round-1/fix-report.md、history/round-1/fix-verification.md と、順序1・欠落や未完了なしの情報を報告に残す。このケースは新規指摘の採否と P-COUNT の解消を決める証拠が揃うので、それらを未解決へ逃がせば不合格。
      - type: llm-rubric
        metric: adjudication-scope/non-finding-concern
        value: >-
          このケースの最新 coding-review.md の「指摘にしなかった懸念」表（en は Non-Finding Concerns）にあるカタログ懸念は、分類が no_issue_after_verification で持ち越し指定がなく、対象指摘の採否にも関係しない。対象外は分類欄で決まるので、参照先の過去計画を開かないこと、この懸念を裁定表に載せないことは正しい扱いであり、不合格にしない。この懸念について開いてよいのは src/catalog-label.mjs、history/round-0/catalog-plan.md、docs/catalog.md の3ファイルで、これらを読むことは不合格にしない。出力契約は対象外の行の説明を求めていないが、その内容を対象外の理由として報告に書いたことだけでは、採否と調査範囲の評価に関係しないため不合格にしない。不合格にするのは、この懸念を裁定対象に加えて採否・受入条件・修正境界を決めた場合と、この懸念を確かめるために3ファイル以外へ進んだ場合（利用箇所の検索、テストやコードの実行、他の文書・コードの追跡）だけとする。evidence.test.mjs、package.json、仕様や対象指摘のコードを読むことは対象指摘の確認であり、この懸念の調査とはみなさない。カタログ懸念の調査と判定するのは、catalogLabel や表示名を対象にした検索・実行・追跡が道具の記録にある場合に限る。 最新レポートの分類欄や参照先の記載、自然な名前検索の断片・パスの確認は許す。最初の見渡しで小さな資料一式やソース一式をまとめて表示した中にこれらが混ざっただけで、その後この懸念を調べていなければ不合格にしない。対象外の行の説明を報告へ書くことは要求しない。
    vars:
      case_key: |-
        SEC-PATH は脅威モデルの外にある防御要求として非採用。日英とも spec.md:2 は所有者だけが編集する設定値による自身のファイル読込を許可、4行目は同じ権限によるローカル状態の変更を防御対象外、5行目はこの導入が所有者のローカル選択を使い外部リクエスト入口がないと明記する。3行目は外部投稿値を処理するときの保護義務であり、この導入で外部投稿値が到達するという意味ではない。 spec と entry → .state/selection.json の設定読込 → reader の実返却で主体・同じ権限の経路を確認すれば十分。所有者が公開範囲外の自身のファイルを読めることは仕様どおりであり、仕様との食い違いでも未解決の前提でもない。型だけから安全と推定すれば不合格。唯一の呼び出し元や共有経路の不在を全体検索で示すこと、仮定上の外部経路の追加調査、未解決として残すことは要求しない。
        このケースの P-COUNT / CODE-COUNT は以前の採用と元の2条件を保持し、解消済みとして引き継ぐ。reports-seed/review-resolution.md:2 の空配列の件数0・2件の件数2、reports-seed/fix-verification.md:2-3 の対象と成功結果、最新 coding-review.md の解消済み欄にある現在も独立検証と同じコード状態という記録の対応で十分。Report Directory に供給された同内容が initialPrompt または道具の実返却で読めていればよく、種ファイル自体の読解は要求しない。 ハッシュ再計算・テスト再実行・history/round-1 の固定版本文の再読は必須ではない。矛盾のない対応を読めていれば、裁定者が再実行・再計算していない旨の注記だけで不合格にしない。それらを未解決の作業として修正計画へ送れば不合格。src/count.mjs、現在の検証記録、固定版の計画・修正・検証記録の該当箇所の読解やハッシュ照合を、現在の状態との対応確認に使うことは許す。追加確認を行ったこと自体を不合格にせず、直ったかの検証のやり直しや、矛盾・不足のない過去の経過の再構築とは区別する。 reports-seed/review-resolution.md:4 で供給された round-1 の history/round-1/fix-plan.md、history/round-1/fix-report.md、history/round-1/fix-verification.md と、順序1・欠落や未完了なしの情報を報告に残す。このケースは新規指摘の採否と P-COUNT の解消を決める証拠が揃うので、それらを未解決へ逃がせば不合格。
        このケースの最新 coding-review.md の「指摘にしなかった懸念」表（en は Non-Finding Concerns）にあるカタログ懸念は、分類が no_issue_after_verification で持ち越し指定がなく、対象指摘の採否にも関係しない。対象外は分類欄で決まるので、参照先の過去計画を開かないこと、この懸念を裁定表に載せないことは正しい扱いであり、不合格にしない。この懸念について開いてよいのは src/catalog-label.mjs、history/round-0/catalog-plan.md、docs/catalog.md の3ファイルで、これらを読むことは不合格にしない。出力契約は対象外の行の説明を求めていないが、その内容を対象外の理由として報告に書いたことだけでは、採否と調査範囲の評価に関係しないため不合格にしない。不合格にするのは、この懸念を裁定対象に加えて採否・受入条件・修正境界を決めた場合と、この懸念を確かめるために3ファイル以外へ進んだ場合（利用箇所の検索、テストやコードの実行、他の文書・コードの追跡）だけとする。evidence.test.mjs、package.json、仕様や対象指摘のコードを読むことは対象指摘の確認であり、この懸念の調査とはみなさない。カタログ懸念の調査と判定するのは、catalogLabel や表示名を対象にした検索・実行・追跡が道具の記録にある場合に限る。 最新レポートの分類欄や参照先の記載、自然な名前検索の断片・パスの確認は許す。最初の見渡しで小さな資料一式やソース一式をまとめて表示した中にこれらが混ざっただけで、その後この懸念を調べていなければ不合格にしない。対象外の行の説明を報告へ書くことは要求しない。
