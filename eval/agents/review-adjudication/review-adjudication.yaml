          With no plan in progress, use the recurrence of a previously repaired identification violation within the applicable scope and the common mechanism by which character replacement and delimiter joining collapse distinct pairs to the same key to trigger reconsideration of the repair method as a condition for passing. A decision that reconsideration does not trigger, or a list of history and causes without the trigger decision, fails.
          Score the actual Phase 1 analysis and, for phase2, its continued report. Preserve acceptance, reasons, boundaries, inherited status, and immutable references across reporting; do not restart history analysis merely to fill the report.
          Phase 2 must carry forward the Phase 1 reconsideration decision, its evidence, and conditions to preserve; do not introduce or reverse that decision during reporting.

