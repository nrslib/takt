    prompts:
      - k1
    vars:
      task: 'spec.md と .takt/runs/eval/reports/coding-review.md を参照し、現在のコードと記録から判断してください。'
      previous_response: ''
      output_phase: phase2
    assert:
      - type: llm-rubric
        metric: repair-strategy/adjudication-k1-phase2
        value: |
          見出しや語の一致ではなく、根拠・変更・観測の対応を意味で評価する。次をすべて満たす場合だけ合格とする。
