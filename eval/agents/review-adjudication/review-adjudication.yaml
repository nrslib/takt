          A は v0 の区切り連結の衝突、B は v1 の置換文字と入力文字の衝突であり、各修正後に対象検証は成功している。v2 でも C の a~b と a_b が同じ値になる。任意文字列という仕様と結び、内容の文字置換で要素の識別を保てるという共通前提が残ることを具体的に示す。
          指摘の採否と方式を見直す材料を分け、現在の指摘を正しく採用し、過去の成功を今回の反例の否定に使わない。実装方針の確定は裁定の必須条件にしない。
          対象範囲、正常時・失敗時の結果、方式指定を保持する。事実の捏造、不要な問題の統合、非発火例での不要な方式変更・再計画・停止は不合格。
          採点対象は Phase 1 の実応答を引き継いだレポートのみ。判断根拠と履歴の固定版参照（履歴がない場合はその事実）を残す。
          前回の方式・前提、解消した条件、今回の反例、共通原因、検出できなかった理由を記録する。非発火例は該当しない内容と理由を示せばよい。
