        metric: repair-strategy/adjudication-k1-en-phase1
        value: |
          Evaluate substance rather than headings, IDs, or wording. Accept the current submitted finding from its failure condition, current code, and required contract; do not use prior successes to deny the counterexample. Preserve problem identity, scope, acceptance criteria, and mandated conditions without fabricating history. Carry forward supplied immutable references with execution identity, ordering, missing or incomplete status. In adjudication, whether repair-method reconsideration is needed, its evidence, and the conditions to preserve are scored.
