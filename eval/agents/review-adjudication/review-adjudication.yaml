# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT ファセット評価: ピアレビューの指摘を証拠に基づいて裁定する。

description: 'TAKT ファセット評価: レビュー指摘の裁定精度と網羅性'

prompts:
  - file://../../prompts/review-adjudication.phase1.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/review-adjudication
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/review-adjudication
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/review-adjudication
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        working_dir: ../../fixtures/review-adjudication
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '裁定: 妥当な観察と今回の修正対象を分離する'
    vars:
      task: file://../../cases/review-adjudication-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: review/adjudication-scope
        value: |
          裁定が技術的妥当性と今回の修正対象を明示的に分離し、次をすべて満たす場合だけ合格とする。

          - channel 正規化の欠陥は受理済み動作へ直接違反するため修正対象とする。コーディングとアーキテクチャの重複指摘は同じ原因として統合し、アーキテクチャ報告の transaction 提案を受入条件へ昇格させない。
          - 修正が作成した worker 実行経路の欠陥は、同じ正規化の問題に属する一方で、修正によって生じた退行であることを初回指摘と区別する。初回レビュー時にはその経路が存在しなかったことを説明する。
          - `ARCH-NEW-channel-type-error-L2` を漏れなく裁定する。この主要ケースは厳密なエラークラスやメッセージを約束しないため、より強いエラー形式の要求は修正対象にしない。
          - src/build-label.js の完全な重複を技術的に妥当な観察として認めるが、変更されていない別契約に属するため対象外に保つ。Critical という重大度だけで修正対象にせず、修正計画に含めない。
          - README 拡張、根拠のない secret-leak 主張、環境だけを根拠にする Windows 要求は、それぞれの証拠上の理由により非修正対象に保つ。
          - 修正対象には、要求または修正履歴から導ける理由と修正境界を記録する。未解消の問題は現在の修正対象として明確に残し、記録済み、新旧、重大度を理由に免除しない。修正対象が明示されていれば、別の停止判定やゲート用の文言までは要求しない。

  - description: '裁定: 同じ原因を持つ別経路の重複指摘を統合する'
    vars:
      task: file://../../cases/review-adjudication-problem-merge-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: review/existing-problem-merge
        value: |
          ARCH-NEW-channel-normalization-L2 と CODE-NEW-channel-normalization-L2 が、同じ原因と受入条件を持つ重複指摘として1つの修正対象へ統合されている場合だけ合格とする。ARCH-NEW-channel-type-error-L2 は漏れなく検討するが、タスクは不正な文字列の即時失敗だけを要求し、文字列以外の値に安定したエラークラスやメッセージを要求しないため修正対象にしない。

  - description: '裁定: 同じ担当箇所にある別の条件を分離する'
    vars:
      task: file://../../cases/review-adjudication-problem-separation-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: review/different-condition-separation
        value: |
          ARCH-NEW-channel-type-error-L2 を修正対象として漏れなく扱い、受理値の正規化とは異なるエラー形式の要件として別の修正単位に分けた場合だけ合格とする。normalizeChannel という担当箇所が共通することだけを統合根拠にしてはならない。
