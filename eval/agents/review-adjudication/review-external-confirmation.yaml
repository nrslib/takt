# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "review-external-confirmation: 外部確認と現在の修正対象を区別する"
prompts:
  - label: review-external-confirmation-runtime
    raw: file://../../prompts/review-external-confirmation-runtime.phase1.j2
    config:
      working_dir: fixtures/review-external-confirmation/runtime
      required_snapshots:
        - .takt/eval-snapshots/review-external-confirmation-runtime-policies.md
  - label: review-external-confirmation-webhook
    raw: file://../../prompts/review-external-confirmation-webhook.phase1.j2
    config:
