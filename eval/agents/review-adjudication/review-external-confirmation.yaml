  - label: review-external-confirmation-human-approval
    raw: file://../../prompts/review-external-confirmation-human-approval.phase1.j2
    config:
      working_dir: fixtures/review-external-confirmation/human-approval
      required_snapshots:
        - .takt/eval-snapshots/review-external-confirmation-human-approval-policies.md
  - label: review-external-confirmation-partial-repair
    raw: file://../../prompts/review-external-confirmation-partial-repair.phase1.j2
    config:
      working_dir: fixtures/review-external-confirmation/partial-repair
