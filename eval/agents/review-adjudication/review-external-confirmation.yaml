  - label: review-external-confirmation-stale-success
    raw: file://../../prompts/review-external-confirmation-stale-success.phase1.j2
    config:
      working_dir: fixtures/review-external-confirmation/stale-success
      required_snapshots:
        - .takt/eval-snapshots/review-external-confirmation-stale-success-policies.md
  - label: review-external-confirmation-code-failure
    raw: file://../../prompts/review-external-confirmation-code-failure.phase1.j2
    config:
      working_dir: fixtures/review-external-confirmation/code-failure
      required_snapshots:
        - .takt/eval-snapshots/review-external-confirmation-code-failure-policies.md
  - label: review-external-confirmation-ungrounded
    raw: file://../../prompts/review-external-confirmation-ungrounded.phase1.j2
    config:
