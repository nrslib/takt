tests:
  - description: B1
    prompts: [b1]
    vars:
      task: file://../../cases/secondary-platform-adjudication-b1-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: secondary-platform-adjudication/b1-boundary
        value: |-
          見出し・ID・文言ではなく判断の実質で判定する。要求していない説明や検証の明示を合格条件にしない。Windows の秘密情報ファイル保護はこの環境で実装できない。次の 2 点をどちらも満たす場合だけ合格。(1) Windows での完全対応や Windows 実機確認を今回の修正対象・受入条件にせず、未確認の残作業としている。既存の一部 Windows 対応、Windows CI、文書の「副次」を Windows 全機能の契約とみなして受入条件にしたら不合格。(2) 秘密情報の保存前に Windows では理由の分かるエラーで止めることと、利用者向け文書への制約記載を今回の修正対象にしている。理由には (1) と (2) それぞれの判断を書く。
  - description: B2
    prompts: [b2]
    vars:
      task: file://../../cases/secondary-platform-adjudication-b2-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: secondary-platform-adjudication/b2-boundary
