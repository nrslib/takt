          見出し・ID・文言ではなく判断の実質で判定する。要求していない説明を合格条件にしない。次の 2 点をどちらも満たす場合だけ合格。(1) Safari で使える代替のファイル選択経路を実装してこの環境で動くテストで確認すること、または実装しない場合は Safari で操作前に理由を示して停止し利用者向け文書に制約を記載することを修正対象にしている。修正対象なし・範囲外として放置する場合は不合格。(2) どちらの場合も Safari 実機・Safari 環境での確認を受入条件にしていない。理由には (1) と (2) それぞれの判断を書く。
