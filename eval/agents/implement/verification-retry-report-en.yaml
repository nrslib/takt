# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT implementation report (en): preserve attempted method, result, constraint, and uncertainty'

prompts:
  - file://../../prompts/verification-retry-report-en.phase2.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: ../../fixtures/verification-retry-routing
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

tests:
  - description: 'implementation report: attempted external verification remains unconfirmed'
    vars:
      previous_response: |
        Original requirement and accepted contract: trim and sort labels, verify locally, and confirm the result on the designated external display. Local implementation in src/labels.mjs and test in tests/labels.test.mjs match the requirement; `npm run test:local` exited 0 for the current fixture.
        The external display check is mandatory but unverified. Direct connection, existing relay, and display import endpoint were attempted with different inputs and mechanisms. Each failed because the administrator-confirmed receiving service is stopped. The evidence records those execution conditions and results. Only the external administrator can restore the service. A renamed command or log path uses the same failed service state; there is no effective new project-local work. Do not infer display success or waive the obligation.
    assert:
      - type: llm-rubric
        metric: verification-retry/report-uncertainty
        value: |
          Judge the evidence in the actual implementation report. Pass only if it records the attempted direct, relay, and import methods with the execution conditions actually supplied in the case, their failed results, and the common confirmed constraint; separates successful local implementation and test evidence from unverified external display behavior; keeps the external check mandatory; and records that renaming a command or log does not create an effective new attempt. Individual input values or commands not supplied in the case may remain explicitly unconfirmed and must not be invented. Fail if it marks the external obligation Verified or successful, omits the attempted-method history, claims final completion, or invents a project-local fix for the administrator-controlled outage.
