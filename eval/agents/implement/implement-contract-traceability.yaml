# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT facet eval: implementation preserves the plan contract ledger across reordered work'

prompts:
  - file://../../prompts/implement-contract-traceability.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: ../../.work/implement-contract-traceability
      sandbox_mode: workspace-write
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: 'implement: preserve contract identity when tests and work are ordered differently from the plan'
    vars:
      task: file://../../cases/implement-contract-traceability-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: implement/contract-behavior
        value: file://../../asserts/implement-contract-traceability.mjs
      - type: llm-rubric
        metric: implement/contract-identity
        value: |
          Judge semantic contract identity, not headings or exact wording. Pass only if the work result carries forward every upstream contract with its original meaning: CTR-01 preserves letter case and internal whitespace, CTR-02 removes surrounding whitespace, CTR-03 converts whitespace-only input to an empty string, and TEST-DISC-01 preserves the existing rejection of non-string input with a TypeError. TEST-DISC-01 must remain identified as newly discovered during testing from existing behavior rather than being presented as a plan contract. The response must make every ID-to-obligation mapping available to the later report phase and must not renumber or repurpose them according to test order, implementation order, or evidence order.

          Fail if any upstream contract is omitted, assigned another contract's meaning or origin, or represented only by an undifferentiated broad test-suite pass.
