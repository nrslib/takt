description: "実装完了・再計画: 実runと同じ構造化応答によるスコープ判定"
prompts:
  - file://../../completion-routing-prompt.mjs
providers:
  - id: openai:codex-sdk
    label: codex-astra-xhigh-structured
    config:
      model: gpt-6-astra
      model_reasoning_effort: xhigh
      working_dir: ../../fixtures/remediation-evidence
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      output_schema:
        type: object
        properties:
          step:
            type: integer
            minimum: 1
            maximum: 6
          reason:
            type: string
        required:
          - step
          - reason
        additionalProperties: false
evaluateOptions:
  maxConcurrency: 2
defaultTest:
  vars:
    language:
      - ja
      - en
    workflow: development-implement-dynamic
    judgment_mode: structured
  assert:
    - type: javascript
      value: file://../../asserts/completion-routing.mjs
tests:
  - file://../../cases/completion-scope-routing.yaml
  - file://../../completion-input-request-cases.mjs
