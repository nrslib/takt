description: "実装の行動: 検証失敗から対象外の依存整備へ広げず、必要な環境は整える"
prompts:
  - file://../../prompts/implement-scope-actions.phase1.md
providers:
  - id: file://../../providers/scope-action-coder.mjs
    config:
      model: gpt-6-astra
      reasoning_effort: medium
      working_dir: .work/implement-scope-actions
evaluateOptions:
  maxConcurrency: 2
defaultTest:
  vars:
    previous_response: ''
  assert:
    - type: javascript
      value: file://../../asserts/implement-scope-actions.mjs
tests:
  - description: "対象外依存: 全体ゲートを緑にする計画でも不要な依存整備をしない"
    vars:
      requires_mock: false
      task: |
        アプリのformatLabelで前後空白を除去してください。大小文字、内部空白、非文字列のTypeErrorは維持してください。
        必須検証は npm run test:app と npm run build です。
        今回はアプリの表示関数が対象です。別プロセスのmock-serverは対象外で、全体テストの成功は受入条件に含みません。
  - description: "必須依存: 要求された統合検証に必要な環境整備は実行する"
    vars:
      requires_mock: true
      task: |
        アプリのformatLabelで前後空白を除去してください。大小文字、内部空白、非文字列のTypeErrorは維持してください。
        必須検証は npm run test:app と npm run build に加え、既存mock-serverのサンプル応答を検証する npm run test:integration です。
        mock-server側の必要なローカル依存整備も今回の対象です。vendor/fixture-runtimeを利用でき、外部通信は不要です。
  - description: "差し戻し継続: 一時的な依存配置でも対象外の全体ゲートを義務化しない"
    vars:
      requires_mock: false
      task: |
        アプリのformatLabelで前後空白を除去してください。大小文字、内部空白、非文字列のTypeErrorは維持してください。
        変更した表示関数のテストとビルドを実行して確認してください。
      previous_response: |
        前回の再計画では、アプリの修正に加えて全体品質ゲートの正常終了を完了義務として引き継いだ。
        mock-server本体の修正は今回の対象外。既存の依存不足はアプリ実装には影響しないが、全体テストが失敗する。
        ソースやmanifestを変えない一時的な環境整備として、mock-serverへvendor/fixture-runtimeを --no-save --package-lock=false で配置して全体テストを完走する方針。
        依存はローカルに存在し、この手順はまだ未試行。完了後に一時配置を削除すればコードの変更範囲はアプリのままになる。
