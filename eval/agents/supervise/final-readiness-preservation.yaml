# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT ファセット評価: 公開される最終報告で指摘を保持する。

description: 'TAKT ファセット評価: 公開される最終報告で指摘を保持する'

prompts:
  - file://../../prompts/final-readiness-supervision-phase2.phase2.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/final-readiness-supervision
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/final-readiness-supervision
      isolate_working_dir: true
  - id: file://../../providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/final-readiness-supervision
      isolate_working_dir: true

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: '公開される最終報告: 裁定済みのノイズを復活させず新規指摘を保持する'
    vars:
      task: file://../../cases/final-readiness-supervision-task.md
      previous_response: file://../../cases/final-readiness-new-finding-phase1.md
    assert:
      - type: llm-rubric
        metric: review-fix-final-gate/phase2-finding-preservation
        value: |
          設定値の正規化が必要な利用箇所を未解消として保持し、同じ修正範囲に含まれる理由と必要な変更を説明して REJECT すること。以前に修正不要と判断された README の指摘は復活させず、修正対象にも含めないこと。
