# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: peer-review / ai-antipattern-review-2nd (codex).
# Run via npm run eval:prompts -- antipattern

description: 'TAKT facet eval: peer-review / ai-antipattern-review'

prompts:
  - file://../../prompts/antipattern-review.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: ../../fixtures/sample-project
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: 'recall: planted AI antipatterns must be flagged'
    vars:
      task: file://../../cases/antipattern-retry.md
      previous_response: file://../../cases/prev-gather-antipattern.md
    assert:
      - type: javascript
        metric: recall/unwired-options
        value: |
          return /(options|retries|strategy)/i.test(output) &&
            /(渡され|呼び出し元|caller|常に|フォールバック|fallback|配線|wired|未使用|使われて)/i.test(output);
      - type: javascript
        metric: recall/overengineered-abstraction
        value: |
          return /(RetryStrategy|Strategy|抽象)/i.test(output) &&
            /(過剰|不要|単一|余計|overengineer|YAGNI|1つ|一つ|唯一)/i.test(output);
      - type: javascript
        metric: recall/redundant-branch
        value: |
          return /(logSyncResult|分岐|branch)/i.test(output) &&
            /(同じ|同一|冗長|redundant|重複|不要)/i.test(output);
  - description: 'recall: read-boundary compatibility without requirement must be rejected'
    vars:
      task: file://../../cases/antipattern-implicit-compatibility.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: recall/implicit-backward-compatibility
        value: |
          Judge the review by its decision and reasoning, not by exact wording. Pass only if it reports the legacy iteration-namespace parser as a blocking issue because the task replaces that namespace and does not explicitly require backward compatibility. The review must require removal of the legacy regex and conversion branch rather than accepting them because they are isolated at a read boundary, protect persisted data, or appear low risk.

          Fail if it approves the change, treats the compatibility path as acceptable or non-blocking, or infers a migration obligation solely from the existence of old persisted records, an external format, current code, or tests.
  - description: 'precision: explicitly required coexistence remains scoped support'
    vars:
      task: file://../../cases/explicit-coexistence-support.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: precision/explicit-coexistence
        value: |
          Judge the review by its decision and reasoning, not by exact wording. Pass only if it verifies that new records are written only with the `call-path:` namespace and the reader restores both `call-path:` and `iteration-<n>--step-<name>` records. Fail if any required behavior is missing or the coexistence scope expands beyond reading resume records.

          Do not report the legacy iteration-namespace reader as unauthorized compatibility, because the requirement explicitly requires both old and new resume records to be readable. Do not require a deadline, deprecation period, removal condition, or migration schedule that the requirement source does not request.

          The review must keep that authority scoped to resume-record reading. It must not infer a requirement for legacy writes, stored-record rewriting, data migration or backfill, API aliases, event upcasters, or Read Model rebuilds. Fail if it demands removal of the legacy reader solely because it is legacy support, or if it treats the coexistence requirement as authority for any unrequested support target.
