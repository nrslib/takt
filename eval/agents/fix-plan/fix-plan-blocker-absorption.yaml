description: 'TAKT ファセット評価: 修正で露出した型エラーを同じ修正単位の完了義務として計画する'

prompts:
  - file://../../prompts/fix-plan-blocker-absorption.phase1.md

providers:
  - id: file://../../providers/cli-plan-report.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/fix-plan-blocker-absorption
      isolate_working_dir: true
      report_prompt: prompts/fix-plan-blocker-absorption.phase2.md
  - id: file://../../providers/cli-plan-report.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/fix-plan-blocker-absorption
      isolate_working_dir: true
      report_prompt: prompts/fix-plan-blocker-absorption.phase2.md
  - id: file://../../providers/cli-plan-report.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/fix-plan-blocker-absorption
      isolate_working_dir: true
      report_prompt: prompts/fix-plan-blocker-absorption.phase2.md

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 1
  repeat: 3

tests:
  - description: '登録後の型検査 exit 2 を受け、確認のみの修正計画を見直す'
    vars:
      output_phase: phase1
      task: file://../../cases/fix-plan-blocker-absorption-task.md
      previous_response: file://../../cases/fix-plan-blocker-absorption-previous.md
    assert:
      - type: llm-rubric
        metric: fix-plan/blocker-absorption
        value: |
          Phase1 の実応答について、実装担当に渡す修正方針と境界を評価する。Phase2 の出力契約、記録欄、ポリシー規則名の記載は要求しない。
          次の条件をすべて満たす場合だけ合格とする。
          - 前回と実質同一の確認のみの計画を返さず、修正担当が型検査失敗で進めなかった理由に対する修正方針を示す。
          - 採用指摘 TEST-NEW-tsconfig-internal-agents-001 の登録修正で露出した型エラーの修正を、同じ修正単位の完了義務として計画し、src/__tests__/workflowExecutionBootstrapDirectResume.test.ts 本体を変更対象に含める。確認された attachWorkflowOpaqueRef の重複 import の修正に絞った計画でもよい。
          - 実 Codex の TOML 解決、Windows の実 spawn、watcher.test.ts の timing failure は裁定済みの除外として維持し、再採用しない。
          - 登録修正で問題がなくなったことを「前提の反証」と呼ばない。過去計画の誤りとして「反証」という語を引用・否定することは許容する。
          - このケースにはプロジェクト内の修正手段があるため、タスク全体の再計画や停止へ送らない。
          診断の網羅や追加診断の調査・修正の明記、元リポジトリの取得・再構成に関する制約文言など、fixture 固有の細部は要求しない。
          以下はいずれも不合格とする: 確認のみを返す、テスト本体を変更しない範囲に置く、型エラーを新規指摘として棚上げする、登録を取り消す・型検査設定を緩和することで失敗を回避する、登録修正による問題の消失を「前提の反証」と読み替える、解消可能なのに ABORT や全体再計画へ送る。

  - description: 'Phase1実応答を引き継いだ計画レポートが修正境界と持ち越しを記録する'
    vars:
      output_phase: phase2
      task: file://../../cases/fix-plan-blocker-absorption-task.md
      previous_response: file://../../cases/fix-plan-blocker-absorption-previous.md
    assert:
      - type: llm-rubric
        metric: fix-plan/blocker-absorption-report
        value: |
          採点対象はPhase1の実応答を引き継いで生成されたPhase2の修正計画レポートのみとする。
          次のD/F記録契約を両方満たす場合だけ合格とする。
          - D: 「留意点」欄に、現行の要求内で解消できない事項である元の17件全体の実証制約を、根拠・影響する受入条件・持ち越し先とともに記録する。これらの意味が伝わればよく、元リポジトリの取得・再構成を行わない制約など、特定の文言や fixture 固有の細部は要求しない。
          - F: 「修正境界の根拠となるポリシー規則」列に、境界判断を支える規則名を記録する。「即座修正」/「Fix immediately」が典型だが、それと同等の持ち越し規則でもよい。
          以下はいずれも不合格とする: 欄の見出しがあるだけ、確認のみの計画に戻す、テスト本体を変更しない範囲に置く、修正可能な型エラーを新規指摘として棚上げ・持ち越しする、登録を取り消す・型検査設定を緩和することで失敗を回避する、登録修正による問題の消失を「前提の反証」と読み替える、解消可能なのに停止や全体再計画へ送る。過去計画の誤りとして「反証」という語を引用・否定することは許容する。
