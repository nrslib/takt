# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT facet eval: held-out artifact path planning'

prompts:
  - file://../../prompts/fix-plan-impact-closure-heldout.phase1.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/project-lantern
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model: gpt-5.6-luna
        model_reasoning_effort: high

evaluateOptions:
  maxConcurrency: 1
  repeat: 1

tests:
  - description: 'unseen artifact structure is planned without inventing scope'
    vars:
      task: file://../../cases/fix-plan-impact-closure-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: fix-plan/impact-closure-heldout
        value: |
          候補の計画本文と fixture の実装だけを評価する。主ケースの語彙や表形式は要求しない。

          `PATH-002` について、`buildArtifact(projectRoot, currentSettings)` を実在する入口として次の独立した観測を計画へ落としている場合だけ合格とする。

          - `settings.source` → `loadInput` → input値
          - inputのdocument_id/itemsと `settings.documentLabel` → `renderDocument` → document.label/content
          - `settings.sections` → sort → sectionsの順序
          - document.content と `settings.indexPath` → `writeIndex` → 実際に書かれたindex file

          各観測に、根拠となるファイルと関数、具体的な入力または設定、入口から結果までの接続、期待結果、問題が残れば失敗する具体的な検証が必要である。4経路それぞれについて、その経路が読む source、documentLabel、sections、indexPath のいずれか1条件だけを変え、同じ `buildArtifact` 入口から対応する観測結果の違いを確認すること。helperの直接呼び出しだけで済ませず、変更が必要な共有箇所と、変更せず確認する経路を区別すること。存在しないlocale、provider、retry、互換形式、出力先を追加する、source/render/writeを一つの抽象的な「artifact経路」で代用する、または書き込みを戻り値だけで確認する場合は不合格とする。
