# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Provenance: eval/docs/pr1513-static-path-audit.md (not copied to the candidate fixture).
description: 'TAKT ファセット評価: static dependency closure / artifact path B'

prompts:
  - file://../../prompts/fix-plan-static-path-audit-b.phase1.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/fix-plan-static-path-audit-b
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model: gpt-5.6-luna
        model_reasoning_effort: high

evaluateOptions:
  maxConcurrency: 1
  repeat: 1

tests:
  - description: '計画監査: レポート契約と生成・統合 artifact の静的依存閉包'
    vars:
      task: file://../../cases/fix-plan-static-path-audit-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: fix-plan-static-path-audit-b/path-closure
        value: |
          候補の計画本文だけを採点し、fixture 外の知識や表面的なキーワード一致は採点根拠にしない。fixture に実在し、この suite の対象である4経路を、別々の監査単位として扱うこと。存在しない path、fixture にない consumer、対象外の機能、または「全て確認する」「設定をテストする」のような包括語で具体的経路を代用した場合は不合格とする。

          各経路について、source path と正本定義、input/state、entry から consumer / terminal までの実呼出し順、期待結果、具体的な falsification（変更または負の入力で失敗を観測する方法）を個別に記載している場合だけ合格とする。

          1. report order 経路: `src/schema.js` の `output_contracts.report` を正本として特定し、`src/loader.js`、`src/planner.js`、`src/report-consumer.js` の `orderReportContracts` へ至る呼出しを追う。report collection の isolated variant を `orderReportContracts` に渡し、uniqueness filter がない現実装では duplicate membership が sorted terminal に保持されることを期待結果として示す。accidental dedupe または別の内容への alteration を失敗として検出する。omission variant では omitted member が terminal に再出現しないことを期待結果とし、order の入れ替え・欠落も個別に検出する falsification を示す。
          2. source path 経路: 実在する `artifacts/source.json` を `loadReportInput` が正本設定の source path から読み、planner を経て生成処理へ渡す input/state と terminal を示す。path の変更、ファイル欠落、別入力の混入で誤読を検出する falsification を示す。
          3. template 経路: 正本設定の template と source の report id が `expandReportTemplate` に入り、placeholder 展開済みの templatePath と本文が terminal に出る呼出しを追う。report id の変更、placeholder の消失、本文 entry の変更が生成物へ反映される falsification を示す。
          4. merge file 経路: `buildReportArtifact` から `mergeReportFile` へ進み、実際にディレクトリを作成して merge file へ rendered body を書く到達可能な consumer と生成ファイル terminal を示す。統合先の変更、書込み段階の省略、生成物の欠落を検出する falsification を示す。

          4経路の source/input/entry-terminal/falsification のどれかが欠ける、または設定項目を列挙するだけで実ファイル読込み・展開・書込みを追わない計画は不合格とする。
