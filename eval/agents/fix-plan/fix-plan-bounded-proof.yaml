          対象範囲、正常時・失敗時の結果、方式指定を保持する。事実の捏造、不要な問題の統合、非発火例での不要な方式変更・再計画・停止は不合格。
          「根本原因を直す」「共通化する」と述べても、以前と同じ前提で個別の入力・出口へ処理を足すだけなら不合格。共通前提を取り除く変更箇所と方式、および旧方式で失敗する条件と新方式の観測を具体化する。成功件数の転載だけでは不合格。
          採点対象は Phase 1 の実応答を引き継いだレポートのみ。判断根拠と履歴の固定版参照（履歴がない場合はその事実）を残す。
          比較した具体的な方式、選択理由、共通原因への対応、維持条件、変わる検証条件を記録する。非発火例は維持・通常修正の理由と現在の検証を示せばよい。
