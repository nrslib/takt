# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Provenance: eval/docs/pr1513-static-path-audit.md (not copied to the candidate fixture).
description: 'TAKT ファセット評価: static dependency closure / companion boundary C'

prompts:
  - file://../../prompts/fix-plan-static-path-audit-c.phase1.md

providers:
  - id: file://../../providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/fix-plan-static-path-audit-c
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model: gpt-5.6-luna
        model_reasoning_effort: high

evaluateOptions:
  maxConcurrency: 1
  repeat: 1

tests:
  - description: '計画監査: companion・引数・mode・package 境界の静的依存閉包'
    vars:
      task: file://../../cases/fix-plan-static-path-audit-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: fix-plan-static-path-audit-c/path-closure
        value: |
          候補の計画本文だけを採点し、fixture 外の知識や表面的なキーワード一致は採点根拠にしない。fixture に実在し、この suite の対象である4経路を、別々の監査単位として扱うこと。存在しない path、fixture にない consumer、対象外の機能、または「全て確認する」「周辺を確認する」のような包括語で具体的経路を代用した場合は不合格とする。

          各経路について、source path と正本定義、input/state、entry から consumer / terminal までの実呼出し順、期待結果、具体的な falsification（変更または負の入力で失敗を観測する方法）を個別に記載している場合だけ合格とする。

          1. direct companion 経路: `src/schema.js` の直接定義から `src/loader.js`、`src/planner.js`、`src/companion-consumer.js` の `resolveDirectCompanion` へ入り、name と entry が terminal になる経路を示す。name または entry の変更が結果へ届く falsification を示す。
          2. companion reference 経路: 正本の reference にある defaults と宣言済み args、入力の explicitArgs を、既定値適用と明示値上書きという別 state として追う。`resolveCompanionReference` が各引数を invocation terminal へ渡し、未宣言引数を拒否すること、default の変更・explicit 値の変更・欠落・未知引数を個別に反証できることを示す。
          3. capability mode 経路: 入力 mode が `resolveCapabilities` で workflow、normal、parallel の各分岐へ到達し、それぞれ正本の別集合を terminal に返すことを別々に示す。mode の取り違え、各集合の変更、unknown mode の拒否を個別に反証する。
          4. package-scoped facet 経路: package identity と facet name が `resolveScopedFacet` へ渡り、正本の package registry の選択内容が terminal になる経路を示す。同名 facet を持つ2 package を混同しないこと、unknown package と unknown facet を拒否する falsification を示す。

          4経路の source/input/entry-terminal/falsification のどれかが欠ける、または一つの companion 呼出し例・一つの mode・単一 registry の説明で他の経路を代用する計画は不合格とする。
