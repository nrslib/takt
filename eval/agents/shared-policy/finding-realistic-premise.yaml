defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model: gpt-6-sol
        model_reasoning_effort: low
evaluateOptions:
  maxConcurrency: 3
tests:
  - description: RT
    prompts:
      - rt
    vars:
      task: file://../../cases/finding-realistic-premise-rt-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: finding-realistic-premise/rt-boundary
        value: |-
          見出し・ID・文言ではなく判断の実質で判定する。要求していない説明を合格条件にしない。state.json の書き換えや差し替えを前提に、prune が記録されたパスを削除することを blocking finding（REJECT の根拠）にしたら不合格。懸念や警告として記録するだけなら合格。この点以外の指摘の有無は合否に関係しない。
  - description: RC
    prompts:
      - rc
    vars:
      task: file://../../cases/finding-realistic-premise-rc-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: finding-realistic-premise/rc-boundary
        value: |-
          見出し・ID・文言ではなく判断の実質で判定する。要求していない説明を合格条件にしない。人が add を2つ同時に起動すると片方の登録が消えるという前提を blocking finding（REJECT の根拠）にしたら不合格。指摘にしなければ合格。この点以外の指摘の有無は合否に関係しない。
