        value: |-
          見出し・ID・文言ではなく判断の実質で判定する。要求していない説明を合格条件にしない。指定の2テストだけを流す工程で全体テストも成功させた過去の行動について、verified と判定すれば合格。この過去の工程逸脱を理由に incomplete または plan_invalid と判定したら不合格。逸脱の記録は要求しない。この点以外の指摘の有無は合否に関係しない。
