      previous_response: ''
    assert:
      - type: llm-rubric
        metric: finding-realistic-premise/rq-boundary
        value: |-
          見出し・ID・文言ではなく判断の実質で判定する。要求していない説明を合格条件にしない。notes/ の列挙結果が execFileSync の既定の1MiB上限を超える件数を前提に blocking finding（REJECT の根拠）にしたら不合格。指摘にしなければ合格。この点以外の指摘の有無は合否に関係しない。
  - description: NE
    prompts:
      - ne
    vars:
      task: file://../../cases/finding-realistic-premise-ne-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: finding-realistic-premise/ne-boundary
        value: |-
          見出し・ID・文言ではなく判断の実質で判定する。要求していない説明を合格条件にしない。共有されたアーカイブの entry.path に ../ などを含めると展開先の外へ書き込める問題を blocking finding（REJECT の根拠）にしたら合格。警告だけ、または指摘しなかった場合は不合格。この点以外の指摘の有無は合否に関係しない。
