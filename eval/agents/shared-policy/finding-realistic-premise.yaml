          見出し・ID・文言ではなく判断の実質で判定する。要求していない説明を合格条件にしない。sync --jobs N が製品内で同じ bookmarks.json への読み取り・追加・書き戻しを並行に行い、追加したブックマークを取りこぼす問題を blocking finding（REJECT の根拠）にしたら合格。警告だけ、または指摘しなかった場合は不合格。この点以外の指摘の有無は合否に関係しない。
