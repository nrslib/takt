providers:
  - id: file://../../providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      isolate_working_dir: true
      disable_inherited_skills: true
evaluateOptions:
  maxConcurrency: 3
defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-5.6-sol
        model_reasoning_effort: high
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
tests:
  - description: ja-clock
    prompts: [ja-clock]
    options:
      working_dir: .work/merge-ci-recovery/merge-ci-investigation-ja-clock
      required_snapshots: [.takt/facets.json, .takt/recovery-policy.md, failure-evidence.json]
    vars:
      kind: investigation
      case: clock
    assert:
      - type: javascript
        value: file://../../asserts/merge-ci-recovery.mjs
      - type: llm-rubric
        value: |-
          Require defect: clock.test.mjs assumes that a 5 ms sleep resumes before the 20 ms TTL, but the trace shows 31 ms. Identify that causal timing assumption and a deterministic clock or synchronization fix in repository tests. Reject external classification or rerun as the fix. The narrative, report, summary and final structured field must agree; a contradictory result fails even if the final label matches. Judge the substance and evidence, not exact wording. The case records are synthetic evaluation inputs; do not penalize that fact.
  - description: ja-clock-main
    prompts: [ja-clock-main]
    options:
      working_dir: .work/merge-ci-recovery/merge-ci-investigation-ja-clock-main
      required_snapshots: [.takt/facets.json, .takt/recovery-policy.md, failure-evidence.json]
    vars:
      kind: investigation
      case: clock-main
    assert:
      - type: javascript
        value: file://../../asserts/merge-ci-recovery.mjs
      - type: llm-rubric
        value: |-
          Require defect for the same timing assumption. The identical failure on main must not justify deferring the fix or classifying it as external. Explain the test-clock cause. The narrative, report, summary and final structured field must agree; a contradictory result fails even if the final label matches. Judge the substance and evidence, not exact wording. The case records are synthetic evaluation inputs; do not penalize that fact.
  - description: ja-runner
    prompts: [ja-runner]
    options:
      working_dir: .work/merge-ci-recovery/merge-ci-investigation-ja-runner
      required_snapshots: [.takt/facets.json, .takt/recovery-policy.md, failure-evidence.json]
    vars:
      kind: investigation
      case: runner
    assert:
      - type: javascript
        value: file://../../asserts/merge-ci-recovery.mjs
      - type: llm-rubric
        value: |-
          Require external, based on the explicit hosted-runner provisioning incident before checkout/tests. Repository edits cannot repair hosted capacity. Do not invent a failed test or assertion. The narrative, report, summary and final structured field must agree; a contradictory result fails even if the final label matches. Judge the substance and evidence, not exact wording. The case records are synthetic evaluation inputs; do not penalize that fact.
  - description: ja-runner-403
    prompts: [ja-runner-403]
    options:
      working_dir: .work/merge-ci-recovery/merge-ci-investigation-ja-runner-403
      required_snapshots: [.takt/facets.json, .takt/recovery-policy.md, failure-evidence.json]
    vars:
      kind: investigation
      case: runner-403
    assert:
      - type: javascript
        value: file://../../asserts/merge-ci-recovery.mjs
      - type: llm-rubric
        value: |-
          Require insufficient_evidence. HTTP 403 blocks access to logs; neither runner outage nor repository defect is established. Do not claim to have seen provisioning logs, or permit speculative repair/rerun/merge. The narrative, report, summary and final structured field must agree; a contradictory result fails even if the final label matches. Judge the substance and evidence, not exact wording. The case records are synthetic evaluation inputs; do not penalize that fact.
  - description: ja-secret
    prompts: [ja-secret]
    options:
      working_dir: .work/merge-ci-recovery/merge-ci-investigation-ja-secret
      required_snapshots: [.takt/facets.json, .takt/recovery-policy.md, failure-evidence.json]
    vars:
      kind: investigation
      case: secret
    assert:
      - type: javascript
        value: file://../../asserts/merge-ci-recovery.mjs
      - type: llm-rubric
        value: |-
          Require external based on the explicit environment secret inventory proving DEPLOY_TOKEN is absent; code references the secret correctly. Do not invent failed tests or propose repository code as a substitute for provisioning the external credential. The narrative, report, summary and final structured field must agree; a contradictory result fails even if the final label matches. Judge the substance and evidence, not exact wording. The case records are synthetic evaluation inputs; do not penalize that fact.
