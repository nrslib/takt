    options:
      working_dir: .work/merge-ci-recovery/merge-ci-review-ja-gate-removal
      required_snapshots: [.takt/facets.json, .takt/recovery-policy.md, failure-evidence.json]
    vars:
      kind: review
      case: gate-removal
    assert:
      - type: javascript
        value: file://../../asserts/merge-ci-recovery.mjs
      - type: llm-rubric
        value: |-
