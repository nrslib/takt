# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT facet cross-eval: Codex keeps the primary Requeue-to-runner contract authoritative'

prompts:
  - file://prompts/review-adjudication-default-priority.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/review-adjudication-default-priority
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: medium

tests:
  - description: 'adjudication: Codex keeps the primary execution path authoritative'
    vars:
      task: file://cases/review-adjudication-default-priority-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: primary-requeue/adjudication-authority-codex
        value: file://asserts/review-adjudication-default-priority.mjs
