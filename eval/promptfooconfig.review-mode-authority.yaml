# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: 'TAKT facet eval: caller review mode authority and safe fallback'

prompts:
  - file://prompts/review-mode-authority.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/review-mode-authority
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

tests:
  - description: 'caller mode: resolve explicit, iteration fallback, and unknown cases safely'
    vars:
      task: file://cases/review-mode-authority.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: review-mode/domain-fallback-and-safe-ceiling
        value: |
          Judge the answer against the active review authority policy in the
          assembled prompt. Pass only if all cases are classified as follows:
          explicit initial -> initial; explicit follow_up -> follow_up;
          unspecified or absent at iteration 1 -> initial; unspecified or
          absent at iteration 2 -> follow_up; invalid caller mode or an
          unusable fallback iteration -> mode_unknown. It must apply the
          follow-up authority ceiling to unknown mode, refuse general initial
          discovery and adjacent-family findings, and refuse APPROVE based on
          claimed initial-coverage completion. Fail if casing, aliases, empty
          values, invalid scalar types, or an unexpanded iteration are
          normalized into a valid mode. The answer must not depend on a second
          authority source outside the caller and reviewer-step iteration.
