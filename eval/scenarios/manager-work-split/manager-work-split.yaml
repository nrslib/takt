          形式は JS で判定済み。JS が受理したコードフェンスを含む形式を再判定せず、内容だけを判断する。
          人が指定したテストの実行方法が、constraints の具体的な項目として残っている場合だけ合格。成果の条件は acceptanceCriteria に残す。途中は対象のテストファイルだけを npx vitest run --config <分類に合った config> <ファイル> で直接実行する。npm run test:types、npm run build、npm run lint はゴール全体の最後にまとめて1回、その後に追加・変更したテストを個別に実行する。heavy IT 全体（npm run test:it:heavy）と E2E 全体は実行しない。これらの区別とコマンド名を保ち、unit 全体や light IT 全体の恒久的禁止を作らない。message、objective、outOfScope、acceptanceCriteria に制約を書くだけでは不合格。要求された8項目と既存の動作を維持する条件も要約に残す。受け入れ条件の項目数は固定しない。登録・保存、起動時の選択、追加・削除、外部連携の範囲、一覧、存在しない配送先のエラー、現在の配送先の画面表示、説明の更新が意味として残っていれば、関連する変更を同じ受け入れ条件にまとめてよい。制約を残すために成果の条件を落としてはいけない。
  - description: "en: summary-keeps-constraint"
