          Pass only if the human's test-execution requirements appear as concrete items prefixed with 作業の制約: for Japanese or Work constraint: for English before result conditions: during work, directly run only targeted test files using npx vitest run --config <matching config> <file>; run npm run test:types, npm run build and npm run lint together once at the end of the whole goal; then run added/changed tests individually; do not run full heavy IT (npm run test:it:heavy) or full E2E. Preserve distinctions and command names without inventing a permanent prohibition of full unit/light IT. Mentioning them in message, objective or outOfScope alone fails. The eight requested changes and existing-behavior preservation must remain in the summary's meaning; do not trade them for constraints.
  - description: "ja: summary-keeps-constraint-web"
    vars:
