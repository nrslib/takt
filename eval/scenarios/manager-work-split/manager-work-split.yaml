          This patrol reads the latest booking CSV run plan. Targeted CSV tests pass; an existing activity history light integration test fails at this PC's terminal width and reproduces at the pre-task tip. The run plans to fix and restore test width and rerun the prescribed checks. Overlap with "test infrastructure" or "activity history screen" in the exclusions does not justify overriding this reasoned plan.
