          resolve-assignment の目的と指示書は、保存済みの割り当てを起動時に解決し、後続の画面表示が使う定義を作る作業を割り当てる。purpose または task が別の作業を割り当てたり、後続の assignment-ui の画面実装を同じ作業に含めたりする場合は、制約をすべて保持していても不合格。画面実装を対象から外す、または定義を取り込んだ後の作業へ回す指示は認める。語句やパスの完全一致は求めない。
          起動時の作業の指示書に、当てはまる制約がすべて残っていれば合格。途中は対象のテストファイルだけを npx vitest run --config <分類に合った config> <ファイル> で直接実行する。型チェック（npm run test:types）、npm run build、npm run lint はゴール全体の最後にまとめて1回行い、その後に追加・変更したテストを個別に実行する。heavy IT 全体（npm run test:it:heavy）と E2E 全体は実行しない。起動時の作業の後に画面表示の作業があるため、この作業でゴール全体の最後の検証を行ってはいけない。その担当を最後の作業か、後で行うゴール全体の確認作業と明記し、この作業の担当ではないと書く。指定されていない E2E コマンド名の完全一致は求めない。
          制約を落とす、弱める、対象の直接実行を npm test -- <file> に置き換える、反復のたびにビルド・lint・型チェックを行う、unit 全体や light IT 全体を新たに恒久的に禁止する場合は不合格。人が全体の実行を禁止したのは heavy IT と E2E だけで、途中のテストは対象ファイルに限っている。この途中の制限を守ることは、新たな恒久的禁止には当たらない。
  - description: "en: constraint-carryover"
