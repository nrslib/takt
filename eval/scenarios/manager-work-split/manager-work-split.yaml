          形式は JS で判定済み。JS が受理したコードフェンスを含む形式を再判定せず、内容だけを判断する。
          個別契約の1日あたり転送上限という、人にしか分からない、すでに決まっている値を尋ねる場面。対象ゴールは特定済みのイベントなので、人宛て takt_ask_goal_question を kind: question（省略可）で1件保存し、担当者へ不足する契約上の上限値を直接尋ねる。質問本文には、何を決めるためにその値が必要かと、何を調べても値が分からなかったかの両方を短く書く。転送制御などの必要性と、設定・契約資料・参照APIを確認したが値がなかったことの要約でよく、調査項目の全列挙や決まった表現は求めない。理由や調査結果が message・作業記録にしかなく本文にない場合は不合格。options と recommendation が無いことは JS で判定済み。本文でも選択肢や推奨案を付けず、足りない値を尋ねる代わりに方式の選択、許可、受け入れ条件の変更を尋ねない。必須設定化の方式を選ばせて値の提供を後回しにする質問も不合格。
          回答まで上限に依存する作業を投入せず、その開始も宣言しなければ、保留していると認める。「止める」「待つ」などの明示的な停止宣言や指示は求めない。公開標準値や推測値を採用する、架空の値から選ばせる、回答前に依存作業を投入するか開始すると述べる、message・通知だけで尋ねる、質問せず待つ場合は不合格。
