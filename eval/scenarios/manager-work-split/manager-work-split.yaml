          投入された両作業の指示書に、当てはまる制約を残す。途中は対象のテストファイルだけを直接実行し、型チェック・ビルド・lint はゴール全体の最後に1回、変更したテストは個別に実行、heavy IT 全体と E2E 全体は実行しない。全体の検証は、ほかの成果をすべて取り込んだ後のゴール用ブランチで1回だけ行うよう担当を決める。担当は取り込み後に投入する確認作業か、すべての取り込み後に開始する作業にする。このターンで同時に投入する両作業には、自分は全体の検証を行わないことを明記する。後で行う担当は指示書と判断記録から確認する。
          全体検証を両成果の取り込み後に投入する確認作業へ回すことが、指示書と判断記録を合わせて分かれば合格。両指示書にはこの作業が全体検証を担当しないことを残す。担当は「全成果の取り込み後の最終検証」「後続の結合後確認」のような役割で指定してよく、固有の作業キーや担当者名は求めない。その確認作業を今の calls に入れる必要はない。今すぐ投入すると、ほかの成果を含まない状態で始まるためである。
          本番では実行開始時にゴール用ブランチをコピーするため、同時投入する一方に「もう一方の取り込みを待つ」と指示してもコピーは更新されない。その指示や、同時投入するいずれかへの全体検証の割り当て、両方が自分の終了時に全体検証を行う割り当ては不合格。message の説明だけでは指示書への担当の割り当てにならない。
          内容も workKey と一致する必要がある。ping-log は ping のログに requestId を追加し、users-paging は利用者 API にカーソルによるページングを追加する。purpose または task が別の作業を割り当てる、両作業をまとめる、未完成の別作業の成果を必要とする場合は不合格。別作業を対象から外すか後に回す指示はよい。unit 全体や light IT 全体の恒久的禁止を作ってはいけないが、途中のテストを対象だけに限る制約は守る。
  - description: "en: constraint-once"
