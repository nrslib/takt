          人が指定したテストの実行方法が、成果の条件より前に「作業の制約:」で始まる具体的な項目として残っている場合だけ合格。途中は対象のテストファイルだけを npx vitest run --config <分類に合った config> <ファイル> で直接実行する。npm run test:types、npm run build、npm run lint はゴール全体の最後にまとめて1回、その後に追加・変更したテストを個別に実行する。heavy IT 全体（npm run test:it:heavy）と E2E 全体は実行しない。これらの区別とコマンド名を保ち、unit 全体や light IT 全体の恒久的禁止を作らない。message、objective、outOfScope に書くだけでは不合格。要求された8項目と既存の動作を維持する条件も要約に残す。制約を残すために成果の条件を落としてはいけない。
  - description: "en: summary-keeps-constraint"
