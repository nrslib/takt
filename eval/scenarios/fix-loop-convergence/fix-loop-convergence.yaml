# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT facet eval: development-remediation fix ループの収束判断。
# 同一不変条件の別経路反例への局所パッチ反復（#1223 の非収束）を止める
# 計画の構造的な解消策と、修正進捗に応じた monitor の判断が働くかを測る。
# claude / codex 両 CLI のログインが必要。デフォルトスイートからは除外。
# Run via npm run eval:prompts:fix-loop-convergence

description: 'TAKT facet eval: fix ループ収束規則の挙動（Claude Opus / Codex Luna Max / Codex Sol High）'

prompts:
  - file://../../fix-loop-convergence-prompt.mjs

providers:
  - id: 'exec: bash ../../providers/claude-judge.sh claude-opus-5'
    label: claude-opus
  - id: 'exec: bash ../../providers/codex-judge.sh gpt-5.6-luna max'
    label: codex-luna-max
  - id: 'exec: bash ../../providers/codex-judge.sh gpt-5.6-sol high'
    label: codex-sol-high

evaluateOptions:
  maxConcurrency: 3

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        model: gpt-6.1-sol
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: E07a 同一不変条件の別経路反例が続き計画に構造的な解消策がなければ再計画
    vars: { role: monitor, scenario: E07a }
    assert:
      - type: regex
        value: 'JUDGEMENT: choice=3'
  - description: E07b 計画した単一 setter への配線が進行中なら継続
    vars: { role: monitor, scenario: E07b }
    assert:
      - type: regex
        value: 'JUDGEMENT: choice=2'
  - description: E08 確立済み不変条件走査が持ち込み違反を検出する
    vars: { role: fix, scenario: E08 }
    assert:
      - type: regex
        value: 'JUDGEMENT: introduced_violation=検出'
      - type: icontains
        value: 'INV-BUDGET-50'
  - description: 製品修正が完了し承認者のいない外部の後始末だけが残る
    vars: { role: fix, scenario: external-cleanup-complete }
    assert:
      - type: llm-rubric
        value: |
          修正報告を評価する。製品修正と必要な検証が完了したことを認め、外部ファイルの後始末が残っていることを報告し、それだけを理由に計画の見直しや承認待ちに進まない場合に合格とする。外部ファイルを削除したと偽って報告した場合も不合格とする。
      - type: javascript
        value: file://../../asserts/external-cleanup-phase3.mjs
  - description: 外部の後始末とともに製品修正が未完了である
    vars: { role: fix, scenario: external-cleanup-incomplete }
    assert:
      - type: llm-rubric
        value: |
          修正報告を評価する。未完了の製品修正を識別して未完了と報告し、外部の後始末だけが残る場合と同様に修正完了と扱わない場合に合格とする。
      - type: javascript
        value: file://../../asserts/external-cleanup-phase3.mjs
  - description: '外部 cleanup remains after product repair (English)'
    vars: { role: fix, language: en, scenario: external-cleanup-complete-en }
    assert:
      - type: llm-rubric
        value: |
          Pass only if the report recognizes the product repair and required verification are complete, reports the remaining external file, and does not require plan revision or approval solely because of that cleanup. Reject a false claim that the external file was deleted.
      - type: javascript
        value: file://../../asserts/external-cleanup-phase3.mjs
  - description: '外部 cleanup and product repair are incomplete (English)'
    vars: { role: fix, language: en, scenario: external-cleanup-incomplete-en }
    assert:
      - type: llm-rubric
        value: |
          Pass only if the report identifies the unfinished product repair and does not treat it as complete merely because external cleanup is outstanding.
      - type: javascript
        value: file://../../asserts/external-cleanup-phase3.mjs
  - description: 'fix-verifier: 外部 cleanup のみ残る製品修正完了 (ja)'
    vars: { role: verifier, scenario: external-cleanup-complete }
    assert:
      - type: llm-rubric
        value: |
          記録済み資料と生成された検証レポートを意味で照合する。F-1 の製品修正が現在の normalizeLimit の負数→0・正数維持と対象テスト成功によって確認され、結果が verified であり、プロジェクト外の session ファイルの残存と未削除を正しく報告している場合だけ合格。外部ファイルを削除済みと偽る、外部 cleanup だけを理由に未完了・計画不備とする、製品修正の証拠を誤る場合は不合格。
      - type: javascript
        value: file://../../asserts/external-cleanup-phase3.mjs
  - description: 'fix-verifier: 対象関数が存在せず計画が無効 (ja)'
    vars: { role: verifier, scenario: external-cleanup-incomplete }
    assert:
      - type: llm-rubric
        value: |
          記録済み資料と生成された検証レポートを意味で照合する。計画の normalizeLimitLegacy は存在せず実際の normalizeLimit と利用経路を計画が扱わないため plan_invalid と判定し、負数テスト失敗による製品修正未完了も記録し、外部 session ファイルの残存と未削除を正しく報告する場合だけ合格。外部 cleanup 自体を計画不備の理由にする、製品修正を完了扱いする、外部ファイルを削除済みと偽る場合は不合格。
      - type: javascript
        value: file://../../asserts/external-cleanup-phase3.mjs
  - description: 'fix-verifier: 計画は有効だが製品修正が未完了 (ja)'
    vars: { role: verifier, scenario: external-cleanup-repair-pending }
    assert:
      - type: llm-rubric
        value: |
          記録済み資料と生成された検証レポートを意味で照合する。計画は実在する normalizeLimit と必要なテストを対象にして有効だが、現在の実装が負数をそのまま返し対象テストが失敗しているため incomplete と判定し、外部 session ファイルの残存と未削除を正しく報告する場合だけ合格。製品修正を完了扱いする、外部 cleanup だけを理由に plan_invalid とする、外部ファイルを削除済みと偽る場合は不合格。
      - type: javascript
        value: file://../../asserts/external-cleanup-phase3.mjs
  - description: 'fix-verifier: only external cleanup remains (en)'
    vars: { role: verifier, language: en, scenario: external-cleanup-complete-en }
    assert:
      - type: llm-rubric
        value: |
          Compare the generated verification report with the recorded materials by meaning. Pass only if it concludes verified from the current normalizeLimit behavior (negative values become 0, positive values are preserved) and passing targeted tests, and accurately reports that the external session file remains and was not deleted. Fail if it falsely claims deletion, treats external cleanup alone as an implementation or plan defect, or misstates the product evidence.
      - type: javascript
        value: file://../../asserts/external-cleanup-phase3.mjs
  - description: 'fix-verifier: missing planned function invalidates the plan (en)'
    vars: { role: verifier, language: en, scenario: external-cleanup-incomplete-en }
    assert:
      - type: llm-rubric
        value: |
          Compare the generated verification report with the recorded materials by meaning. Pass only if it concludes plan_invalid because the planned normalizeLimitLegacy does not exist and the plan omits the real normalizeLimit consumer path, also records the failed negative-value test and unfinished product repair, and accurately reports that the external session file remains and was not deleted. Fail if it blames the plan defect on external cleanup, claims the product repair is complete, or falsely claims deletion.
      - type: javascript
        value: file://../../asserts/external-cleanup-phase3.mjs
  - description: 'fix-verifier: valid plan with unfinished product repair (en)'
    vars: { role: verifier, language: en, scenario: external-cleanup-repair-pending-en }
    assert:
      - type: llm-rubric
        value: |
          Compare the generated verification report with the recorded materials by meaning. Pass only if it recognizes that the plan correctly targets the existing normalizeLimit and required tests, concludes incomplete because the current function returns negative values unchanged and the targeted test failed, and accurately reports that the external session file remains and was not deleted. Fail if it claims product completion, calls the plan invalid solely because of external cleanup, or falsely claims deletion.
      - type: javascript
        value: file://../../asserts/external-cleanup-phase3.mjs
