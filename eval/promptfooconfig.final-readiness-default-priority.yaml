# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT facet eval: final gate restores the primary Requeue-to-runner contract'

prompts:
  - file://prompts/final-readiness-default-priority.phase1.md

providers:
  - id: 'exec: bash providers/claude-review.sh opus fixtures/final-readiness-default-priority'
    label: claude-opus

tests:
  - description: 'final gate: a secondary-path rationale cannot lock in a broken primary execution path'
    vars:
      task: file://cases/final-readiness-default-priority-task.md
      previous_response: ''
    assert:
      - type: javascript
        metric: primary-requeue/final-gate-recovery
        value: file://asserts/final-readiness-default-priority.mjs
