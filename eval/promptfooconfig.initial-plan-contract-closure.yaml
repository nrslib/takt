# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'TAKT facet eval: initial plan traces completion contracts without over-expanding impact paths'

prompts:
  - file://prompts/initial-plan-contract-closure.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/initial-review-contract-discovery
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

tests:
  - description: 'initial plan: inventory public projections and collision-safe persisted identity'
    vars:
      task: file://cases/initial-plan-contract-closure-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: plan/changed-contract-closure
        value: |
          Judge the plan by its executable meaning, not by headings, identifier format, table shape, or exact wording. Pass only when all of the following are true:

          - It assigns stable, reusable identifiers to at least two distinct changed-contract families and uses those identifiers to connect requirements, implementation scope, and verification work.
          - It traces the public projection contract through every relevant producer and consumer in the fixture, including preview, doctor, summary, the list-command entry point and its separately named catalog-row projection, and their shared test coverage, without assuming that a shared helper alone proves every caller.
          - It identifies same-responsibility paths from definitions, references, and actual callers rather than relying only on familiar file names, and classifies each existing projection path as requiring an update, contractually out of scope, or unchanged with evidence.
          - It traces execution identity through every relevant creator, derived key, persistence, checkpoint, event, and restore/resume participant in the fixture.
          - It includes a concrete counterexample where two distinct logical executions could be confused by a non-injective identifier representation, and plans verification that rejects that counterexample.
          - It includes a continuous persistence-to-restoration or resumption scenario that proves the same logical execution keeps its identity across the lifecycle.
          - It requires evidence through real production entry paths, not only isolated helpers or a broad test-suite pass.
          - It preserves the existing ordinary executable-task behavior and plans regression evidence for it.

          Fail if any participant or lifecycle segment is omitted, if the plan lists only local edits without cross-boundary verification, or if it treats planned code or existing tests as sufficient proof without identifying the relevant scenario and assertion.

  - description: 'initial plan: keep a local output-format change local'
    vars:
      task: file://cases/initial-plan-local-contract-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: plan/local-contract-precision
        value: |
          Judge the plan by its executable meaning, not by headings, identifier format, table shape, or exact wording. Pass only if it assigns a stable contract identifier to the requested formatting behavior, preserves the numeric attempt value, and plans the direct source and unit-test changes needed to reject the old colon-separated result. The plan may mention an explicit no-change obligation for unrelated behavior, but it must keep the implementation local to formatAttempt and its test.

          Fail if it invents persistence, restoration, authorization, concurrency, migration, compatibility layers, new abstractions, or changes to unrelated node, job, checkpoint, event, or projection modules. Also fail if it expands the local function-to-test relationship into a multi-boundary impact path, or if it treats a broad suite pass as the only evidence for the formatting contract.

  - description: 'initial plan: preserve requirement authority and allowed implementation choices'
    vars:
      task: file://cases/initial-plan-requirement-provenance-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: plan/requirement-provenance
        value: |
          Judge the plan by its executable meaning rather than exact wording or table shape. Pass only when all of the following are true:

          - It preserves every product obligation from requirements/export-limit.md: optional limiting, unchanged no-limit behavior, input order, and rejection of negative and non-integer limits.
          - It preserves line-based and grouped presentation as allowed alternatives. The plan may select either after inspecting the code, but it must treat that selection as an implementation decision rather than an explicit or implied product requirement.
          - It treats the existing grouped-export module, current implementation, tests, and architecture guidance as implementation evidence or constraints, not as authority for new product requirements.
          - Every completion obligation can be traced to the product requirement or to an existing observable behavior that the product requirement says to preserve.
          - It plans direct behavioral evidence for the limit boundary and invalid values through the public exportReport entry point.

          Fail if it says grouped output, a new abstraction, a particular internal type or helper, or replacement of the existing presentation is required by the product source. Also fail if it omits a stated obligation, narrows an allowed choice into acceptance criteria, expands into unrelated persistence or concurrency work, or treats a broad suite pass as the only completion evidence.

  - description: 'initial plan: do not invent backward compatibility for a replaced format'
    vars:
      task: file://cases/initial-plan-no-implicit-compatibility-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: plan/no-implicit-backward-compatibility
        value: |
          Judge the plan by its executable meaning, not by exact wording or table shape. Pass only if it plans to replace both write and read paths with the new call-path namespace, migrate current in-repository callers and fixtures, remove the old iteration parser or fallback, and verify the new behavior directly.

          - It plans a positive behavioral scenario that persists a resume record, restores it in a later execution, and proves that the same logical workflow-call instance is restored through the new namespace.
          - It preserves unrelated resume behavior and plans regression evidence for that unchanged behavior.
          - It plans direct behavioral evidence that a legacy iteration record is rejected rather than converted or restored.

          Fail if it plans dual-read, aliases, fallback parsing, conversion of old records, deprecation periods, version gates, or any other backward-compatibility or migration mechanism not requested by the task. Also fail if it treats existing code, fixtures, persisted-record risk, public-format status, or general safety as authority for keeping the old namespace.

  - description: 'initial plan: scope explicitly required coexistence to its target'
    vars:
      task: file://cases/explicit-coexistence-support.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: plan/explicit-coexistence-scope
        value: |
          Judge the plan by its executable meaning, not by exact wording or table shape. Pass only if it plans current-only writes with `call-path:` and dual-read restoration for both new and legacy resume records for the explicitly stated reading scope.

          The plan must treat resume-record reading as the only authorized coexistence target. It must not add stored-record rewriting, data migration or backfill, API aliases, event upcasters, Read Model rebuilds, or legacy writes. It must plan direct behavioral evidence for both accepted record forms and for new records using only the current namespace. Fail if it removes the explicitly required legacy reader, expands coexistence into an unrequested compatibility or migration target, or requires a deadline, deprecation period, removal condition, or migration schedule that the requirement source does not request.
