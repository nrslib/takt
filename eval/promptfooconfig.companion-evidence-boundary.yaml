# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: 'TAKT facet eval: Companion moderator evidence boundary'

prompts:
  - file://prompts/companion-evidence-boundary.phase1.md

providers:
  - id: openai:codex-sdk
    label: codex
    config:
      working_dir: fixtures/companion-family-boundary
      sandbox_mode: read-only
      approval_policy: never
      skip_git_repo_check: true
      model_reasoning_effort: low

tests:
  - description: 'moderator: reject duplicate proof, adjacent scope, and unsupported hidden-path claims'
    vars:
      task: file://cases/companion-evidence-boundary.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: companion-moderator/positive-reverse-boundary
        value: |
          Judge the response as evidence adjudication, not an early repository
          scan. Pass only if it (positive) accepts C-01 as the evidenced CLI
          normalization-family gap and rejects C-02 as a duplicate within the
          current list without merging or replacing either finding, (reverse)
          rejects C-03 because telemetry labels are a separate family, and
          (boundary) rejects or marks C-04 unsupported because no evidence
          establishes the hidden mobile path. Fail if it invents a new finding,
          claims to have scanned the repository, merges findings, or accepts an
          item merely because it is nearby.
