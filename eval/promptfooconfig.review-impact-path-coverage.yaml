# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# TAKT ファセット評価: コーディングレビューで同じ原因の影響経路を確認する。
# Run via npm run eval:prompts:review-impact-path-coverage

description: 'TAKT ファセット評価: ピアレビューが同じ原因の影響経路を一度に確認する'

prompts:
  - file://prompts/review-impact-path-coverage.phase1.md

providers:
  - id: file://providers/cli-review.mjs
    label: claude-opus-5
    config:
      cli: claude
      model: claude-opus-5
      working_dir: fixtures/review-impact-path-coverage
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-luna-max
    config:
      cli: codex
      model: gpt-5.6-luna
      reasoning_effort: max
      working_dir: fixtures/review-impact-path-coverage
      isolate_working_dir: true
  - id: file://providers/cli-review.mjs
    label: codex-sol-high
    config:
      cli: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      working_dir: fixtures/review-impact-path-coverage
      isolate_working_dir: true

defaultTest:
  options:
    provider:
      id: openai:codex-sdk
      config:
        sandbox_mode: read-only
        approval_policy: never
        skip_git_repo_check: true
        model_reasoning_effort: low

evaluateOptions:
  maxConcurrency: 3

tests:
  - description: 'レビュー: 帰属の規則に同じ原因で影響する経路をすべて報告する'
    vars:
      task: file://cases/review-impact-path-coverage-task.md
      previous_response: ''
    assert:
      - type: llm-rubric
        metric: review/impact-path-coverage
        value: |
          見出し、表形式、文言ではなく、同じ原因で影響する経路を実質的に確認できたかを判定する。レビューが REJECT し、src/runtime-state.js、src/batch.js、src/parallel.js、src/relay.js、src/resume.js、src/analytics.js、tests/reporting.test.js にある報告書の帰属問題を漏れなく報告し、イベントを生成した実行コンテキストという同じ条件または根本原因へ結び付けた場合だけ合格とする。代表箇所だけで止まる、未確認経路を確認済みと扱う、または正しく動作する直接生成経路と emitter 経路を欠陥として報告した場合は不合格とする。
