name: Nix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flake:
    name: Build and test Nix flake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3
      - run: nix flake check -L
      - run: nix build .#default -L
      - run: |
          package_root="result/lib/node_modules/takt"
          for provider in claude-sdk codex opencode pi deepseek-harness; do
            test -f "$package_root/managed/$provider/package.json"
            test -f "$package_root/managed/$provider/package-lock.json"
          done
          for sdk in @anthropic-ai/claude-agent-sdk @openai/codex-sdk @opencode-ai/sdk @opencode/client @earendil-works/pi-ai @earendil-works/pi-coding-agent; do
            test ! -d "$package_root/node_modules/$sdk"
          done
      - name: Verify the takt wrapper exposes npm for takt install
        run: |
          npm_bin=""
          while read -r dir; do
            if [ -x "$dir/npm" ]; then
              npm_bin="$dir/npm"
              break
            fi
          done < <(grep -o '/nix/store/[^:" ]*/bin' result/bin/takt | sort -u)
          test -n "$npm_bin"
          "$npm_bin" --version
      - run: NO_UPDATE_NOTIFIER=1 ./result/bin/takt --version
      - run: NO_UPDATE_NOTIFIER=1 nix run .#default -- --version
      - run: |
          nix profile install .#default --profile "$RUNNER_TEMP/takt-profile"
          NO_UPDATE_NOTIFIER=1 "$RUNNER_TEMP/takt-profile/bin/takt" --version
