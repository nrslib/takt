caccia:
  enabled: true

workflow_command_gates:
  custom_scripts: true

workflow_overrides:
  steps:
    implement:
      quality_gates:
        - "Run `npm run build` and verify the build succeeds"
        - "Run `npm run lint` and verify lint passes"
        - "Identify the specific test files covering the code you changed and run them as whole files (e.g. `npm test -- src/__tests__/<name>.test.ts`; integration test files work the same way). Do not filter to individual test cases. If no covering test files exist, state that explicitly in your report. All must pass"
        - "Run `npm test` after completing edits and verify the fast unit gate passes"
        - "Run `npm run test:it` after the unit gate and verify the light integration gate passes"
        - "Besides the required `npm test`, `npm run test:it`, the specific covering test files above, and checks explicitly required by the user request or accepted plan, do not run unrelated full suites or whole test groups. Run an affected broader group only when you changed test infrastructure itself (vitest configs, test runner scripts, shared fixtures/setup), or re-run the exact failing command when fixing a failure reported from a quality gate or final-gate run. Run test commands sequentially and do not duplicate overlapping runs"
        - "Run `npm run test:e2e:smoke` when the user request or accepted plan explicitly requires it, or when the changed behavior affects CLI startup, workflow execution, provider selection, config loading, sandboxing, or runtime preparation, and verify the smoke E2E passes"
    reimplement:
      quality_gates:
        - "Run `npm run build` and verify the build succeeds"
        - "Run `npm run lint` and verify lint passes"
        - "Identify the specific test files covering the code you changed and run them as whole files (e.g. `npm test -- src/__tests__/<name>.test.ts`; integration test files work the same way). Do not filter to individual test cases. If no covering test files exist, state that explicitly in your report. All must pass"
        - "Run `npm test` after completing edits and verify the fast unit gate passes"
        - "Run `npm run test:it` after the unit gate and verify the light integration gate passes"
        - "Besides the required `npm test`, `npm run test:it`, the specific covering test files above, and checks explicitly required by the user request or accepted plan, do not run unrelated full suites or whole test groups. Run an affected broader group only when you changed test infrastructure itself (vitest configs, test runner scripts, shared fixtures/setup), or re-run the exact failing command when fixing a failure reported from a quality gate or final-gate run. Run test commands sequentially and do not duplicate overlapping runs"
        - "Run `npm run test:e2e:smoke` when the user request or accepted plan explicitly requires it, or when the changed behavior affects CLI startup, workflow execution, provider selection, config loading, sandboxing, or runtime preparation, and verify the smoke E2E passes"
    fix:
      quality_gates:
        # Verify IT classification when IT files or classification inputs change from HEAD.
        - &changed-it-wiring
          type: command
          run_at: before_report
          name: changed-it-wiring
          command: npm run test:it:changed-wiring
          covers:
            - npm test -- src/__tests__/releaseVerificationWiring.test.ts
          guidance: >-
            This gate fulfills the repository's standalone integration-test classification check.
            The wrapper runs npm test -- src/__tests__/releaseVerificationWiring.test.ts
            by itself when integration tests or their classification inputs change against HEAD.
            Run the other affected test files as targeted tests, including each added or
            changed heavy IT. If classification fails, use the private log to diagnose the problem.
        - "Run `npm run build` and verify the build succeeds"
        - "Run `npm run lint` and verify lint passes"
        - "Identify the specific test files covering the code you changed and run them as whole files (e.g. `npm test -- src/__tests__/<name>.test.ts`; integration test files work the same way). Do not filter to individual test cases. If no covering test files exist, state that explicitly in your report. All must pass"
        - "Run `npm test` after completing edits and verify the fast unit gate passes"
        - "Run `npm run test:it` after the unit gate and verify the light integration gate passes"
        - "Besides the required `npm test`, `npm run test:it`, the specific covering test files above, and checks explicitly required by the user request or accepted plan, do not run unrelated full suites or whole test groups. Run an affected broader group only when you changed test infrastructure itself (vitest configs, test runner scripts, shared fixtures/setup), or re-run the exact failing command when fixing a failure reported from a quality gate or final-gate run. Run test commands sequentially and do not duplicate overlapping runs"
        - "Run `npm run test:e2e:smoke` when the user request or accepted plan explicitly requires it, or when the changed behavior affects CLI startup, workflow execution, provider selection, config loading, sandboxing, or runtime preparation, and verify the smoke E2E passes"
    fix-retry:
      quality_gates:
        - *changed-it-wiring
    ai-antipattern-fix:
      quality_gates:
        - "Run `npm run build` and verify the build succeeds"
        - "Run `npm run lint` and verify lint passes"
        - "Identify the specific test files covering the code you changed and run them as whole files (e.g. `npm test -- src/__tests__/<name>.test.ts`; integration test files work the same way). Do not filter to individual test cases. If no covering test files exist, state that explicitly in your report. All must pass"
        - "Run `npm test` after completing edits and verify the fast unit gate passes"
        - "Run `npm run test:it` after the unit gate and verify the light integration gate passes"
        - "Besides the required `npm test`, `npm run test:it`, the specific covering test files above, and checks explicitly required by the user request or accepted plan, do not run unrelated full suites or whole test groups. Run an affected broader group only when you changed test infrastructure itself (vitest configs, test runner scripts, shared fixtures/setup), or re-run the exact failing command when fixing a failure reported from a quality gate or final-gate run. Run test commands sequentially and do not duplicate overlapping runs"
        - "Run `npm run test:e2e:smoke` when the user request or accepted plan explicitly requires it, or when the changed behavior affects CLI startup, workflow execution, provider selection, config loading, sandboxing, or runtime preparation, and verify the smoke E2E passes"
    merge-readiness-review:
      quality_gates:
        - "Run `npm test` and verify unit tests pass. On failure, quote the failing output in your report and return needs_fix"
        - "Run `npm run test:it` and verify integration tests pass. On failure, quote the failing output in your report and return needs_fix"
        - "Run `npm run test:e2e:mock` and verify full mock E2E tests pass. On failure, quote the failing output in your report and return needs_fix"

manager:
  workflows:
    - takt-default: TAKT本体の通常の機能追加や不具合修正。TAKT固有の計画・テスト・レビューを行う
    - simple: 1〜2ファイルで済む小さな修正。軽い流れで進める
